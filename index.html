<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GenAI Playbook Library</title>
<style>
/* Layout: plain white library shelf — parts as sections, 4:5 cards, popup reader split infographic | article */
:root{
  --bg:#ffffff; --ink:#14203f; --muted:#5d6782; --line:#e3e7ef; --soft:#f4f6fa; --navy:#1e2761; --accent:#2f5bd3;
  --display:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:48px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;letter-spacing:-.015em;font-size:clamp(26px,3.4vw,36px);line-height:1.08;margin:8px 0 6px;color:var(--navy);text-wrap:balance}
.sub{color:var(--muted);margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:500 13px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.filters button:focus-visible,.card:focus-visible,.mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin-top:44px}
.ph{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.ph .pn{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent);white-space:nowrap}
.ph h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:28px 22px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.thumb{position:relative;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft);transition:transform .18s ease,box-shadow .18s ease}
.card:hover .thumb{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(20,32,63,.35)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.txt{height:100%;padding:20px 18px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.txt .q{font-family:var(--display);font-weight:700;letter-spacing:-.01em;font-size:22px;line-height:1.15;color:var(--navy)}
.txt .ex{font-size:12.5px;color:var(--muted);line-height:1.5;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent)}
.badge{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;background:rgba(255,255,255,.94);color:var(--navy);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.ct{font-weight:600;font-size:14.5px;line-height:1.3;color:var(--ink)}
.cm{font-size:12px;color:var(--muted);margin-top:-6px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(14,22,48,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--bg);width:min(1240px,100%);height:min(94vh,100%);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.mh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh .t{flex:1;min-width:0}
.mh .t small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.mh .t strong{display:block;font-family:var(--display);font-weight:700;font-size:22px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn{font:500 13px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);height:36px;min-width:36px;padding:0 10px;border-radius:6px;cursor:pointer}
.mbtn:hover{background:var(--soft)}
.mb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mb.solo{grid-template-columns:minmax(0,1fr)}
.pics{overflow:auto;background:var(--soft);padding:20px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line)}
.pics a{display:block}
.pics img{width:100%;display:block;border-radius:4px;box-shadow:0 2px 10px -4px rgba(20,32,63,.25);background:#fff}
.art{overflow:auto;padding:26px 34px 48px}
.art>div{max-width:68ch;margin:0 auto}
.mb.solo .art>div{max-width:780px}
.art p{margin:0 0 .9em}
.art h3,.art h4{font-family:var(--display);font-weight:700;color:var(--navy)}
.art strong{color:var(--navy)}
.art ul,.art ol{padding-left:1.2em;margin:0 0 1em}
.art li{margin-bottom:.45em}
.art a{color:var(--accent);word-break:break-all}
.tw{overflow-x:auto;margin:0 0 1.2em;border:1px solid var(--line);border-radius:6px}
.art table{border-collapse:collapse;width:100%;font-size:13px}
.art th,.art td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.art thead th,.art tr:first-child th{background:var(--soft)}
.art td p,.art th p{margin:0}
@media (max-width:820px){
  .mb{grid-template-columns:minmax(0,1fr);overflow:auto;display:block}
  .pics{overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .art{overflow:visible;padding:20px 18px 40px}
  .mh .t strong{font-size:18px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){.thumb{transition:none}.card:hover .thumb{transform:none}}
body.lock{overflow:hidden}
</style>
</head>

<script id="data" type="application/json">{"parts": ["Part 1 — Awareness: Understand the Landscape", "Part 2 — Adoption: Get it Used", "Part 3 — ROI: Prove it", "Part 4 — Safety and Governance", "Part 5 — Architecture: What Leaders are Being Sold", "Part 6 — For your Teams"], "articles": [{"part": 0, "title": "Creating Value", "kind": "Article", "imgs": ["imgs/a00_0.jpg"], "html": "<p><strong>First, productivity:<\/strong> summarising reports, preparing\npresentations, drafting emails and converting complex information into\ndecision-ready insights.<\/p>\n<p><strong>Second, knowledge:<\/strong> helping teams search SOPs,\nresearch documents, product information and internal knowledge more\neffectively.<\/p>\n<p><strong>Third, innovation:<\/strong> supporting idea generation,\nmarket research, product documentation and faster experimentation.<\/p>\n<p><strong>Fourth, decision-making:<\/strong> analysing business data,\nidentifying patterns and developing scenarios for management review.<\/p>\n<p><strong>Let us begin with a simple question:<\/strong><\/p>\n<p>Which repetitive activity currently consumes your team’s time but\ndoes not necessarily require their highest level of expertise?<\/p>\n<p>By the end of the session / engagement / discussion, the objective is\nthat every leader identifies at least 1-3 practical Gen AI use case that\ncan save time, improve quality or accelerate innovation<\/p>", "excerpt": "First, productivity: summarising reports, preparing presentations, drafting emails and converting complex information into decision-ready insights. Second, know"}, {"part": 0, "title": "AI Terms", "kind": "Article", "imgs": [], "html": "<div class=\"tw\"><table><thead><tr>\n<th><strong>Category<\/strong><\/th>\n<th><strong>Term<\/strong><\/th>\n<th><strong>Definition<\/strong><\/th>\n<th><strong>Relevance<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Foundational<\/td>\n<td>Artificial Intelligence (AI)<\/td>\n<td>Computer systems performing tasks that typically require human\nintelligence — reasoning, perception, language, decision-making.<\/td>\n<td>The umbrella term for the entire strategic conversation; sets scope\nfor board discussions and investment cases.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Machine Learning (ML)<\/td>\n<td>A subset of AI where systems learn patterns from data rather than\nfollowing explicit programmed rules.<\/td>\n<td>Most enterprise \"AI\" initiatives are actually ML; understanding this\nhelps set realistic expectations on data needs.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Deep Learning<\/td>\n<td>A type of ML using multi-layered neural networks, effective at\ncomplex pattern recognition (images, speech, text).<\/td>\n<td>Powers most modern breakthroughs; explains why compute and data\nvolume drive cost and capability.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Neural Network<\/td>\n<td>A model architecture loosely inspired by the brain, made of layers\nof interconnected nodes that process data.<\/td>\n<td>Underlying structure of nearly all modern AI; useful for\ninterpreting vendor technical claims.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Generative AI (GenAI)<\/td>\n<td>AI that creates new content — text, images, code, audio — rather\nthan just classifying or predicting.<\/td>\n<td>The category behind ChatGPT, Claude, etc.; the primary driver of\ncurrent enterprise AI investment.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Large Language Model (LLM)<\/td>\n<td>A GenAI model trained on vast text data to understand and generate\nhuman language.<\/td>\n<td>The engine behind most GenAI products; underpins build-vs-buy\ndecisions for AI tools.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Small Language Model (SLM)<\/td>\n<td>A compact, lower-parameter language model optimized for efficiency,\nspeed, and on-device or low-cost use.<\/td>\n<td>Enables cheaper, faster, more private deployments for narrow tasks —\nrelevant for cost-sensitive scale-ups.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Algorithm<\/td>\n<td>A set of rules or steps a computer follows to solve a problem or\ncomplete a task.<\/td>\n<td>Basic vocabulary needed to engage credibly with technical teams and\nvendors.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Model<\/td>\n<td>The trained system that makes predictions or generates outputs,\nproduced by running an algorithm on data.<\/td>\n<td>The \"product\" of AI development; distinguishing \"the model\" from\n\"the app\" clarifies vendor conversations.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Weights / Parameters<\/td>\n<td>The internal numerical values a model adjusts during training to\nencode learned patterns.<\/td>\n<td>Roughly correlates with model scale and cost; \"billions of\nparameters\" is a common vendor sizing metric.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Inference<\/td>\n<td>The process of a trained model generating an output for a new input\n(as opposed to training).<\/td>\n<td>The ongoing, recurring cost of running AI in production — distinct\nfrom one-time training cost, matters for budgeting.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Natural Language Processing (NLP)<\/td>\n<td>The field of AI focused on enabling computers to understand,\ninterpret, and generate human language.<\/td>\n<td>The technical foundation behind chatbots, document analysis, and\ntext-based automation tools.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Computer Vision<\/td>\n<td>The field of AI focused on enabling machines to interpret and\nprocess visual information from images or video.<\/td>\n<td>Powers use cases like quality inspection, safety monitoring, and\ndocument scanning in manufacturing/retail.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Transformer Architecture<\/td>\n<td>A neural network design that processes entire sequences of data at\nonce using \"attention,\" enabling modern LLMs.<\/td>\n<td>The technical breakthrough behind the current AI boom; useful\ncontext for why LLMs improved so rapidly since 2017.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Training Data<\/td>\n<td>The dataset used to teach a model patterns and relationships.<\/td>\n<td>Data quality and ownership are competitive assets; \"garbage in,\ngarbage out\" applies directly to ROI.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Fine-Tuning<\/td>\n<td>Further training a general-purpose model on a smaller,\ndomain-specific dataset to specialize it.<\/td>\n<td>Key lever for customizing AI to your industry/company without\nbuilding a model from scratch — faster, cheaper than full\ndevelopment.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Prompt Engineering<\/td>\n<td>Crafting inputs (prompts) to guide an AI model toward better, more\nuseful outputs.<\/td>\n<td>Low-cost, high-leverage skill; often the fastest path to value from\nexisting tools, worth investing in workforce training.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>RAG (Retrieval-Augmented Generation)<\/td>\n<td>A technique where a model retrieves relevant company/external data\nbefore generating a response, improving accuracy.<\/td>\n<td>Central to enterprise GenAI deployments — lets AI answer using your\nproprietary documents securely, without retraining.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Hallucination<\/td>\n<td>When an AI model generates plausible-sounding but factually\nincorrect or fabricated information.<\/td>\n<td>The single biggest reputational and operational risk in GenAI\ndeployment; drives the need for human-in-the-loop review.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Context Window<\/td>\n<td>The amount of text/information a model can \"see\" and consider at\nonce when generating a response.<\/td>\n<td>Determines how much company data (documents, chat history) a tool\ncan process in one interaction — a practical capability constraint.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Token<\/td>\n<td>A chunk of text (roughly a word or part of a word) that models\nprocess; usage is often billed per token.<\/td>\n<td>Directly tied to API and licensing costs; relevant to budgeting and\nvendor negotiations.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Multimodal AI<\/td>\n<td>Models that can process and generate multiple content types — text,\nimages, audio, video — together.<\/td>\n<td>Expands use cases beyond text (e.g., analyzing scanned documents,\nvideo, or design mockups), widening the addressable business problem\nset.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Embedding<\/td>\n<td>A numerical representation of text/data that captures meaning,\nallowing similarity comparisons between items.<\/td>\n<td>Powers search, recommendations, and RAG systems; helps explain how\nAI \"understands\" unstructured company data.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Vector Database<\/td>\n<td>A specialized database that stores embeddings for fast similarity\nsearch.<\/td>\n<td>Common infrastructure component in enterprise AI stacks; relevant\nwhen evaluating technical architecture proposals.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Reinforcement Learning from Human Feedback (RLHF)<\/td>\n<td>A training method where human ratings of model outputs are used to\nrefine model behavior.<\/td>\n<td>Explains why newer models feel more \"aligned\" and helpful; relevant\nto vendor claims about safety and quality.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Zero-shot / Few-shot Learning<\/td>\n<td>A model's ability to perform a task with no examples (zero-shot) or\njust a few examples (few-shot) provided in the prompt.<\/td>\n<td>Reduces the need for costly custom training; affects how quickly a\ntool can be adapted to a new task.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Chain-of-Thought Reasoning<\/td>\n<td>A technique where a model breaks a problem into intermediate steps\nbefore producing a final answer.<\/td>\n<td>Improves accuracy on complex tasks; explains why some \"reasoning\"\nmodels are slower but more reliable.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Synthetic Data<\/td>\n<td>Artificially generated data used to train or supplement AI models\nwhen real data is scarce or sensitive.<\/td>\n<td>Reduces privacy risk and data-scarcity constraints in regulated or\ndata-poor environments.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Model Distillation<\/td>\n<td>Compressing a large, expensive model into a smaller, cheaper one\nwhile retaining most of its capability.<\/td>\n<td>A key cost-reduction strategy for deploying AI at scale without\nsacrificing much performance.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>AI Agent<\/td>\n<td>An AI system that can autonomously plan and execute multi-step\ntasks, often using tools or software on a user's behalf.<\/td>\n<td>The next wave beyond chatbots — agents can complete workflows\n(booking, research, coding), shifting AI from \"assistant\" to\n\"worker.\"<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>API (Application Programming Interface)<\/td>\n<td>A technical interface allowing one software system to send requests\nto and receive data from another.<\/td>\n<td>The standard way companies integrate AI models into existing\ntools/systems; central to build-vs-buy technical conversations.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>MCP (Model Context Protocol)<\/td>\n<td>An emerging standard letting AI models securely connect to external\ntools, data sources, and apps.<\/td>\n<td>Reduces integration cost and vendor lock-in; relevant when\nevaluating platform strategy and interoperability.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Automation vs. Augmentation<\/td>\n<td>Automation replaces a task entirely; augmentation enhances human\nperformance on a task.<\/td>\n<td>Frames the workforce conversation — most near-term enterprise AI\nvalue comes from augmentation, not replacement.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Copilot<\/td>\n<td>An AI assistant embedded within existing software (e.g., email,\nspreadsheets) to support a user in real time.<\/td>\n<td>The dominant enterprise adoption pattern — lower change-management\nburden than standalone AI tools.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Model as a Service (MaaS)<\/td>\n<td>Accessing AI models via subscription/API rather than owning the\nunderlying infrastructure.<\/td>\n<td>The default enterprise consumption model; affects cost structure\n(opex vs. capex) and speed to deployment.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Chatbot vs. Agentic AI<\/td>\n<td>A chatbot responds conversationally; agentic AI takes independent\naction across multiple steps or systems.<\/td>\n<td>Marketing language often blurs this distinction; important for\naccurately scoping vendor capability claims.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Orchestration<\/td>\n<td>Coordinating multiple AI models, tools, or agents to complete a\ncomplex, multi-part task.<\/td>\n<td>Increasingly the differentiator between basic AI tools and\nenterprise-grade AI systems.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Latency<\/td>\n<td>The time delay between a request to an AI system and receiving its\nresponse.<\/td>\n<td>Affects user experience and viability for real-time use cases like\ncustomer service or trading.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Sandbox Environment<\/td>\n<td>An isolated testing environment where AI tools can be trialed safely\nwithout affecting live systems or data.<\/td>\n<td>Standard best practice for piloting new AI tools before\nenterprise-wide rollout.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Integration Layer / Middleware<\/td>\n<td>Software that connects AI models to existing enterprise systems\n(ERP, CRM, data warehouses).<\/td>\n<td>Often the largest hidden cost in AI projects — the model is rarely\nthe hard part, integration is.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Legacy System Compatibility<\/td>\n<td>The degree to which existing older IT infrastructure can support or\nintegrate with new AI tools.<\/td>\n<td>A common blocker in traditional industries (manufacturing, cement,\ntextiles); shapes realistic implementation timelines.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>AI Bias<\/td>\n<td>Systematic errors in AI outputs that unfairly favor or disadvantage\nparticular groups, often inherited from training data.<\/td>\n<td>Legal, reputational, and regulatory exposure; requires explicit\ngovernance in hiring, lending, and customer-facing use cases.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Explainability / Interpretability<\/td>\n<td>The degree to which humans can understand why an AI model produced a\ngiven output.<\/td>\n<td>Critical in regulated industries (finance, healthcare) where\ndecisions must be auditable and defensible.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Data Privacy<\/td>\n<td>Protections governing how personal or sensitive data is collected,\nused, and stored by AI systems.<\/td>\n<td>Governs vendor contracts, especially around whether client data is\nused to train third-party models.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>AI Governance<\/td>\n<td>The policies, roles, and controls an organization puts in place to\nmanage AI risk and ensure responsible use.<\/td>\n<td>Board-level responsibility increasingly expected by regulators and\ninvestors; foundational to scaling AI safely.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Shadow AI<\/td>\n<td>Unsanctioned use of AI tools by employees outside approved, governed\nchannels.<\/td>\n<td>A near-universal, underestimated risk; drives the urgency of clear\nusage policy and approved-tool lists.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Guardrails<\/td>\n<td>Technical and policy controls that constrain what an AI system can\nsay or do.<\/td>\n<td>The practical mechanism for translating governance policy into\ndeployed system behavior.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Human-in-the-Loop<\/td>\n<td>A design principle requiring human review or approval at key points\nin an AI-driven process.<\/td>\n<td>The primary risk mitigation for high-stakes decisions (legal,\nmedical, financial); a standard board expectation.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Data Residency / Sovereignty<\/td>\n<td>Legal requirements dictating where data is physically stored and\nprocessed, often by country or region.<\/td>\n<td>Directly relevant for Middle East/India operations with cross-border\ndata regulations; a common vendor due-diligence item.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Model Drift<\/td>\n<td>The gradual degradation of a model's accuracy over time as\nreal-world data diverges from its training data.<\/td>\n<td>Justifies ongoing monitoring budgets — AI systems are not \"set and\nforget.\"<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Responsible AI<\/td>\n<td>An organizational commitment to fairness, transparency, safety, and\naccountability in AI deployment.<\/td>\n<td>Increasingly a procurement and brand-trust requirement, not just an\nethics exercise.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>IP / Copyright Risk<\/td>\n<td>Legal uncertainty around ownership of AI-generated content and use\nof copyrighted material in training data.<\/td>\n<td>Directly affects usage policy for AI-generated marketing, code, and\nclient deliverables.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Model Card<\/td>\n<td>A standardized document describing a model's capabilities,\nlimitations, training data, and intended use.<\/td>\n<td>A useful due-diligence artifact when evaluating and comparing AI\nvendors.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Red Teaming<\/td>\n<td>Deliberately probing an AI system for weaknesses, biases, or failure\nmodes before deployment.<\/td>\n<td>A recognized best practice for de-risking AI systems ahead of\nenterprise-wide rollout.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Regulatory Compliance (AI-specific)<\/td>\n<td>Adherence to emerging laws governing AI use (e.g., EU AI Act,\nsector-specific rules).<\/td>\n<td>An evolving compliance landscape that legal and risk teams must\ntrack alongside standard data regulation.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Foundation Model<\/td>\n<td>A large, general-purpose model (e.g., GPT, Claude, Gemini) trained\non broad data, adaptable to many downstream tasks.<\/td>\n<td>Underlies build-vs-buy strategy — few companies build these; most\nbuild on top of them.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Open Source vs. Closed/Proprietary Models<\/td>\n<td>Open models have publicly available code/weights; closed models are\naccessed only via a vendor's paid interface.<\/td>\n<td>Shapes cost, control, and customization trade-offs — open models\noffer flexibility, closed models offer support and reliability.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Compute<\/td>\n<td>The processing power (typically specialized chips like GPUs)\nrequired to train and run AI models.<\/td>\n<td>The primary cost driver and supply-chain bottleneck in AI; relevant\nto infrastructure and cloud vendor strategy.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AI Maturity Model<\/td>\n<td>A framework assessing an organization's AI capability across stages,\nfrom ad hoc experimentation to full integration.<\/td>\n<td>Useful diagnostic for benchmarking your organization's AI adoption\nstage and setting a realistic roadmap.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Total Cost of Ownership (TCO) for AI<\/td>\n<td>The full cost of an AI initiative, including licensing, integration,\nchange management, and ongoing monitoring — not just the tool\nprice.<\/td>\n<td>Prevents underestimating AI project budgets; licensing is often the\nsmallest line item.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Change Management (for AI)<\/td>\n<td>The structured process of managing workforce adoption, training, and\ncultural shift around new AI tools.<\/td>\n<td>The most common point of AI initiative failure is not the technology\n— it's adoption; this is where leadership attention has highest\nROI.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Digital Twin<\/td>\n<td>A virtual, data-driven replica of a physical asset, process, or\nsystem used for simulation and forecasting.<\/td>\n<td>Common in manufacturing/energy for predictive maintenance and\nscenario planning — a tangible, high-ROI AI use case.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Center of Excellence (CoE)<\/td>\n<td>A dedicated internal team responsible for driving AI strategy,\nstandards, and capability-building across an organization.<\/td>\n<td>A common structural choice for scaling AI beyond isolated pilots\ninto enterprise-wide impact.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Proof of Concept (PoC) vs. Production<\/td>\n<td>A PoC tests feasibility on a small scale; production deployment\noperates at full scale with real users and stakes.<\/td>\n<td>Explains why many \"successful\" AI pilots never scale — production\nrequires different rigor, cost, and governance.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AI Use Case Prioritization<\/td>\n<td>The structured process of ranking potential AI applications by\nbusiness value versus implementation feasibility.<\/td>\n<td>Prevents scattershot experimentation; ensures AI investment targets\nhighest-impact business problems first.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Build vs. Buy vs. Partner<\/td>\n<td>The strategic decision of whether to develop AI in-house, purchase\nexisting tools, or partner with vendors/providers.<\/td>\n<td>The core strategic decision framework for nearly every AI\ninitiative; balances cost, control, and speed.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Vendor Lock-in<\/td>\n<td>Dependency on a single AI provider's technology, making it costly or\ndifficult to switch providers later.<\/td>\n<td>A key risk factor in long-term contract negotiations and platform\narchitecture decisions.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AGI (Artificial General Intelligence)<\/td>\n<td>A hypothetical future AI with human-level reasoning and adaptability\nacross any intellectual task, not yet achieved.<\/td>\n<td>Distinguishes today's practical AI capability from speculative\nlong-term scenarios — useful for grounding realistic strategy\ndiscussions.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AI ROI Measurement<\/td>\n<td>Frameworks for quantifying the business value generated by AI\ninitiatives against their cost.<\/td>\n<td>A frequent board-level question; hard to answer without pre-defined\nbaseline metrics before deployment.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Workforce Reskilling<\/td>\n<td>Structured training programs to build employee capability in working\nalongside AI tools.<\/td>\n<td>Determines whether AI investment translates into actual productivity\ngains rather than idle licenses.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AI Adoption Curve<\/td>\n<td>The pattern by which employees or organizations move from awareness\nto experimentation to embedded daily use.<\/td>\n<td>Helps leaders set realistic timelines and identify where an\norganization is stalling in the adoption journey.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Composable AI Stack<\/td>\n<td>An architecture built from interchangeable AI components (models,\ndata layers, tools) rather than one monolithic system.<\/td>\n<td>Supports flexibility and reduces vendor lock-in as the AI landscape\nevolves quickly.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Data Moat<\/td>\n<td>A durable competitive advantage derived from proprietary data that\ncompetitors cannot easily replicate or access.<\/td>\n<td>A key lens for identifying where AI can create defensible, long-term\ndifferentiation rather than easily copied features.<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Category Term Definition Relevance Foundational Artificial Intelligence (AI) Computer systems performing tasks that typically require human intelligence — reaso"}, {"part": 0, "title": "Context Window", "kind": "Article", "imgs": ["imgs/a02_0.jpg"], "html": "<p>Every leader who's used ChatGPT or Claude for an extended session has\nhit the same wall — the model starts ignoring an instruction given\ntwenty minutes ago, loses track of a detail from earlier in the\ndocument, or contradicts something it said three prompts back. The\ninstinct is to blame the model's intelligence. The actual cause is\nalmost always simpler: the conversation has outgrown its context\nwindow.<\/p>\n<p><strong>What the context window actually is<\/strong><\/p>\n<p>A context window is the total amount of text — your prompts, the\nmodel's replies, any documents or data pasted in — that the model can\n\"see\" at one time while generating a response. It isn't memory in the\nhuman sense. The model doesn't learn from the conversation or store it\nanywhere between messages. Each time it generates a reply, it's\nre-reading the entire visible conversation from scratch, token by token,\nwithin a fixed capacity. Once that capacity is full, something has to\ngive.<\/p>\n<p>Think of it less like memory and more like a desk. The model can only\nwork with what's physically laid out in front of it. A bigger desk means\nmore documents stay visible at once. But no desk is infinite, and when a\nnew document comes in and the desk is full, the oldest one gets pushed\noff the edge — not forgotten exactly, just no longer in view.<\/p>\n<p><strong>Why this matters more than most people realize<\/strong><\/p>\n<p>This isn't a minor technical footnote — it's the single most common\nreason AI tools feel unreliable in real business use:<\/p>\n<ul>\n<li><p>A long client email thread gets pasted in for analysis, and the\nmodel's response ignores the nuance from the first few messages —\nbecause by the time it generated the reply, those tokens had scrolled\nout of the visible window.<\/p><\/li>\n<li><p>A multi-hour working session drafting a strategy document starts\nproducing inconsistent recommendations — not because the model changed\nits mind, but because the instructions that shaped its early output are\nno longer part of what it's reading.<\/p><\/li>\n<li><p>A long back-and-forth about a dataset leads to the model\n\"forgetting\" a constraint stated at the very start, while still\nperfectly recalling something said two messages ago.<\/p><\/li>\n<\/ul>\n<p>None of this is the model being unreliable in the way a person would\nbe. It's a fixed architectural constraint, and it behaves the same way\nevery time once you understand the rule: what's outside the window\nsimply doesn't exist for that response.<\/p>\n<p><strong>Size varies — and size changes the calculation<\/strong><\/p>\n<p>Context windows differ sharply by model and vendor — some handle a\nfew thousand words, others handle hundreds of thousands of words' worth\nof tokens in a single window. A larger window doesn't eliminate the\nproblem, but it changes what's practical. A 10-page contract fits\ncomfortably in a large window with room to spare for discussion. A\n200-page due diligence file might not, regardless of window size, once\nyou add the back-and-forth needed to actually work through it.<\/p>\n<p>This is also why the same task can work well in one tool and fail in\nanother — it's often not a difference in reasoning quality, but a\ndifference in how much of the input the model could actually hold onto\nwhile producing the output.<\/p>\n<p><strong>What this means in practice for how work gets\nstructured<\/strong><\/p>\n<p>A few habits make the difference between fighting the context window\nand working with it:<\/p>\n<ul>\n<li><p><strong>Front-load what matters.<\/strong> If something is\nnon-negotiable — a constraint, a format requirement, a piece of data the\noutput depends on — restate it close to where you need it used, rather\nthan trusting it survived from ten messages earlier.<\/p><\/li>\n<li><p><strong>Chunk large documents.<\/strong> Instead of pasting an\nentire report and asking for a full analysis in one pass, work through\nit in sections. The output is more reliable, and it's easier to verify\nagainst the source.<\/p><\/li>\n<li><p><strong>Start fresh deliberately.<\/strong> When a conversation\nhas run long and responses start feeling inconsistent or repetitive,\nstarting a new session with a tight, well-structured prompt often\noutperforms continuing to push the old one further.<\/p><\/li>\n<li><p><strong>Don't assume persistence across sessions.<\/strong> A new\nconversation starts with an empty window — nothing from a previous chat\nis visible unless it's explicitly carried over or the tool has a\nseparate memory feature layered on top.<\/p><\/li>\n<\/ul>\n<p><strong>The underlying point for leaders<\/strong><\/p>\n<p>The context window isn't a flaw to work around once and forget about\n— it's a fixed resource, the same way compute budget or headcount is a\nfixed resource, and it needs to be managed with the same deliberateness.\nTreating it as infinite is how teams end up blaming the model for a\nfailure that was actually a workflow design problem. Understanding it\nprecisely — what's in view, what's fallen out of view, and when to reset\nrather than push on — is what separates AI use that stays reliable at\nscale from AI use that quietly degrades the longer a session runs.<\/p>\n\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Every leader who's used ChatGPT or Claude for an extended session has hit the same wall — the model starts ignoring an instruction given twenty minutes ago, los"}, {"part": 0, "title": "Awareness to Adoption to ROI", "kind": "Article", "imgs": ["imgs/a03_0.jpg"], "html": "<p><strong>Every Organisation Thinks It Is One Stage Ahead of Where It\nIs<\/strong><\/p>\n<p>Ask a leadership team where they are on AI and you will almost always\nhear the same answer. We are past the basics. We're scaling now. We just\nneed to show the returns.<\/p>\n<p>Then you walk the floor and find managers who have never opened the\ntool, a pilot that has been running for eleven months, and a finance\nteam that cannot say what any of it has saved because nobody wrote down\nwhat it cost before.<\/p>\n<p>There are three stages. Awareness, Adoption, ROI. Nobody skips one.\nOrganisations that believe they have skipped one have simply not noticed\nthat they are still standing in it.<\/p>\n<p><strong>Stage One: Awareness<\/strong><\/p>\n<p>Awareness is routinely mistaken for exposure. A town hall was held. A\nnewsletter went out. Two hundred licences were purchased. Everyone has\nheard of the technology, so surely the stage is complete.<\/p>\n<p>Being told is not the same as knowing what to do on Monday\nmorning.<\/p>\n<p>Real awareness has three markers. People can say what the technology\ndoes and what it does not do, because a team that cannot separate a\nchatbot from an agent cannot scope a use case or judge a vendor. Every\nfunction can name three tasks inside their own workflow where this\napplies, because specificity is awareness and enthusiasm is not. And\npeople know what they are allowed to do with company data, because where\nno safety position exists, the cautious stop and the reckless proceed,\nand the second group reaches the board first.<\/p>\n<p>The work here takes four to six weeks. Run a baseline before anything\ngoes live, one process at a time, capturing what it costs today in\nhours, error rate and rework. Put the leadership team in a room and make\nthem fail with the tool rather than watch a demo. Publish a two-page\nsafety position. Set a 90-Day North Star with one named owner and one\ndate.<\/p>\n<p><strong>The gate:<\/strong> a randomly chosen mid-level manager can\nname one task they now do differently, and one task they have\ndeliberately decided not to use AI for. Both halves matter. The second\nis what separates an aware organisation from an excited one.<\/p>\n<p><strong>Stage Two: Adoption<\/strong><\/p>\n<p>This is the longest stage and the one where most organisations\nquietly stop. It has two halves, and the gap between them is where the\nmoney goes to die.<\/p>\n<p>The first half is the pilot. Pilots are easy and almost always\nsucceed. You pick a motivated team, a clean process and a forgiving\nsuccess metric. Something works. Slides are made.<\/p>\n<p>The second half is scale, and it fails for reasons that have nothing\nto do with the technology. The process was never documented, so there is\nnothing to standardise. The workflow depends on one enthusiastic person\nwho has now been promoted. Nobody has budget authority for the licences\nbeyond the pilot. Middle managers were measured on the old outputs the\nentire time and correctly concluded that the new way was a personal risk\nwith no personal upside.<\/p>\n<p>Pilot purgatory is an organisational design problem wearing a\ntechnology costume. The tell is a company with fourteen successful\npilots and zero changed processes.<\/p>\n<p>What actually moves an organisation through this stage is\nunglamorous. Rewrite the standard operating procedure, not just the tool\naccess. Change what managers are measured on, because behaviour follows\nthe scorecard and nothing else. Name an owner for each workflow who has\nthe authority to stop the old version, since running both in parallel\nforever is how adoption dies politely. Retire the previous method on a\nstated date.<\/p>\n<p><strong>The gate:<\/strong> the old way of doing the work is switched\noff, and the organisation has not fallen over. Until something is turned\noff, nothing has been adopted. You have added a tool, not changed a\nprocess.<\/p>\n<p><strong>Stage Three: ROI<\/strong><\/p>\n<p>ROI is treated as a result. It should be treated as a discipline, and\nit is a stage rather than a finish line because most organisations reach\nit and discover they cannot prove anything.<\/p>\n<p>The failure is almost always structural, and it happened months\nearlier. There was no baseline. Nobody recorded what the process cost\nbefore the change, so every claim of saving becomes a negotiation\nbetween an optimistic function head and a sceptical CFO. The honest\nanswer is that nobody knows.<\/p>\n<p>The second failure is measuring activity instead of outcome. Licences\nissued, prompts run, hours of training delivered. These are inputs. They\ntell you what was spent, not what was returned. A dashboard full of\nusage statistics is a confession that the outcome was never defined.<\/p>\n<p>The third is attribution. Something improved during a period in which\nmany things changed. A defensible ROI claim requires a stated baseline,\na comparison population or period, and an honest note on what else was\nhappening at the time. Senior finance people respect a smaller number\nwith a clear method far more than a large number with a vague one.<\/p>\n<p>Done properly, this stage produces something more valuable than a\npercentage. It produces the ability to say which use cases are worth\nrepeating and which were expensive theatre, which is the only basis on\nwhich anyone should be approving the next round of investment.<\/p>\n<p><strong>The gate:<\/strong> the CFO will repeat your number to someone\noutside the organisation. Numbers that survive only inside the room that\nproduced them are not returns. They are morale.<\/p>\n<p><strong>The point of naming the stages<\/strong><\/p>\n<p>The value is not in the diagram. It is in the diagnosis, and\ndiagnosis is uncomfortable because most organisations that describe\nthemselves as scaling are still in Awareness, and most that describe\nthemselves as measuring ROI never left the pilot.<\/p>\n<p>Run the three gate tests before your next AI investment decision.\nThey take an afternoon.<\/p>\n<p>Whichever gate you fail first is where the work is. Everything you\nspend beyond that point is spent on the wrong stage.<strong><br />\n<\/strong><\/p>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Every Organisation Thinks It Is One Stage Ahead of Where It Is Ask a leadership team where they are on AI and you will almost always hear the same answer. We ar"}, {"part": 0, "title": "China vs US Models", "kind": "Article", "imgs": [], "html": "<p><strong>The Strategic Picture<\/strong><\/p>\n<p>The AI model race has bifurcated into two distinct ecosystems, and\nenterprise leaders can no longer treat \"which model\" as a purely\ntechnical decision — it's now a strategic, geopolitical, and compliance\nquestion.<\/p>\n<p><strong>The US approach<\/strong> is built on closed,\nheavily-capitalized frontier labs (OpenAI, Anthropic, Google, Meta)\ncompeting on raw capability, safety infrastructure, and enterprise\ntrust. Pricing is premium, but so is the assurance layer: audit trails,\nconstitutional safeguards, and enterprise governance tooling designed\nfor regulated industries.<\/p>\n<p><strong>The China approach<\/strong> — led by DeepSeek, Alibaba's\nQwen, and Z.AI — has pursued an open-weight, cost-efficiency strategy.\nThese models have closed the capability gap dramatically on reasoning\nand coding benchmarks while training at a fraction of the compute cost,\nand critically, many are released as open weights that any enterprise\ncan self-host.<\/p>\n<p><strong>Three Implications for Leaders<\/strong><\/p>\n<p><strong>1. Cost structures are diverging fast.<\/strong> Open-weight\nChinese models let cost-sensitive functions (internal tooling, customer\nservice triage, first-draft content) run on infrastructure you control,\noften at 10-20x lower inference cost. Reserve frontier closed models for\nhigh-stakes reasoning, client-facing outputs, and regulated\ndecisions.<\/p>\n<p><strong>2. Data sovereignty is now a board-level question.<\/strong>\nAny model touching customer PII, financial data, or IP needs a clear\nanswer to: where does inference happen, who can access logs, and under\nwhich jurisdiction's law. This applies equally to US cloud APIs and\nChinese self-hosted models — sovereignty risk isn't one-directional.<\/p>\n<p><strong>3. Open-weight doesn't mean vendor-lock-free, but it does\nmean audit-friendly.<\/strong> Enterprises in manufacturing, energy, and\nfinancial services should evaluate open-weight models specifically where\nexplainability and on-premise control matter more than bleeding-edge\ncapability.<\/p>\n<p><strong>The Bottom Line<\/strong><\/p>\n<p>Don't pick a geography — build a <strong>portfolio<\/strong>. Route by\ntask sensitivity and cost tolerance, not brand loyalty. Most enterprise\nGenAI stacks in 2026 will run 2-3 model families simultaneously.<\/p>", "excerpt": "The Strategic Picture The AI model race has bifurcated into two distinct ecosystems, and enterprise leaders can no longer treat \"which model\" as a purely techni"}, {"part": 0, "title": "Tool Selection", "kind": "Article", "imgs": [], "html": "<div class=\"tw\"><table><thead><tr>\n<th><strong>Tool<\/strong><\/th>\n<th><strong>Best For<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td><strong>Microsoft Copilot<\/strong><\/td>\n<td>Safe, enterprise-approved AI — deep M365 integration, good default\nfor regulated orgs<\/td>\n<\/tr><tr>\n<td><strong>Claude<\/strong><\/td>\n<td>Enterprise workflows — integrates with Chrome, Excel, PowerPoint;\nstrong reasoning, long documents<\/td>\n<\/tr><tr>\n<td><strong>Google Gemini<\/strong><\/td>\n<td>General-purpose assistant — deep Google Workspace integration,\nstrong multimodal (image, video, audio) input<\/td>\n<\/tr><tr>\n<td><strong>Google AI Studio<\/strong><\/td>\n<td>Prototyping — testing Gemini models, quick app scaffolding<\/td>\n<\/tr><tr>\n<td><strong>Perplexity<\/strong><\/td>\n<td>Research — citations, live web search, document Q&amp;A; also\nsurfaces Chinese models (DeepSeek etc.) well<\/td>\n<\/tr><tr>\n<td><strong>NotebookLM<\/strong><\/td>\n<td>Source-grounded research — upload your own documents, get answers\ntied to those sources; audio overviews for briefings<\/td>\n<\/tr><tr>\n<td><strong>Hugging Face<\/strong><\/td>\n<td>Open model discovery — browsing, comparing and evaluating\nopen-source models and datasets<\/td>\n<\/tr><tr>\n<td><strong>Ollama<\/strong><\/td>\n<td>Running open-source LLMs locally — full privacy, no API cost,\noffline use, good for sensitive data you can't send to the cloud<\/td>\n<\/tr><tr>\n<td><strong>LM Studio<\/strong><\/td>\n<td>Same local-LLM space as Ollama, but with a friendlier GUI — easier\nmodel browsing/switching, better for non-technical experimentation on\nyour own machine<\/td>\n<\/tr><tr>\n<td><strong>Gamma<\/strong><\/td>\n<td>Decks — prompt-to-presentation, faster than PowerPoint for internal\nand training material<\/td>\n<\/tr><tr>\n<td><strong>Google Stitch<\/strong><\/td>\n<td>Wireframing — fast UI/UX mockups from prompts<\/td>\n<\/tr><tr>\n<td><strong>Synthesia<\/strong><\/td>\n<td>Video — AI avatars, corporate training/explainer videos<\/td>\n<\/tr><tr>\n<td><strong>ElevenLabs<\/strong><\/td>\n<td>Audio — voice cloning, narration, realistic TTS<\/td>\n<\/tr><tr>\n<td><strong>Wispr Flow<\/strong><\/td>\n<td>Dictation (Speech to Text)<\/td>\n<\/tr><tr>\n<td><strong>Granola / Fireflies / Otter / Read AI<\/strong><\/td>\n<td>Meeting intelligence — automatic notes, summaries, action items, CRM\nsync<\/td>\n<\/tr><tr>\n<td><strong>n8n / Make / Zapier<\/strong><\/td>\n<td>Workflow automation — connecting AI to business systems without\ncode<\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "Tool Best For Microsoft Copilot Safe, enterprise-approved AI — deep M365 integration, good default for regulated orgs Claude Enterprise workflows — integrates w"}, {"part": 0, "title": "Tool Selection for Marketing", "kind": "Article", "imgs": [], "html": "<div class=\"tw\"><table><thead><tr>\n<th><strong><br />\n<br />\nContent Type<\/strong><\/th>\n<th><strong>Tool<\/strong><\/th>\n<th><strong>Best For<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Images<\/td>\n<td>Midjourney<\/td>\n<td>High-aesthetic, stylized visuals; concept art, campaign key\nvisuals<\/td>\n<\/tr><tr>\n<td>Images<\/td>\n<td>Adobe Firefly<\/td>\n<td>Commercially-safe images, brand-embedded workflows\n(Photoshop/Illustrator integration)<\/td>\n<\/tr><tr>\n<td>Images<\/td>\n<td>Canva (Magic Media)<\/td>\n<td>Quick social graphics, templated brand assets, non-designers<\/td>\n<\/tr><tr>\n<td>Images<\/td>\n<td>Ideogram<\/td>\n<td>Text-in-image accuracy (posters, logos, typography-heavy\ncreatives)<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Higgsfield<\/td>\n<td>Cinematic ad videos with real camera control, character consistency\n(Soul ID), URL-to-ad generation<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Runway (Gen-4)<\/td>\n<td>Fine-grained video editing, VFX, motion control for polished\nshort-form<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Sora 2 / Veo 3.1<\/td>\n<td>High-fidelity, realistic text-to-video generation<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Kling 3.0<\/td>\n<td>Competitive alternative for cinematic motion at lower credit\ncost<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Canva<\/td>\n<td>Fast templated video edits, captions, quick social cuts<\/td>\n<\/tr><tr>\n<td>Audio<\/td>\n<td>ElevenLabs<\/td>\n<td>Voiceovers, multilingual dubbing, custom voice cloning<\/td>\n<\/tr><tr>\n<td>Audio<\/td>\n<td>Suno<\/td>\n<td>Full AI-generated music tracks/jingles for ad backgrounds<\/td>\n<\/tr><tr>\n<td>Audio<\/td>\n<td>Adobe Podcast<\/td>\n<td>Cleaning up/enhancing recorded voice audio<\/td>\n<\/tr><tr>\n<td>3D Models<\/td>\n<td>Luma AI (Genie)<\/td>\n<td>Text-to-3D asset generation for product/AR previews<\/td>\n<\/tr><tr>\n<td>3D Models<\/td>\n<td>Spline AI<\/td>\n<td>Interactive 3D web assets, landing page visuals<\/td>\n<\/tr><tr>\n<td>3D Models<\/td>\n<td>Meshy<\/td>\n<td>3D models for game/product prototyping<\/td>\n<\/tr><tr>\n<td>Multi-format<\/td>\n<td>Canva<\/td>\n<td>Brand-consistent images, simple video, presentations in one\nplace<\/td>\n<\/tr><tr>\n<td>Multi-format<\/td>\n<td>Higgsfield<\/td>\n<td>Marketing Studio: video + image + character assets in one\nworkspace<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Content Type Tool Best For Images Midjourney High-aesthetic, stylized visuals; concept art, campaign key visuals Images Adobe Firefly Commercially-safe images, "}, {"part": 0, "title": "Multimodal Inputs", "kind": "Article", "imgs": ["imgs/a07_0.jpg"], "html": "<p><strong>Choosing the Right Input Format for GenAI<\/strong><\/p>\n<p>Modern GenAI tools can accept far more than plain text — PDFs, Excel\nfiles, screenshots, CSVs, images, and scanned documents can all be fed\nin directly. But format choice isn't cosmetic. It determines how\naccurately the model reads your data, how much it can reason over, and\nhow safely that data is handled. For leaders rolling out AI-assisted\nworkflows, knowing <em>which<\/em> format to use — and why — is as\nimportant as knowing the tool itself.<\/p>\n<p><strong>Why format choice matters<\/strong><\/p>\n<p>Every input format is processed differently under the hood. A native\nExcel file preserves rows, columns, formulas, and structure that the\nmodel can query directly. A PDF may contain that same data as flattened\ntext or, worse, as an ineffectively-rendered table. A screenshot forces\nthe model to <em>read<\/em> the data visually (OCR-style) rather than\nparse it as structured data — introducing a layer of interpretation, and\ntherefore error, that a native file avoids entirely. Choosing the wrong\nformat doesn't just reduce quality; it can silently introduce mistakes\nthat look plausible but aren't accurate.<\/p>\n<p><strong>A practical decision framework<\/strong><\/p>\n<p><strong>1. Use native structured files (Excel, CSV) when the task\ninvolves numbers.<\/strong><br />\nIf you need calculations, aggregations, trend analysis, or anything\ntouching multiple rows/columns, always upload the native file rather\nthan a screenshot or PDF export. The model can parse actual cell values\nand formulas, rather than guessing numbers from an image — this is the\nsingle biggest driver of accuracy in data-heavy tasks.<\/p>\n<p><strong>2. Use PDFs when the source is a formatted document, not a\ndataset.<\/strong><br />\nReports, contracts, policy documents, and slide-style content are well\nsuited to PDF, since the model can extract and reason over text and\nlayout. Avoid PDF for tabular data if a native spreadsheet version\nexists — table extraction from PDFs is often lossy, especially with\nmerged cells or multi-page tables.<\/p>\n<p><strong>3. Use screenshots only when no other format is available,\nand keep expectations modest.<\/strong><br />\nScreenshots are useful for quick visual context — showing a chart, a UI\nbug, or a snippet of a larger tool — but they should not be used as the\nsource of truth for any numeric analysis. Treat a screenshot as \"show me\nwhat you see,\" not \"extract exact figures from this.\"<\/p>\n<p><strong>4. Use CSVs for large or simple tabular\ndatasets.<\/strong><br />\nCSV is often lighter and faster to process than Excel for very large\ndatasets, and it strips away formatting noise (merged cells, multiple\ntabs, conditional formatting) that can confuse extraction. If the file\nis a single flat table with no formulas or formatting dependencies, CSV\nis usually the cleanest choice.<\/p>\n<p><strong>5. Match the format to the task, not the file you happen to\nhave.<\/strong><br />\nIf you only have a screenshot of an Excel sheet, it's often worth taking\nthe extra minute to locate or export the underlying file before\nuploading — the accuracy gain is usually worth the effort, particularly\nfor anything that will inform a decision or go into a client\ndeliverable.<\/p>", "excerpt": "Choosing the Right Input Format for GenAI Modern GenAI tools can accept far more than plain text — PDFs, Excel files, screenshots, CSVs, images, and scanned doc"}, {"part": 1, "title": "HMC ADOPT-9 AI PERSONA™", "kind": "Framework", "imgs": ["imgs/a08_0.jpg"], "html": "<p><strong>The Nine Types of AI Users<\/strong><\/p>\n<p>Not every employee relates to AI the same way — some avoid it, some\noveruse it blindly, and only a few use it well. The HMC ADOPT-9™ Persona\nGrid maps users across two axes: how much they engage with AI, and how\nmuch they trust its output.<\/p>\n<p>The riskiest quadrant isn't the loud Skeptic — it's the quiet Passive\nTruster, who rarely checks what they're told.<\/p>\n<p>The goal for leaders isn't universal adoption; it's moving people\ntoward the AI-Native Leader corner: high engagement, high — but verified\n— trust.<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><\/th>\n<th><strong>Low Trust in Output<\/strong><\/th>\n<th><strong>Mid Trust in Output<\/strong><\/th>\n<th><strong>High Trust in Output<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td><strong>High Engagement<\/strong><\/td>\n<td><p><strong>The Skeptic<\/strong><\/p>\n<p>Understands AI well enough to distrust it. Points out flaws faster\nthan use cases.<\/p><\/td>\n<td><p><strong>The Power User<\/strong><\/p>\n<p>Fluent across tools and use cases. Actively finds new applications\nfor the team.<\/p><\/td>\n<td><p><strong>The AI-Native Leader<\/strong><\/p>\n<p>Redesigns workflows around AI, verifies rigorously, coaches\nothers.<\/p><\/td>\n<\/tr><tr>\n<td><strong>Mid Engagement<\/strong><\/td>\n<td><p><strong>The Dabbler<\/strong><\/p>\n<p>Tried it once for a demo. Curious but hasn't built a habit or seen\nreal payoff.<\/p><\/td>\n<td><p><strong>The Utility User<\/strong><\/p>\n<p>Treats AI like a tool, not a partner. Reliable for specific,\nrepeatable tasks.<\/p><\/td>\n<td><p><strong>The Delegator<\/strong><\/p>\n<p>Hands off real work to AI and spot-checks outcomes. Balanced\nreliance.<\/p><\/td>\n<\/tr><tr>\n<td><strong>Low Engagement<\/strong><\/td>\n<td><p><strong>The Avoider<\/strong><\/p>\n<p>Hasn't opened an AI tool yet. Sees it as a fad or \"someone else's\njob.\"<\/p><\/td>\n<td><p><strong>The Cautious Adopter<\/strong><\/p>\n<p>Uses AI for safe, low-stakes tasks only. Slow to expand\nscope.<\/p><\/td>\n<td><p><strong>The Passive Truster<\/strong><\/p>\n<p>Rarely uses AI, but accepts output without checking. Risky\ncombination.<\/p><\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "The Nine Types of AI Users Not every employee relates to AI the same way — some avoid it, some overuse it blindly, and only a few use it well. The HMC ADOPT-9™ "}, {"part": 1, "title": "HMC ROLE-TASK-TOOL MATRIX™", "kind": "Framework", "imgs": ["imgs/a09_0.jpg"], "html": "<p><strong>Framework for Precision AI Rollout<\/strong><\/p>\n<p>Most AI rollouts fail on a targeting problem, not a training problem.\nLeaders issue a blanket license — \"everyone gets Claude\" — and expect\nadoption to follow. It doesn't, because a finance analyst, a plant\nsupervisor, and a sales rep don't do the same work, and a generic tool\ngiven to all three lands as relevant to none of them.<\/p>\n<p>Adoption isn't a function of access. It's a function of fit — whether\nthe tool maps to a task the person actually owns, this week, with a\nvisible payoff. The HMC ROLE-TASK-TOOL MATRIX™ forces that mapping\nbefore a single license is issued.<\/p>\n<p><strong>The Three-Layer Map<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Layer<\/strong><\/th>\n<th><strong>Question It Answers<\/strong><\/th>\n<th><strong>Failure Mode If Skipped<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td><strong>Role<\/strong><\/td>\n<td>Who is this person, and what outcome are they accountable for?<\/td>\n<td>Training is generic; content doesn't land as \"for me\"<\/td>\n<\/tr><tr>\n<td><strong>Task<\/strong><\/td>\n<td>Which specific, recurring task inside that role is slow, repetitive,\nor error-prone?<\/td>\n<td>AI gets used for novelty demos, not real work<\/td>\n<\/tr><tr>\n<td><strong>Tool<\/strong><\/td>\n<td>Which AI capability — drafting, analysis, summarization, coding —\nactually fits that task?<\/td>\n<td>Wrong tool for the job; one bad experience kills further use<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Why It Precedes Training<\/strong><\/p>\n<ul>\n<li><p><strong>Prevents shelf-ware licenses.<\/strong> A tool with no\nmapped task is a tool that goes unused by week three — the cost shows up\nin the license renewal, not the training feedback form.<\/p><\/li>\n<li><p><strong>Makes ROI attributable.<\/strong> When a task is named up\nfront, the time saved on that task is measurable. Blanket rollouts can\nonly ever report anecdotes.<\/p><\/li>\n<li><p><strong>Prioritizes training spend.<\/strong> Not every role needs\nthe same hours. The matrix tells you where 3 hours of training changes\nbehaviour and where 30 minutes is enough.<\/p><\/li>\n<li><p><strong>Feeds directly into HMC ADOPT-9™.<\/strong> Once the right\ntool is matched to the right task, the persona grid tells you how much\ncoaching versus how much verification that person needs to use it\nwell.<\/p><\/li>\n<\/ul>\n<p><strong>How It's Built<\/strong><\/p>\n<ul>\n<li><p><strong>Step 1 — Role inventory.<\/strong> List roles by function,\nnot by title. \"Regional sales lead\" and \"key account sales lead\" may\nneed different tasks even with similar titles.<\/p><\/li>\n<li><p><strong>Step 2 — Task audit.<\/strong> For each role, identify the\n3–5 tasks that consume the most hours or carry the most error risk.\nInterview, don't assume — the task leaders think is painful is often not\nthe one employees actually struggle with.<\/p><\/li>\n<li><p><strong>Step 3 — Tool assignment.<\/strong> Match each task to a\nspecific AI capability and a specific workflow (not just \"use Claude\" —\n\"use Claude to draft the first pass of the weekly variance commentary\nfrom the finance dashboard export\").<\/p><\/li>\n<li><p><strong>Step 4 — Pilot and confirm.<\/strong> Run the matched\npairing with a small group before scaling the license. If it doesn't\nsave time in week one, the mapping is wrong — revisit, don't push harder\non adoption messaging.<\/p><\/li>\n<\/ul>\n<p>The matrix isn't a one-time exercise — roles evolve and tasks shift\nas AI capability improves. Leaders who revisit it quarterly catch the\nmoment a tool has outgrown its original task and can reassign it before\nthe license becomes dead weight.<\/p>\n\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Framework for Precision AI Rollout Most AI rollouts fail on a targeting problem, not a training problem. Leaders issue a blanket license — \"everyone gets Claude"}, {"part": 1, "title": "HMC C.R.A.F.T.S.™", "kind": "Framework", "imgs": ["imgs/a10_0.jpg"], "html": "<p><strong>Prompt Architecture Framework<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Letter<\/strong><\/th>\n<th><strong>Element 1<\/strong><\/th>\n<th><strong>Element 2<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td><strong>C<\/strong><\/td>\n<td><strong>Context<\/strong> — background, data, situation the model\nneeds<\/td>\n<td><strong>Character<\/strong> — persona/role the model should\nassume<\/td>\n<\/tr><tr>\n<td><strong>R<\/strong><\/td>\n<td><strong>Role<\/strong> — the specific task/job being asked<\/td>\n<td><strong>Reasoning<\/strong> — step-by-step thinking shown, or final\nanswer only<\/td>\n<\/tr><tr>\n<td><strong>A<\/strong><\/td>\n<td><strong>Aim<\/strong> — the specific goal or outcome<\/td>\n<td><strong>Audience<\/strong> — who the output is ultimately for<\/td>\n<\/tr><tr>\n<td><strong>F<\/strong><\/td>\n<td><strong>Format<\/strong> — structure: bullets, table, headers,\nlength<\/td>\n<td><strong>Flow<\/strong> — logical sequence the response should\nfollow<\/td>\n<\/tr><tr>\n<td><strong>T<\/strong><\/td>\n<td><strong>Tone<\/strong> — voice: formal, casual, technical,\npersuasive<\/td>\n<td><strong>Test<\/strong> — review, refine, re-prompt (built-in\niteration loop)<\/td>\n<\/tr><tr>\n<td><strong>S<\/strong><\/td>\n<td><strong>Scope<\/strong> — what's in/out of bounds for the task<\/td>\n<td><strong>Constraints<\/strong> — hard limits: length, budget,\ncompliance, format rules<\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "Prompt Architecture Framework Letter Element 1 Element 2 C Context — background, data, situation the model needs Character — persona/role the model should assum"}, {"part": 1, "title": "Organizational Adoption", "kind": "Article", "imgs": ["imgs/a11_0.jpg"], "html": "<p>Most GenAI initiatives don't fail because the technology is weak —\nthey fail because adoption is treated as a tech rollout instead of a\nchange program. Leaders who succeed start small: a focused pilot with a\nwilling team, clear success metrics, and fast feedback loops — then\nscale what works. The bigger risk is skipping straight to \"everyone must\nuse AI\" without building skills, trust, or workflow fit first. Adoption\nis won or lost on habits, not licenses purchased.<\/p>\n<p>The leader's real job is sequencing: prove value, build confidence,\nremove friction, then expand — deliberately, function by function.<\/p>\n<p><strong>Pilot Program<\/strong> — A small, contained trial of AI in\none team or use case before wider rollout. Let’s you learn cheaply and\nfix problems early.<\/p>\n<p><strong>Change Management<\/strong> — The discipline of helping people\nmove from old habits to new ones. The real bottleneck in AI adoption,\nfar more than the tool itself.<\/p>\n<p><strong>Workflow Fit<\/strong> — How well an AI tool slots into\nexisting ways of working. Poor fit is the #1 reason adoption stalls even\nwith good tools.<\/p>\n<p><strong>Champions Network<\/strong> — A group of early, enthusiastic\ninternal users who model and spread adoption informally. More persuasive\nto peers than top-down mandates.<\/p>\n<p><strong>AI Fluency<\/strong> — A baseline working comfort with AI\ntools, distinct from technical expertise. The goal for most employees,\nnot deep AI literacy.<\/p>\n<p><strong>Adoption Curve<\/strong> — The typical spread of usage from\nearly adopters to laggards. Helps leaders set realistic timelines\ninstead of expecting instant, uniform uptake.<\/p>\n<p><strong>Friction Points<\/strong> — Practical obstacles to using AI\nday-to-day (access, trust, unclear use cases). Removing these matters\nmore than more training.<\/p>\n<p><strong>Vanity Metrics<\/strong> — Numbers that look good but don't\nreflect real impact (e.g. \"logins\" vs. \"hours saved\"). Leaders should\ntrack outcomes, not activity.<\/p>\n<p><strong>Reskilling<\/strong> — Deliberately building new capabilities\nin employees whose roles shift due to AI. A retention and morale issue\nas much as a skills one.<\/p>\n<p><strong>Sponsorship<\/strong> — Visible, active support from senior\nleadership for AI adoption. Without it, initiatives stay siloed and\nnever reach organization-wide scale.<\/p>", "excerpt": "Most GenAI initiatives don't fail because the technology is weak — they fail because adoption is treated as a tech rollout instead of a change program. Leaders "}, {"part": 1, "title": "The 90-Day North Star", "kind": "Article", "imgs": ["imgs/a12_0.jpg"], "html": "<p>Ask a leader how their AI rollout is going three months in, and the\nanswer is almost always a story, not a number — a good demo someone saw,\na team that \"seems excited,\" a license count. Not because the initiative\nfailed, but because no one agreed in advance on what would count as\nprogress and when it would be checked.<\/p>\n<p>Without a fixed cadence, progress reporting becomes whoever asks\nloudest, whenever they happen to ask. The champion reports wins. The\nskeptic reports the one failure they heard about. Leadership gets\nneither a trend line nor a decision point — just noise timed to whoever\nspoke last.<\/p>\n<p>The 90-Day North Star replaces ad hoc updates with three fixed\ncheckpoints — Day 30, Day 60, Day 90 — each asking a different question,\nin a fixed order. You cannot skip to the ROI question before the\nadoption question has an honest answer, because the two are not actually\nthe same conversation. Treating them as one is exactly how a rollout\nstalls quietly for a full quarter before anyone notices.<\/p>\n<p><strong>Day 30 — Adoption Check<\/strong><br />\nThe question: are people actually opening the tool? What good looks\nlike: usage frequency by role, not license count. A tool with 100%\nlicensing and 20% weekly use is not \"adopted\" — it's shelved with a\nreceipt.<\/p>\n<p><strong>Day 60 — Workflow Integration Check<\/strong><br />\nThe question: has it moved from a side experiment into the actual way\nwork gets done? What good looks like: the task the tool touches has\nvisibly changed — fewer manual steps, a shorter cycle time, a document\nthat used to take a day now taking an hour. Not \"people like it,\" but\n\"the workflow is different now.\"<\/p>\n<p><strong>Day 90 — ROI Check<\/strong><br />\nThe question: what did it actually deliver? What good looks like: a\nclear read on time saved, quality improved, or new work made possible —\ngrounded in what changed, not what people felt.<\/p>\n<p><strong>Why the order can't be skipped<\/strong><\/p>\n<p>ROI without adoption is fiction. A pilot that shows strong\ntime-savings from three power users tells you nothing about what happens\nwhen the other twenty people on the team touch it. Day 90 numbers built\non Day 30 usage that was never checked are numbers built on sand.<\/p>\n<p>Adoption without integration is a vanity metric. High login counts\nwith no change to the underlying workflow just means people are curious,\nnot that the initiative is working. Day 60 is the checkpoint that\nseparates novelty from habit.<\/p>\n<p>Skipping straight to Day 90 hides where things actually broke. If ROI\ncomes in low, the fixed cadence means you already know whether it was an\nadoption problem, an integration problem, or a genuine value problem —\ninstead of starting a root-cause investigation from zero, three months\nlate.<\/p>\n<p><strong>How leaders use it<\/strong><\/p>\n<p>One page, three dates, no exceptions. Every new AI initiative — a new\ntool, a new team rollout, a new use case — gets the same three\ncheckpoints on the calendar the day it launches, not whenever someone\nremembers to ask.<\/p>\n<p>Report the miss, not just the win. A Day 30 check that shows low\nadoption is not a failed report — it's the report doing its job. The\ninitiative gets a correction window before Day 60, instead of a surprise\nat Day 90.<\/p>\n<p>Use it to decide, not just to report. Each checkpoint should end in a\ndecision — continue, adjust, or stop — not just a status update. A\ncadence with no decision attached to it is just a calendar reminder.<\/p>\n<p>Most GenAI initiatives do not fail in a single dramatic moment — they\nfail in the gap between launch enthusiasm and the next time anyone\nchecks. The 90-Day North Star closes that gap by making sure someone\nchecks on schedule, asks the right question for that stage, and has the\ndiscipline to act on what the checkpoint actually shows.<\/p>", "excerpt": "Ask a leader how their AI rollout is going three months in, and the answer is almost always a story, not a number — a good demo someone saw, a team that \"seems "}, {"part": 2, "title": "The AI Baseline Document", "kind": "Article", "imgs": ["imgs/a13_0.jpg"], "html": "<p><strong>Why This Exists<\/strong><\/p>\n<p>You cannot measure an AI initiative's ROI if you never wrote down\nwhat \"before\" looked like. Most rollouts skip this step entirely — they\ngo from vendor pitch to go-live with no ground-truth snapshot of the\nprocess being changed. Three months later, someone asks, \"did it work?\"\nand the honest answer is \"we don't know, because we never measured the\nstarting point.\"<\/p>\n<p>This document is filled out <strong>before<\/strong> any AI tool goes\nlive. It takes 30–45 minutes per process and should be completed with\nthe people who actually do the work — not just their manager's\nassumption of what the work looks like.<\/p>\n<p>One baseline per process/task. If you're rolling out AI across five\nworkflows, fill this out five times.<\/p>\n<p><strong>Section 0 — Identification<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Field<\/strong><\/th>\n<th><strong>Entry<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Process / task being baselined<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Business owner (accountable for outcome)<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>IT / technical owner<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>AI tool being introduced<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Team / function<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Baseline date<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Number of people currently performing this task<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Section 1 — Quantitative Baseline<\/strong><\/p>\n<p><em>Hard numbers. If you don't have exact figures, use your best\nhonest estimate and mark it \"(est.)\" — an honest estimate beats a false\nprecision.<\/em><\/p>\n<p><strong>Time<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Average time to complete one instance of this task<\/td>\n<td>_______________ (mins/hrs)<\/td>\n<\/tr><tr>\n<td>Number of times this task is performed per week/month<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Total person-hours consumed per month<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Number of people involved per instance (handoffs)<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Quality / Error<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Error rate (errors per X instances)<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Rework rate (% of instances requiring correction)<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Average time to catch and fix an error<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Cost of a typical error (rework hours, client impact, compliance\nexposure)<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Cost<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Fully loaded cost per instance (people time × rate)<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Any current tool/vendor cost being replaced<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Cost of delay (revenue/opportunity lost while task is in\nprogress)<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Speed / Cycle Time<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Time from task start to final output delivered<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Time from output delivered to decision/action taken on it<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Number of review/approval cycles before output is considered\nfinal<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Volume Trend<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Is task volume growing, flat, or shrinking?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Expected volume in 12 months<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Section 2 — Qualitative Baseline<\/strong><\/p>\n<p><em>Numbers alone miss the story. Capture this from the people doing\nthe task, in their own words where possible.<\/em><\/p>\n<p><strong>Experience of the Work<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Question<\/strong><\/th>\n<th><strong>Response<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>In one sentence, how does the team describe this task today?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>What part of this task do people find most tedious or draining?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>What part requires genuine judgment or expertise (i.e., shouldn't be\nautomated away)?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Where does this task currently cause frustration for internal\nstakeholders or clients?<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Risk &amp; Judgment<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Question<\/strong><\/th>\n<th><strong>Response<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>What's the worst-case outcome if this task is done poorly?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Is there a compliance, legal, or regulatory dimension to this\ntask?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>How much of this task currently relies on one person's tacit\nknowledge (i.e., a single point of failure)?<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Stakeholder Perception<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Question<\/strong><\/th>\n<th><strong>Response<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>How do downstream users/clients currently rate the output of this\ntask (if measured)?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>What's the most common complaint about the current process, if\nany?<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Team Readiness (feeds directly into HMC\nADOPT-9™)<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Question<\/strong><\/th>\n<th><strong>Response<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>How would you describe the team's general comfort with AI tools\ntoday?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Has this team used any AI tool for this or an adjacent task\nbefore?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>What's the team's biggest stated concern about introducing AI\nhere?<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Section 3 — The One-Line Baseline Statement<\/strong><\/p>\n<p><em>Force yourself to compress Sections 1 and 2 into a single\nsentence. This is the sentence you'll compare against at Day\n30/60/90.<\/em><\/p>\n<p>\"Today, [task] takes <strong>___<\/strong> hours/week across\n<strong>___<\/strong> people, with a <strong>___%<\/strong> error/rework\nrate, and the team describes it as <strong>___<\/strong>.\"<\/p>\n<p><strong>Section 4 — Sign-Off<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Role<\/strong><\/th>\n<th><strong>Name<\/strong><\/th>\n<th><strong>Date<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Business owner<\/td>\n<td>_______________<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Team lead / process owner<\/td>\n<td>_______________<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>AI initiative sponsor<\/td>\n<td>_______________<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Notes for Use<\/strong><\/p>\n<ul>\n<li><p><strong>Fill this out before go-live, not after.<\/strong> A\nbaseline written retroactively is a guess dressed up as data.<\/p><\/li>\n<li><p><strong>Re-use the exact same questions at Day 90<\/strong> (see\nHMC's 90-Day North Star framework) — the value of this document is\nentirely in the comparison, not the snapshot alone.<\/p><\/li>\n<li><p><strong>Don't skip the qualitative section.<\/strong> A process\ncan look fine on the numbers and still be quietly hated by the team, or\nvice versa — a slow process the team trusts completely. Both are real\nsignal.<\/p><\/li>\n<li><p><strong>One baseline, one process.<\/strong> Resist the urge to\nbaseline \"the whole department's AI readiness\" in one document — it\nproduces vague numbers no one can act on.<\/p><\/li>\n<\/ul>\n<p><strong><br />\n<\/strong><\/p>\n<p><stro
