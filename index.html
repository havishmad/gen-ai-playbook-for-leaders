ng><br />\n<\/strong><\/p>", "excerpt": "Why This Exists You cannot measure an AI initiative's ROI if you never wrote down what \"before\" looked like. Most rollouts skip this step entirely — they go fro"}, {"part": 2, "title": "HMC G.A.I.N.S.™", "kind": "Framework", "imgs": ["imgs/a14_0.jpg"], "html": "<p><strong>Measuring the ROI of GenAI<\/strong><\/p>\n<p>Most companies measure GenAI ROI the way they measure software ROI —\nlicenses purchased, logins tracked, hours \"saved\" on paper. But GenAI's\nvalue doesn't show up neatly in a single line item. It shows up as\nfaster decisions, fewer errors, new offerings that weren't possible\nbefore, and capacity quietly freed up for higher-value work. Measuring\nonly cost savings misses most of the story — and measuring nothing at\nall lets pilots die from lack of proof. Leaders need a framework that\ncaptures value across the full spread of what GenAI actually changes,\nnot just what's easiest to count.<\/p>\n<p>That's the gap the <strong>HMC GAINS™ Framework<\/strong> is built\nfor.<\/p>\n<p><strong>The HMC GAINS™ Framework<\/strong><\/p>\n<p><strong>G — Growth<\/strong><br />\nRevenue-side impact: new products, faster sales cycles, better win\nrates, upsell driven by AI-assisted insight. Often underestimated\nbecause it's indirect.<\/p>\n<p><strong>A — Automation<\/strong><br />\nThe classic ROI: hours saved, tasks removed, throughput increased per\nperson. Easiest to measure, but only part of the picture — don't stop\nhere.<\/p>\n<p><strong>I — Improvement<\/strong><br />\nQuality and risk gains: fewer errors, better compliance, more consistent\noutput. Hard to put a number on, but often the most valuable pillar in\nregulated or high-stakes functions.<\/p>\n<p><strong>N — New Capability<\/strong><br />\nThings the business simply couldn't do before — real-time market scans,\npersonalized content at scale, analysis that used to require a\nspecialist team. This is where GenAI creates option value, not just\nefficiency.<\/p>\n<p><strong>S — Sustained Adoption<\/strong><br />\nUsage depth and habit formation over time. A tool with high initial use\nand fast drop-off has near-zero ROI, no matter how good the pilot\nnumbers looked. This pillar is the leading indicator for whether the\nother four will hold up.<\/p>\n<p><strong>How Leaders Use It<\/strong><\/p>\n<p>Score each pillar loosely — high / medium / low / not yet measured —\nfor every GenAI initiative, rather than forcing one blended ROI number.\nA hiring-screening tool might score high on Automation and Improvement\nbut low on Growth; a customer-facing AI assistant might flip that. The\nGAINS scorecard forces leaders to ask \"where is the value actually\nlanding?\" instead of defaulting to the one pillar (Automation) that's\nsimplest to justify in a budget meeting.<\/p>\n<p>The real failure mode isn't measuring GenAI ROI badly — it's\nmeasuring only the 20% of value that's easy to see, and starving the\nother 80% of the attention and investment it needs to compound.<\/p>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Measuring the ROI of GenAI Most companies measure GenAI ROI the way they measure software ROI — licenses purchased, logins tracked, hours \"saved\" on paper. But "}, {"part": 2, "title": "What AI is Actually Costing and Creating for Your Business", "kind": "Article", "imgs": ["imgs/a15_0.jpg"], "html": "<p><strong>10 Key Terms for Quick Reference<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Term<\/strong><\/th>\n<th><strong>What It Means<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>ROI (Return on Investment)<\/td>\n<td>The measurable value gained relative to what was spent<\/td>\n<\/tr><tr>\n<td>AI Baseline<\/td>\n<td>Your starting performance snapshot before AI is introduced<\/td>\n<\/tr><tr>\n<td>Productivity Delta<\/td>\n<td>The change in output per person or process after AI adoption<\/td>\n<\/tr><tr>\n<td>Time-to-Value<\/td>\n<td>How quickly AI deployment starts generating measurable returns<\/td>\n<\/tr><tr>\n<td>Hard Savings<\/td>\n<td>Direct, quantifiable cost reductions — headcount, hours,\nmaterials<\/td>\n<\/tr><tr>\n<td>Soft Savings<\/td>\n<td>Indirect gains — faster decisions, higher morale, better\nquality<\/td>\n<\/tr><tr>\n<td>Error Rate Reduction<\/td>\n<td>The decrease in mistakes or rework after AI enters a workflow<\/td>\n<\/tr><tr>\n<td>Adoption Rate<\/td>\n<td>The percentage of your team actually using the AI tool\nconsistently<\/td>\n<\/tr><tr>\n<td>AI Debt<\/td>\n<td>Hidden costs that accumulate when AI is deployed without proper\ngovernance<\/td>\n<\/tr><tr>\n<td>Value Leakage<\/td>\n<td>Value that AI creates but your organization fails to capture or\nmeasure<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p>Most leaders approve AI investments the same way they buy expensive\ngym equipment — with great intentions and no plan to measure whether it\nactually gets used. The problem is not the technology. The problem is\nthat traditional financial frameworks were never built for something\nthat improves over time, behaves differently across teams, and delivers\nvalue in ways that do not always show up on a spreadsheet. ROI for AI is\nnot a single number. It is a story told across time, behaviour, and\nbusiness outcomes.<\/p>\n<p>Before any AI initiative goes live, your job as a leader is to\nestablish a clean baseline. What does the process look like today — the\nhours consumed, the errors made, the decisions delayed, the customers\nlost to slow response? Without this snapshot, you are measuring nothing.\nYou are simply hoping. A baseline is not a technical document. It is a\nbusiness record: here is what normal looks like before we intervene.\nEvery meaningful ROI conversation begins here, not at the vendor pitch,\nnot at the board presentation, but at honest ground-level observation of\nhow work actually happens.<\/p>\n<p>Once AI is deployed, value shows up in two forms — and leaders\nroutinely count only one of them. Hard savings are visible: fewer hours\non a task, reduced vendor costs, lower error-related rework. But soft\nsavings are where the compounding begins. Teams make faster decisions.\nManagers spend less time in status meetings. Customers receive responses\nthat feel faster and more relevant. These gains are real, but they\nevaporate if no one is tracking them. Build a simple measurement rhythm\n— weekly for adoption, monthly for productivity delta, quarterly for\nstrategic outcomes. Do not wait for an annual review to find out whether\nthe investment worked.<\/p>\n<p>The most overlooked ROI metric is adoption rate, and it is the one\nthat sits entirely within your control. A sophisticated AI tool used by\na fraction of your team returns a fraction of its potential value. If\npeople are not using it, the fault is rarely the technology — it is the\nchange management, the training, the trust, or the clarity of purpose.\nEvery percentage point of adoption is a percentage point of ROI\nrecovered. Leaders who obsess over the tool and ignore the human uptake\nare measuring the gym equipment, not the fitness.<\/p>\n<p><strong>The Leader's Playbook<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Action<\/strong><\/th>\n<th><strong>Why It Matters<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Document your baseline before any AI goes live<\/td>\n<td>You cannot measure improvement without knowing where you\nstarted<\/td>\n<\/tr><tr>\n<td>Separate hard savings from soft savings in your tracking<\/td>\n<td>Both are real; treating them the same distorts your picture<\/td>\n<\/tr><tr>\n<td>Review adoption rates before reviewing financial returns<\/td>\n<td>Low usage is the earliest warning sign of value leakage<\/td>\n<\/tr><tr>\n<td>Build a simple measurement calendar — weekly, monthly,\nquarterly<\/td>\n<td>AI ROI is not an event; it is a rhythm that requires consistent\nattention<\/td>\n<\/tr><tr>\n<td>Assign a business owner to every AI initiative, not just an IT\nowner<\/td>\n<td>Technology without accountability produces data, not decisions<\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "10 Key Terms for Quick Reference Term What It Means ROI (Return on Investment) The measurable value gained relative to what was spent AI Baseline Your starting "}, {"part": 3, "title": "HMC S.A.F.E.R. AI™", "kind": "Framework", "imgs": ["imgs/a16_0.jpg"], "html": "<p><strong>Five principles to guide responsible AI usage across the\norganization<\/strong><\/p>\n<p><strong>Our Guiding Principle:<\/strong> AI is a powerful productivity\nenabler — but must be used with awareness, caution, and accountability.\nThe S.A.F.E.R. framework gives you a clear mental model to follow.<\/p>\n<p><strong>S — SECURE THE DATA<\/strong><br />\n<em>Never expose what shouldn't leave the organisation<\/em><\/p>\n<p>Do not share confidential or client data<\/p>\n<p>Avoid uploading internal documents or financials<\/p>\n<p>Use anonymised or dummy data wherever possible<\/p>\n<p>Prefer enterprise-approved AI tools only<\/p>\n<p><strong>A — ASSESS THE INPUT<\/strong><br />\n<em>Think before you prompt<\/em><\/p>\n<p>Is the data sensitive or proprietary?<\/p>\n<p>Can the request be generalised?<\/p>\n<p>Are you sharing more context than necessary?<\/p>\n<p>Would this be safe to share externally?<\/p>\n<p><strong>F — FACT-CHECK THE OUTPUT<\/strong><br />\n<em>AI can be confident — not always correct<\/em><\/p>\n<p>Verify facts, numbers, and insights<\/p>\n<p>Cross-check critical outputs with trusted sources<\/p>\n<p>Be cautious of hallucinations (fabricated info)<\/p>\n<p>Don't publish AI output without review<\/p>\n<p><strong>E — EVALUATE RISKS<\/strong><br />\n<em>Understand the consequences before use<\/em><\/p>\n<p>Consider legal and compliance implications<\/p>\n<p>Watch for bias or ethical concerns<\/p>\n<p>Assess business impact of incorrect outputs<\/p>\n<p>Escalate uncertainties to IT / Compliance<\/p>\n<p><strong>R — RETAIN HUMAN JUDGMENT<\/strong><br />\n<em>AI assists. Humans decide.<\/em><\/p>\n<p>Do not rely on AI for final decisions without validation<\/p>\n<p>Use AI as a co-pilot, not autopilot<\/p>\n<p>Maintain accountability for outcomes<\/p>\n<p>Ensure team members are trained in AI limitations<\/p>", "excerpt": "Five principles to guide responsible AI usage across the organization Our Guiding Principle: AI is a powerful productivity enabler — but must be used with aware"}, {"part": 3, "title": "Types of AI Challenges", "kind": "Article", "imgs": ["imgs/a17_0.jpg"], "html": "<p>GenAI tools promise speed, scale, and intelligence — and for the most\npart, they deliver. But like any powerful tool, they come with a set of\nfailure modes that are easy to overlook in a demo and costly to discover\nin production. For leaders driving adoption across their organization,\nunderstanding these risks isn't a technical afterthought — it's a\ngovernance responsibility.<\/p>\n<p><strong># | Challenge | What it means<\/strong><\/p>\n<p><strong>1. Inaccurate<\/strong><br />\nGives wrong or misleading answers, often with the same fluency and\nconfidence as correct ones — making errors hard to spot without\nreview.<\/p>\n<p><strong>2. Hallucinates<\/strong><br />\nMakes up facts, sources, or content that isn't real, which can end up\nunchecked in reports, decks, or client communication.<\/p>\n<p><strong>3. Irrelevant / Confused<\/strong><br />\nMisses the point or struggles with complex, multi-step questions,\nsometimes completing only part of a multi-requirement prompt.<\/p>\n<p><strong>4. Outdated<\/strong><br />\nRelies on training data that may no longer reflect current facts,\nprices, regulations, or product details.<\/p>\n<p><strong>5. Inconsistent<\/strong><br />\nOutput quality varies between runs of the same prompt, making it hard to\nstandardize AI-assisted work across a team.<\/p>\n<p><strong>6. Biased<\/strong><br />\nShows unfair, one-sided, or stereotyped responses reflecting patterns in\ntraining data — which can quietly shape hiring copy, reviews, or\nclient-facing content.<\/p>\n<p><strong>7. Data leakage<\/strong><br />\nSensitive or confidential information entered by employees can be\nexposed or mishandled, depending on the tool's data policy.<\/p>\n<p><strong>8. Over-reliance<\/strong><br />\nTeams stop verifying outputs, eroding judgment and institutional skill\nover time — with errors surfacing only after they've caused damage.<\/p>\n<p><strong>9. Cost unpredictability<\/strong><br />\nUsage-based pricing can scale unexpectedly at enterprise volume,\nespecially once adoption spreads beyond a pilot team.<\/p>\n<p><strong>10. IP/copyright exposure<\/strong><br />\nGenerated content may unintentionally reproduce copyrighted text, code,\nor images, creating legal risk for anything published externally.<\/p>\n<p><strong>11. Governance gap<\/strong><br />\nNo clear owner exists for approving use cases, monitoring outputs, or\ntaking accountability when something fails.<\/p>\n<p><strong>12. Prompt injection / manipulation<\/strong><br />\nMalicious or hidden inputs — including text buried in uploaded documents\n— can hijack a model's behaviour or extract confidential context.<\/p>\n<p><strong>13. Shadow AI usage<\/strong><br />\nEmployees use unapproved AI tools to work faster, often pasting company\ndata into consumer-grade apps with no enterprise safeguards or\nvisibility.<\/p>\n<p><strong>14. Explainability deficit<\/strong><br />\nModels can't reliably explain why they produced a given answer, making\noutputs hard to audit in regulated contexts like finance or HR.<\/p>\n<p><strong>15. Vendor/model lock-in<\/strong><br />\nWorkflows built around one provider's model or API can be costly to\nmigrate if pricing, policies, or capabilities change down the line.<\/p>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "GenAI tools promise speed, scale, and intelligence — and for the most part, they deliver. But like any powerful tool, they come with a set of failure modes that"}, {"part": 3, "title": "Safety and Data Leakage", "kind": "Article", "imgs": ["imgs/a18_0.jpg"], "html": "<p>As GenAI tools spread across teams, the biggest risk isn't the model\n— it's what employees paste into it. Confidential client data,\nfinancials, source code, or personal information typed into public AI\ntools can be stored, used for training, or exposed in a breach, outside\nyour control. Leaders must set clear boundaries: which tools are\napproved, what data classes are off-limits, and how outputs get verified\nbefore use. Safety isn't a one-time policy — it's an ongoing habit of\nawareness, built through training, guardrails, and accountability, so AI\nadoption speeds up the business without quietly leaking its crown\njewels.<\/p>\n<ol type=\"1\">\n<li><p><strong>Data Leakage<\/strong> — Sensitive or confidential\ninformation unintentionally exposed to an external system. In GenAI,\nthis usually happens via prompts, not hacks.<\/p><\/li>\n<li><p><strong>Prompt Injection<\/strong> — Malicious instructions hidden\nin text/documents that trick an AI into ignoring rules or leaking data.\nA growing risk as AI reads more external content.<\/p><\/li>\n<li><p><strong>Shadow AI<\/strong> — Employees using unapproved AI tools\nwithout IT/security oversight. Creates blind spots leaders can't govern\nor audit.<\/p><\/li>\n<li><p><strong>Data Residency<\/strong> — Where your data is physically\nstored and processed. Matters for compliance with laws like GDPR or\nIndia's DPDP Act.<\/p><\/li>\n<li><p><strong>Model Training Opt-Out<\/strong> — Setting that prevents\nyour inputs from being used to train the provider's future models.\nCritical for enterprise/business-tier tools.<\/p><\/li>\n<li><p><strong>PII (Personally Identifiable Information)<\/strong> — Any\ndata that can identify an individual (name, ID, contact details). Should\nnever enter public AI tools unmasked.<\/p><\/li>\n<li><p><strong>Zero Data Retention (ZDR)<\/strong> — An enterprise\nagreement where the provider doesn't store your inputs/outputs at all.\nHighest level of data protection available.<\/p><\/li>\n<li><p><strong>Access Controls<\/strong> — Rules defining who can use\nwhich AI tools, with what data, at what permission level. Prevents\nuncontrolled or excessive exposure.<\/p><\/li>\n<li><p><strong>Hallucination Risk<\/strong> — AI generating confident but\nfalse information. A safety issue when outputs are trusted and acted on\nwithout verification.<\/p><\/li>\n<li><p><strong>Human-in-the-Loop<\/strong> — Keeping a person responsible\nfor reviewing and approving AI outputs before action. The core safeguard\nagainst both leakage and errors.<\/p><\/li>\n<\/ol>", "excerpt": "As GenAI tools spread across teams, the biggest risk isn't the model — it's what employees paste into it. Confidential client data, financials, source code, or "}, {"part": 3, "title": "Compliance", "kind": "Article", "imgs": ["imgs/a19_0.jpg"], "html": "<p>As GenAI adoption scales, data governance isn't optional — here's the\nlandscape leaders should know.<\/p>\n<p><strong>GDPR (EU)<\/strong> governs personal data of EU residents —\nrequires consent, right to erasure, and breach notification within 72\nhours. Any AI tool processing EU customer/employee data must comply,\nregardless of where your company is based.<\/p>\n<p><strong>CCPA/CPRA (California)<\/strong> gives consumers rights to\nknow, delete, and opt out of data sale — increasingly the US benchmark\nother states mirror.<\/p>\n<p><strong>SOC 2<\/strong> is an audit standard (not a law) proving a\nvendor's controls around security, availability, and confidentiality —\ncritical when evaluating AI vendors or cloud tools for enterprise\nuse.<\/p>\n<p><strong>ISO 27001<\/strong> is the global standard for information\nsecurity management systems — broader than SOC 2, often required for\ncross-border enterprise contracts.<\/p>\n<p><strong>HIPAA (US)<\/strong> protects health information handled by\ncovered healthcare entities and their business associates — GenAI\nvendors processing protected health information (PHI) on their behalf\nmust meet applicable privacy and security requirements and enter into a\nBusiness Associate Agreement (BAA).<\/p>\n<p><strong>Emerging additions:<\/strong> ISO 42001 (AI management\nsystems), the EU AI Act (risk-tiered AI regulation), and India's DPDP\nAct (2023) — increasingly relevant for organizations operating across\nIndia.<\/p>\n<p><strong>Practical takeaway:<\/strong> before rolling out any GenAI\ntool, map what data it touches, which regulations apply by geography,\nand whether the vendor holds SOC 2/ISO 27001 certification.<\/p>", "excerpt": "As GenAI adoption scales, data governance isn't optional — here's the landscape leaders should know. GDPR (EU) governs personal data of EU residents — requires "}, {"part": 3, "title": "Levels of Safety", "kind": "Article", "imgs": ["imgs/a20_0.jpg"], "html": "<p><em>Same model, six different postures. What leaders should actually\nbe deciding when they ask whether AI is safe to use.<\/em><\/p>\n<p>\"Is it safe?\" is the wrong question in a boardroom. The model is\nidentical across every tier. What changes is the contract it runs under\n— whether your data trains the model, how long it is stored, and what\nyour IT function can see. That makes this a procurement and governance\ndecision, not a technology one.<\/p>\n<p>Anthropic splits its products in two. Claude Free, Pro and Max sit\nunder Consumer Terms. Team, Enterprise, the API and the cloud\nmarketplaces sit under Commercial Terms, where inputs and outputs are\nnot used for model training by default. Almost everything else is detail\nlayered on that single split.<\/p>\n<p><strong>The tiers at a glance<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Tier<\/strong><\/th>\n<th><strong>Terms &amp; training<\/strong><\/th>\n<th><strong>Data retention<\/strong><\/th>\n<th><strong>Admin &amp; governance<\/strong><\/th>\n<th><strong>Right for<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td><strong>Free<\/strong><\/td>\n<td>Consumer. Chats used for training unless the user switches it\noff.<\/td>\n<td>5 years if training is on; 30 days if opted out.<\/td>\n<td>None. No SSO, no admin console, no DPA.<\/td>\n<td>Personal experimentation only.<\/td>\n<\/tr><tr>\n<td><strong>Pro / Max (personal)<\/strong><\/td>\n<td>Consumer — legally identical to Free. Paying changes usage limits,\nnot data posture.<\/td>\n<td>Same as Free.<\/td>\n<td>None. The employer has no visibility whatsoever.<\/td>\n<td>Individual productivity on non-sensitive material.<\/td>\n<\/tr><tr>\n<td><strong>Team (2–150 seats)<\/strong><\/td>\n<td>Commercial. No model training on your content by default.<\/td>\n<td>Standard retention; not configurable.<\/td>\n<td>SSO, domain verification, central billing, connector controls, usage\nanalytics, org-wide skills.<\/td>\n<td>Departments and mid-size firms without hard compliance\nobligations.<\/td>\n<\/tr><tr>\n<td><strong>Enterprise (20+ seats)<\/strong><\/td>\n<td>Commercial. No training by default.<\/td>\n<td>Custom retention controls, customer-managed encryption keys, US-only\ninference.<\/td>\n<td>Everything in Team plus SCIM, role-based access, audit logs,\nCompliance API, IP allowlisting, network-level access control,\nHIPAA-ready with BAA.<\/td>\n<td>Regulated industries and organisation-wide rollout.<\/td>\n<\/tr><tr>\n<td><strong>API (Claude Platform)<\/strong><\/td>\n<td>Commercial. No training by default.<\/td>\n<td>Deleted within 30 days by default; Zero Data Retention available by\nagreement, per organisation.<\/td>\n<td>Workspaces, spend controls, API keys. Governance above the API call\nis yours to build.<\/td>\n<td>Products, agents and automation you own.<\/td>\n<\/tr><tr>\n<td><strong>Bedrock / Vertex / Foundry<\/strong><\/td>\n<td>Commercial, through your cloud provider.<\/td>\n<td>Retained data stays inside your cloud provider's environment.<\/td>\n<td>Inherits the cloud controls and paperwork you already run.<\/td>\n<td>Data-residency requirements and existing cloud commitments.<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p>Also available: Claude Gov for national-security work, and an\nEducation plan for universities — same logic, different paperwork.\nCommercial tiers sit on SOC 2 Type II, ISO 27001 and ISO 42001, with\nGDPR and CCPA coverage.<\/p>\n<p><strong>Three things leaders get wrong<\/strong><\/p>\n<ol type=\"1\">\n<li><p><strong>Paying is not protecting.<\/strong> A Pro or Max\nsubscription runs on the same consumer contract as the free tier. No\ndata processing agreement, no admin trail, no way to revoke access when\nsomeone leaves. A personal plan used for board papers is an unmanaged\nvendor relationship.<\/p><\/li>\n<li><p><strong>Zero retention is not zero.<\/strong> ZDR is negotiated\nper organisation, not toggled on. Since mid-2026, the most capable\nfrontier models require 30-day retention on every platform, including\nunder ZDR. Content flagged for policy review can be held far\nlonger.<\/p><\/li>\n<li><p><strong>Audit logs are not transcripts.<\/strong> Enterprise logs\nrecord who did what and when — not what was typed. If your\nincident-response plan assumes a conversation can be reconstructed\nafterwards, it needs revisiting.<\/p><\/li>\n<\/ol>\n<p><strong>The practical rule<\/strong><\/p>\n<p>Match the tier to the data, not the headcount. Public and\ninternal-general material: Team is sufficient. Customer, financial or\nemployee data: Enterprise, with retention controls and role-based\naccess. Regulated or health data: Enterprise with a BAA, or the API\ninside your own cloud boundary.<\/p>\n<p>And whichever tier you buy, the more urgent control is usually the\none that stops staff reaching for a personal account — which is\nprecisely what Enterprise network-level access control exists to do.\nShadow usage is the real exposure; the licence is only the fix on\npaper.<\/p>\n<p>A final point worth holding onto: the safest deployment is not the\nmost restrictive one. It is the one people actually use. Lock a tier\ndown past usefulness and the work simply moves to somebody's phone.<\/p>", "excerpt": "Same model, six different postures. What leaders should actually be deciding when they ask whether AI is safe to use. \"Is it safe?\" is the wrong question in a b"}, {"part": 4, "title": "Skills", "kind": "Article", "imgs": ["imgs/a21_0.jpg"], "html": "<p>Most teams' first encounter with GenAI is a single, carefully-written\nprompt — a good one, refined over a few tries, that produces exactly the\noutput someone needed. The problem shows up a week later, when a\ncolleague needs the same thing and has to reconstruct that prompt from\nmemory, or when the original author leaves and takes the phrasing with\nthem. A good prompt solves a moment. It doesn't solve a workflow.<\/p>\n<p>Skills exist to close that gap.<\/p>\n<p><strong>What a skill actually is<\/strong><\/p>\n<p>A skill is a packaged, reusable set of instructions — the context,\nformat, steps, and constraints a task needs — saved once and invoked\nrepeatedly, instead of rebuilt from scratch in every conversation. Where\na prompt lives in one chat and dies when that chat ends, a skill lives\nindependently of any single conversation: it can be called up by name,\nshared across a team, and updated centrally when the way the work is\ndone changes.<\/p>\n<p>The practical shift is from \"ask well, every time\" to \"ask once,\ndefine well, reuse forever.\"<\/p>\n<p><strong>Why this distinction matters more than it sounds<\/strong><\/p>\n<p>Three failure modes show up constantly in teams that rely purely on\nad hoc prompting:<\/p>\n<ul>\n<li><p><strong>Inconsistency across people.<\/strong> Two analysts\nproducing the \"same\" weekly report end up with different structures,\ndifferent tone, different level of detail — because each wrote their own\nprompt, and no one's prompt matches anyone else's exactly.<\/p><\/li>\n<li><p><strong>Knowledge walking out the door.<\/strong> The person who\nfigured out the right way to ask for a particular analysis is also the\nonly one who remembers how they asked for it. Nothing is written down in\na form anyone else can run.<\/p><\/li>\n<li><p><strong>Drift over time.<\/strong> Even one person's own prompting\nstyle shifts week to week — small wording changes produce small output\nchanges, and six months in, nobody can say why this month's version of a\nrecurring report looks slightly different from January's.<\/p><\/li>\n<\/ul>\n<p>A skill fixes all three at once: the instructions exist in one place,\neveryone invoking the skill gets the same underlying logic, and updating\nthe skill updates the behavior for everyone who uses it going\nforward.<\/p>\n<p><strong>What belongs in a skill vs. what doesn't<\/strong><\/p>\n<p>Not everything needs to become one. The useful dividing line is\nrepetition and stakes, not complexity:<\/p>\n<ul>\n<li><p><strong>Good candidates:<\/strong> a recurring report format, a\nreview checklist applied every time a certain document type comes in, a\ncompany-specific way of structuring an analysis, a workflow with several\nfixed steps done the same way each time.<\/p><\/li>\n<li><p><strong>Poor candidates:<\/strong> a one-off question, an\nexploratory brainstorm, anything where the \"right\" approach is still\nbeing figured out. Packaging something into a skill before the\nunderlying process has stabilized just locks in an immature\nworkflow.<\/p><\/li>\n<\/ul>\n<p>The test worth applying: if you've written a similar prompt three or\nmore times with only small variations, that's no longer a prompt — it's\nan unwritten skill waiting to be formalized.<\/p>\n<p><strong>How skills change the leadership conversation, not just the\nindividual one<\/strong><\/p>\n<p>For an individual, a skill saves re-typing. For an organization, it\ndoes something more structural — it turns tribal knowledge about \"how we\ndo this task well\" into an asset that survives turnover, scales across a\nteam without retraining everyone from zero, and can be improved\ndeliberately rather than left to drift person by person.<\/p>\n<p>This also reframes where leadership attention should go. Instead of\nasking \"is our team good at prompting?\" — a skill that's hard to audit\nand inconsistent by nature — the better question becomes \"which of our\nrecurring tasks have a defined, reusable skill behind them, and which\nare still running on whatever the individual remembers to type?\" The gap\nbetween those two numbers is usually a more honest measure of AI\nmaturity than adoption or license counts.<\/p>\n<p><strong>The underlying point<\/strong><\/p>\n<p>Prompting is a conversation. A skill is infrastructure. Teams that\nstop at good prompting get good individual moments that don't compound.\nTeams that convert their best, most-repeated prompts into skills get a\ncapability that keeps paying off — consistent, shareable, and improvable\n— long after the person who wrote the original prompt has moved on to\nsomething else.<\/p>\n<p><img\nsrc=\"m/media/image46.png\"\nstyle=\"width:7.26806in;height:6.50625in\" /><\/p>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Most teams' first encounter with GenAI is a single, carefully-written prompt — a good one, refined over a few tries, that produces exactly the output someone ne"}, {"part": 4, "title": "API vs MCP", "kind": "Article", "imgs": ["imgs/a22_0.jpg"], "html": "<p><strong>The Strategic Picture<\/strong><\/p>\n<p>For the last two years, \"integrating AI\" meant wiring point-to-point\nAPI calls between a model and each individual system — one custom\nconnector per tool, per data source, per workflow. That approach doesn't\nscale. As enterprises move from single AI features to AI agents that\nneed to act across many systems, a new standard has emerged: <strong>MCP\n(Model Context Protocol)<\/strong>, an open standard for connecting AI\nmodels to tools and data sources.<\/p>\n<p><strong>The API approach<\/strong> is direct, familiar, and\nbattle-tested. Your team writes custom code to call a model, and\nseparately writes custom code to call each business system (CRM, ERP,\nticketing, calendars). Every new integration is a new engineering\nproject. It's fully controllable, but the effort compounds linearly — 10\ntools means 10 bespoke integrations, each maintained separately.<\/p>\n<p><strong>The MCP approach<\/strong> flips this. Instead of the model's\ndeveloper writing custom glue code for every tool, systems expose\nthemselves once via an MCP server, and any MCP-compatible AI can\ndiscover and use them — no bespoke integration per pairing. Think of it\nas the difference between building a custom cable for every device\nversus adopting USB-C: the standard, not the connection, does the\nwork.<\/p>\n<p><strong>Three Implications for Leaders<\/strong><\/p>\n<p><strong>1. Integration cost inverts.<\/strong> With APIs, cost scales\nwith the number of tool-model pairings. With MCP, a tool builds one\nserver once and every compatible AI system can use it. This matters most\nfor organizations expecting to run multiple AI tools (chat, coding\nagents, automation) against the same internal systems.<\/p>\n<p><strong>2. Governance shifts from code review to access\ncontrol.<\/strong> APIs bake permissions into custom code, reviewed\ncase-by-case. MCP servers centralize what a model is allowed to see and\ndo — read-only vs. write access, which systems, which data — making it a\npolicy decision rather than an engineering one. This is easier to audit\nbut requires deliberate access design; a poorly scoped MCP server can\nexpose more than intended.<\/p>\n<p><strong>3. Vendor lock-in decreases, but standardization risk\nincreases.<\/strong> MCP is open and model-agnostic, so switching AI\nproviders doesn't mean rebuilding every integration. The trade-off: the\nstandard is still young, evolving quickly, and not every enterprise\nsystem has a mature MCP server yet — some gaps still need direct API\nwork.<\/p>\n<p><strong>The Bottom Line<\/strong><\/p>\n<p>APIs aren't going away — they're the plumbing MCP servers are often\nbuilt on top of. The leadership decision isn't \"API or MCP,\" it's\n<strong>where to invest integration effort<\/strong>: build custom API\nintegrations for one-off, high-control needs, and adopt MCP for anything\nyou expect multiple AI tools to need repeated access to over time.<\/p>\n<p><img\nsrc=\"m/media/image48.png\" /><\/p>\n<p><a\nhref=\"https://youtu.be/7j1t3UZA1TY?si=Sm1HUbVfSB7nPWrc\">https://youtu.be/7j1t3UZA1TY?si=Sm1HUbVfSB7nPWrc<\/a><\/p>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "The Strategic Picture For the last two years, \"integrating AI\" meant wiring point-to-point API calls between a model and each individual system — one custom con"}, {"part": 4, "title": "Why Agents Matter", "kind": "Article", "imgs": ["imgs/a23_0.jpg", "imgs/a23_1.jpg", "imgs/a23_2.jpg"], "html": "<p><strong>Chatbots respond. Agents execute.<\/strong><\/p>\n<p>A conversational model takes a prompt and returns a completion — a\nsingle inference pass, no persistent state, no follow-through. An agent\noperates in a loop: it decomposes a goal into sub-tasks, selects and\ncalls tools (APIs, functions, databases), observes the result of each\naction, and decides the next step based on that observation. This loop —\noften called the <strong>plan-act-observe<\/strong> cycle — continues\nautonomously until a termination condition is met (task complete, error\nthreshold hit, or human checkpoint reached).<\/p>\n<p><strong>What's structurally different<\/strong><\/p>\n<ul>\n<li><p><strong>Tool use / function calling<\/strong>: Agents can invoke\nexternal tools — a SQL query, a web search, an API call, a file write —\nand incorporate the returned data into their next reasoning step. This\nis what separates \"describing an action\" from \"taking one.\"<\/p><\/li>\n<li><p><strong>Memory and state<\/strong>: Agents maintain context across\nmultiple steps (and sometimes across sessions), allowing them to track\npartial progress on a multi-stage task rather than treating each\ninteraction as stateless.<\/p><\/li>\n<li><p><strong>Orchestration<\/strong>: Complex tasks are often handled\nby multiple agents with defined roles (a \"router\" agent that delegates,\nspecialist sub-agents that execute), coordinated by an orchestration\nlayer — this is the architecture behind most production agentic systems\ntoday (e.g., Claude Code's sub-agent pattern, or multi-agent frameworks\nlike LangGraph, AutoGen).<\/p><\/li>\n<li><p><strong>Self-correction<\/strong>: Agents can evaluate their own\noutput against a goal or spec (sometimes via a separate \"critic\" pass)\nand retry or revise before returning a final result, reducing the need\nfor human review at every step.<\/p><\/li>\n<\/ul>\n<p><strong>Why this matters for business<\/strong><\/p>\n<p><strong>1. End-to-end task completion, not single-turn\noutput.<\/strong><br />\nReal workflows are multi-step DAGs (directed acyclic graphs) of\ndependent actions — extract data, transform it, validate it, generate\noutput, distribute it. Agents can traverse this entire graph\nautonomously. A standard LLM completion handles one node; a human has to\nmanually chain the rest.<\/p>\n<p><strong>2. Reduced orchestration overhead.<\/strong><br />\nThe dominant cost in current GenAI deployments isn't inference — it's\nthe human effort of prompt-chaining, context-passing, and manually\nverifying intermediate outputs. Agentic architectures internalize this\norchestration, which is where the productivity gain actually\nmaterializes.<\/p>\n<p><strong>3. Native tool integration via APIs and\nconnectors.<\/strong><br />\nThrough protocols like <strong>MCP (Model Context Protocol)<\/strong> or\ncustom function-calling schemas, agents can read/write to CRMs,\ndatabases, calendars, and internal systems directly — closing the loop\nfrom \"recommend an action\" to \"execute the action\" with an audit\ntrail.<\/p>\n<p><strong>4. Encoded, repeatable domain logic.<\/strong><br />\nAn agent can be configured (via system prompts, tool access, and\nguardrails) to replicate a specific institutional workflow —\nreconciliation logic, screening criteria, escalation rules — and apply\nit consistently at volume, without re-specifying the logic each\ntime.<\/p>\n<p><strong>5. A shift in governance surface area.<\/strong><br />\nThe core leadership question moves from output quality (\"is this answer\ngood?\") to <strong>action authorization<\/strong> (\"should this system be\nallowed to execute this action without a human in the loop?\"). This\nrequires defining: which tool calls are auto-approved, which require\nhuman-in-the-loop (HITL) confirmation, and what rollback mechanisms\nexist if an agent takes a wrong action mid-sequence.<\/p>\n<p><strong>The risk<\/strong><\/p>\n<p>Autonomy is a multiplier on both value and error propagation. A\nsingle bad completion from a chatbot is one wrong answer, contained and\nvisible. A bad decision inside an agentic loop can cascade — an\nincorrect intermediate output becomes the input to the next tool call,\ncompounding before a human ever sees it. This makes guardrails (scoped\npermissions, action allowlists, confirmation gates for irreversible\nactions, logging/observability) a precondition for deployment, not a\nnice-to-have layered on afterward.<\/p>\n<p><strong>Bottom line<\/strong><\/p>\n<p>Chatbots are a completion engine. Agents are an execution engine —\nwith tool access, state, and autonomy. The adoption question isn't\nwhether to use agents; it's how fast an organization can build the\npermissioning and observability infrastructure to run them safely at\nscale.<\/p>\n\n\n\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Chatbots respond. Agents execute. A conversational model takes a prompt and returns a completion — a single inference pass, no persistent state, no follow-throu"}, {"part": 4, "title": "Agent vs Agentic AI", "kind": "Article", "imgs": ["imgs/a24_0.jpg"], "html": "<p><strong>Agents vs Agentic AI: What Leaders Actually Need to\nDistinguish<\/strong><\/p>\n<p>Most enterprise AI conversations in 2026 use \"agent\" and \"agentic AI\"\ninterchangeably. They are not the same thing, and the difference\ndetermines what you buy, what you govern, and what you can realistically\ndeploy this year.<\/p>\n<p><strong>The distinction<\/strong><\/p>\n<p>An <em>agent<\/em> is a thing. A model given a defined task, a set of\ntools, and instructions on how to use them. It drafts the variance\ncommentary, reconciles the invoice batch, screens the CVs.<\/p>\n<p><em>Agentic<\/em> is a property. It describes how much of the\ndecision-making the system does for itself. An agentic system is given\nan outcome rather than a task, and decides its own sequence of steps to\nget there, correcting as it goes.<\/p>\n<p>Put simply: agent is the noun, agentic is the adjective. The variable\nthat separates them is <strong>who decides the next step<\/strong> — your\nprocess designer, or the system.<\/p>\n<p><strong>The autonomy spectrum<\/strong><\/p>\n<p>Level 0 — Assistant. You prompt, it responds. You do every\nstep.<br />\nLevel 1 — Agent. Given a task, it executes a largely fixed path using\ndefined tools.<br />\nLevel 2 — Agentic. Given a goal, it plans its own path, retries, and\ndecides when the work is done.<br />\nLevel 3 — Multi-agent. Several agentic systems delegate to and hand off\nto each other.<\/p>\n<p>Nearly all enterprise value being captured today sits at Level 1.\nNearly all vendor marketing describes Level 2 and 3.<\/p>\n<p><strong>Side by side<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><\/th>\n<th><strong>Agent (Level 1)<\/strong><\/th>\n<th><strong>Agentic (Level 2–3)<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>You supply<\/td>\n<td>A task<\/td>\n<td>An outcome<\/td>\n<\/tr><tr>\n<td>Sequence decided by<\/td>\n<td>Your designer<\/td>\n<td>The system<\/td>\n<\/tr><tr>\n<td>Memory<\/td>\n<td>Usually per-run<\/td>\n<td>Persistent across steps<\/td>\n<\/tr><tr>\n<td>Failure mode<\/td>\n<td>Visible, contained<\/td>\n<td>Compounding across steps<\/td>\n<\/tr><tr>\n<td>Oversight<\/td>\n<td>Check the output<\/td>\n<td>Check the reasoning and every action<\/td>\n<\/tr><tr>\n<td>Time to value<\/td>\n<td>Weeks<\/td>\n<td>Quarters<\/td>\n<\/tr><tr>\n<td>Best fit<\/td>\n<td>High-volume, repeatable, bounded<\/td>\n<td>Variable-path, exploratory, iterative<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Five questions to ask any vendor<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Who decides the order of steps — your system, or our workflow\ndesigner?<\/p><\/li>\n<li><p>What can it change in our systems without a human approving\nfirst?<\/p><\/li>\n<li><p>Does it carry state across steps, or is each call\nindependent?<\/p><\/li>\n<li><p>If it fails at step four of nine, what happens to steps one to\nthree?<\/p><\/li>\n<li><p>Does the audit trail show only the output, or the reasoning and\nevery tool call?<\/p><\/li>\n<\/ol>\n<p>If the answers to 1 and 3 are \"our designer\" and \"independent,\" you\nare buying an agent with agentic branding. That is often the right\npurchase — but price and govern it accordingly.<\/p>\n<p><strong>The failure profiles are different, and this is the real\nissue<\/strong><\/p>\n<p>An agent fails cheaply. One task, one bad output, one human catches\nit.<\/p>\n<p>An agentic system fails expensively. An error at step two is not\ncaught — it becomes the input to step three, and the system confidently\nbuilds seven more steps on top of it. The output looks complete and\ninternally consistent. That is precisely what makes it hard to catch in\nreview.<\/p>\n<p>This is why agentic deployments demand a different control model. You\nare no longer reviewing outputs. You are reviewing decisions.<\/p>\n<p><strong>The governance rule: autonomy proportional to\nreversibility<\/strong><\/p>\n<p>Do not scale autonomy by confidence in the model. Scale it by the\ncost of being wrong.<\/p>\n<ul>\n<li><p>Reversible, internal, low value → let it run, sample the\noutput.<\/p><\/li>\n<li><p>Reversible but externally visible → human approves before it\nleaves the building.<\/p><\/li>\n<li><p>Irreversible, financial, or contractual → the system proposes, a\nnamed human commits.<\/p><\/li>\n<\/ul>\n<p>Most organisations invert this. They pilot agentic AI on the\nhighest-stakes process because that is where the ROI story is, then\nwithdraw the programme when it fails once. Sequence it the other\nway.<\/p>\n<p><strong>What to do<\/strong><\/p>\n<p>Start at Level 1 and earn your way up. Deploy bounded agents against\nprocesses you have already measured — time taken, error rate, cost per\ncycle, captured before go-live, one process at a time. Re-run the same\nnumbers at 90 days. Only then consider handing over path decisions.<\/p>\n<p>Assess readiness before autonomy, not after. Team readiness, not\nmodel capability, is what breaks agentic pilots. A team that cannot yet\nreview an agent's output has no business reviewing an agentic system's\nreasoning.<\/p>\n<p>And be direct about the shape of the portfolio. In year one, most\nenterprises need many narrow agents and one or two carefully scoped\nagentic pilots. The reverse looks more ambitious in a board deck and\ndelivers materially less.<\/p>\n<p><strong>Bottom line<\/strong><\/p>\n<p>Agents automate tasks. Agentic AI automates judgement about tasks.\nThe first is a productivity decision. The second is a governance\ndecision. Treat them as the same purchase and you will over-buy\nautonomy, under-build controls, and stall at the pilot.<\/p>", "excerpt": "Agents vs Agentic AI: What Leaders Actually Need to Distinguish Most enterprise AI conversations in 2026 use \"agent\" and \"agentic AI\" interchangeably. They are "}, {"part": 4, "title": "Skills vs MCP vs RAG vs Memory", "kind": "Article", "imgs": ["imgs/a25_0.jpg", "imgs/a25_1.jpg"], "html": "<p><strong>Skills vs MCP vs RAG vs Memory: The Four Layers<\/strong><\/p>\n<p>These four terms dominate enterprise AI architecture discussions, and\nthey are routinely presented as competing options. They are not\nalternatives. They answer four different questions, and a serious\ndeployment usually needs all four.<\/p>\n<p><strong>The four questions<\/strong><\/p>\n<p><strong>RAG<\/strong> — <em>What does the organisation know?<\/em>\nRetrieval-augmented generation pulls relevant passages from your\ndocuments at the moment of the question and hands them to the model.\nRead-only, corpus-bound.<\/p>\n<p><strong>MCP<\/strong> — <em>What can it reach and do?<\/em> The Model\nContext Protocol is the plumbing that connects a model to live systems:\nyour CRM, your ticketing tool, your file store. It reads current state\nand, if permitted, changes it.<\/p>\n<p><strong>Skills<\/strong> — <em>How do we do this here?<\/em> A packaged\nprocedure the model loads when relevant. The steps, the format, the\nstandard, the house style, the things a good analyst knows on their\nthird month that a new one does not.<\/p>\n<p><strong>Memory<\/strong> — <em>What carries over?<\/em> What persists\nabout a user or team across sessions, so context does not have to be\nre-supplied every time.<\/p>\n<p>Knowledge, access, procedure, continuity. Four layers, four owners,\nfour failure modes.<\/p>\n<p><strong>Side by side<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><\/th>\n<th><strong>RAG<\/strong><\/th>\n<th><strong>MCP<\/strong><\/th>\n<th><strong>Skills<\/strong><\/th>\n<th><strong>Memory<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Answers<\/td>\n<td>What's true<\/td>\n<td>What it can reach<\/td>\n<td>How we do it<\/td>\n<td>What carries over<\/td>\n<\/tr><tr>\n<td>Direction<\/td>\n<td>Read-only<\/td>\n<td>Read and write<\/td>\n<td>Instruction<\/td>\n<td>Accumulates<\/td>\n<\/tr><tr>\n<td>Freshness<\/td>\n<td>As fresh as the index<\/td>\n<td>Live<\/td>\n<td>As fresh as the author<\/td>\n<td>Rolling<\/td>\n<\/tr><tr>\n<td>Typical owner<\/td>\n<td>IT / knowledge management<\/td>\n<td>IT / security<\/td>\n<td>The function itself<\/td>\n<td>Platform + policy<\/td>\n<\/tr><tr>\n<td>Effort to stand up<\/td>\n<td>Project<\/td>\n<td>Integration<\/td>\n<td>Document<\/td>\n<td>Setting plus policy<\/td>\n<\/tr><tr>\n<td>Highest risk<\/td>\n<td>Permission leakage<\/td>\n<td>State change, injection<\/td>\n<td>Silent drift<\/td>\n<td>Privacy, wrong recall<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>The diagnostic: when output is wrong, which layer\nfailed?<\/strong><\/p>\n<ul>\n<li><p>It invented facts or cited the wrong document →\n<strong>RAG<\/strong>. Retrieval, not the model.<\/p><\/li>\n<li><p>The facts were stale, or it could describe the action but not\ntake it → <strong>MCP<\/strong>.<\/p><\/li>\n<li><p>The facts were right but the format, sequence, or standard was\nwrong → <strong>Skills<\/strong>.<\/p><\/li>\n<li><p>It was correct, but you had to re-explain context you had already\ngiven twice → <strong>Memory<\/strong>.<\/p><\/li>\n<\/ul>\n<p>Most enterprises diagnose all four as \"the model isn't good enough\"\nand go shopping for a better model. That fixes none of them.<\/p>\n<p><strong>Where the money usually goes wrong<\/strong><\/p>\n<p>The default enterprise instinct is to start with RAG — \"build us a\nbot that knows our documents.\" It is the most expensive layer per unit\nof value in year one. It requires a pipeline, chunking decisions, an\nevaluation set, and permission inheritance that mirrors your existing\naccess controls. Done badly, it produces a system that confidently\nanswers from the wrong version of a policy, or shows a junior the\ncompensation deck.<\/p>\n<p>Skills are the cheapest layer and the most under-invested. Encoding\nhow your finance team actually writes variance commentary — the\nsequence, the thresholds, the tone, the exclusions — is a document, not\na project. It usually delivers more visible improvement in the first\nmonth than a retrieval build delivers in six.<\/p>\n<p>MCP is the highest-leverage and highest-risk layer, because it is the\nonly one that changes something. Read-only connections first. Write\naccess earned, scoped, and logged.<\/p>\n<p>Memory is the layer to leave largely alone at the start. It accrues\nnaturally, and the governance question — what the system is allowed to\nretain about employees and clients, and for how long — should be settled\nby policy before it is settled by default.<\/p>\n<p><strong>Three questions to ask any vendor<\/strong><\/p>\n<ol type=\"1\">\n<li><p>When it answers a question, is it retrieving from a snapshot or\nreading live? If a snapshot, how old, and who refreshes it?<\/p><\/li>\n<li><p>Does it inherit our existing permissions, or does it have its own\naccess model we now have to maintain separately?<\/p><\/li>\n<li><p>What can it write to, and what is the log of every\nwrite?<\/p><\/li>\n<\/ol>\n<p>The second question is the one most often skipped and most often\nregretted. A parallel permission model is a permanent operational\nliability.<\/p>\n<p><strong>The governance rule: separate what it knows from what it can\ndo<\/strong><\/p>\n<p>Knowledge access and action authority are different grants and should\nbe approved by different people. A system that can read every contract\nis a confidentiality question. A system that can amend one is a controls\nquestion. Bundling them into a single \"AI access\" approval is how\norganisations end up with capabilities nobody deliberately signed off\non.<\/p>\n<p><strong>What to do<\/strong><\/p>\n<p>Sequence it: Skills, then read-only MCP, then RAG, then write access,\nwith memory governed by policy from day one. Assign an owner per layer —\nthe function owns its skills, IT owns access, and neither should own\nboth.<\/p>\n<p>And when the next architecture proposal arrives, ask which of the\nfour questions it answers. If the answer is \"all of them,\" it answers\nnone of them well.<\/p>\n<p><strong>Bottom line<\/strong><\/p>\n<p>RAG is what it knows. MCP is what it can touch. Skills are how it\nworks. Memory is what it retains. Confuse them and you will fund the\nexpensive layer, skip the cheap one, and grant the risky one by\naccident.<\/p>", "excerpt": "Skills vs MCP vs RAG vs Memory: The Four Layers These four terms dominate enterprise AI architecture discussions, and they are routinely presented as competing "}, {"part": 5, "title": "Why Everyone Must Learn Python", "kind": "Article", "imgs": ["imgs/a26_0.jpg"], "html": "<p>For years, learning to code was framed as a career choice — something\nyou did if you wanted to become a software engineer. That framing is now\noutdated. In the age of AI, Python isn't a specialist skill anymore;\nit's a literacy — closer to how \"using Excel\" became a baseline business\nskill two decades ago. Here's why it matters for everyone, not just\ntechnical teams.<\/p>\n<p><strong>1. Python is the on-ramp to coding for\nnon-coders<\/strong><\/p>\n<p>Python was designed to be readable — its syntax is closer to plain\nEnglish than almost any other programming language. if revenue &gt;\ntarget: print(\"bonus\") reads almost like a sentence. This makes it the\nnatural entry point for someone who has never written a line of code but\nwants to understand how logic, automation, and AI tools actually work\nunder the hood. You don't need a computer science degree to get\nfunctional in Python — you need a few hours and the willingness to\nexperiment.<\/p>\n<p><strong>2. It's the backend language of the AI world<\/strong><\/p>\n<p>Nearly every major AI framework and model — from TensorFlow and\nPyTorch to the libraries powering ChatGPT-style tools, data pipelines,\nand automation scripts — is built in or on top of Python. When you use\nan AI-powered dashboard, a chatbot, or a \"no-code\" automation tool,\nthere's a very high chance Python is running underneath it.\nUnderstanding even basic Python means understanding the actual machinery\nof the tools you're now expected to use, adopt, and manage as a\nleader.<\/p>\n<p><strong>3. Interpretability — knowing what's actually\nhappening<\/strong><\/p>\n<p>AI tools are increasingly treated as black boxes: you put in a prompt\nor a file, and something comes out. But when you understand the\nunderlying code — even at a basic level — you gain the ability to\n<em>interpret<\/em> what's happening: why a model produced a certain\noutput, what assumptions a script made, where a calculation could go\nwrong. This isn't about writing production code; it's about not being\nfully dependent on someone else's explanation of what a tool did.\nInterpretability is what separates informed oversight from blind\ntrust.<\/p>\n<p><strong>4. It closes the \"translation gap\" between business and\ntechnical teams<\/strong><\/p>\n<p>One of the most common failure points in enterprise AI or data\nprojects is the gap between what a business leader asks for and what a\ntechnical team builds — because neither side fully understands the\nother's constraints. Someone who knows even basic Python can read a\nscript, spot a wrong assumption in logic, or ask a sharper question in a\nproject review, without needing to become the one writing the code. This\ndramatically improves the quality of oversight and decision-making on\nany technical initiative.<\/p>\n<p><strong>5. It future-proofs decision-making, not just\ncareers<\/strong><\/p>\n<p>As AI agents take on more autonomous, multi-step work, the people\nmaking decisions about what these systems are allowed to do need enough\ntechnical grounding to ask the right questions — about logic,\nsafeguards, and failure points. Leaders who can't read a line of code\nare entirely dependent on someone else's interpretation of risk. Leaders\nwith even basic Python fluency can push back, verify, and govern more\neffectively.<\/p>\n<p><strong>6. It builds \"vibe coding\" fluency — a new baseline\nskill<\/strong><\/p>\n<p>With AI-assisted coding tools, you no longer need to write every line\nyourself — you can describe what you want and iterate with an AI's help.\nBut this only works well if you understand <em>just enough<\/em> Python\nto read what's being generated, catch errors, and guide the AI\neffectively. Without that baseline, you're vibe coding blind — accepting\noutput you can't evaluate. With it, you become a far more capable\ncollaborator with the AI itself.<\/p>\n<p><strong>The bottom line<\/strong><\/p>\n<p>Python isn't asking you to become a software engineer. It's asking\nyou to stop being a passenger in a world increasingly run on code you\ndon't understand. The people who invest even a modest amount of time in\nPython fluency will be the ones who can genuinely evaluate, question,\nand direct the AI systems reshaping their industries — rather than\nsimply trusting whatever comes out the other end.<\/p>", "excerpt": "For years, learning to code was framed as a career choice — something you did if you wanted to become a software engineer. That framing is now outdated. In the "}, {"part": 5, "title": "Master Perplexity Research", "kind": "Article", "imgs": ["imgs/a27_0.jpg", "imgs/a27_1.jpg"], "html": "<p>Most people use Perplexity as a better Google. Type a question, read\nthe answer, move on. That covers about ten percent of what it does.<\/p>\n<p>The bigger use is different. Ask it to build a number, not find\none.<\/p>\n<p>Half of what an analyst needs was never published. Market size for a\nsegment you define your own way. What a competitor spends on something\nthey don't disclose. What a process costs at a company that never\nmeasured it.<\/p>\n<p>Most people stop there and guess privately. It is better to make the\ntool guess out loud, show its arithmetic, and rate its own\nconfidence.<\/p>\n<p>Twenty tips, with the prompt wording for each.<\/p>\n<p><strong>Getting numbers that were never published<\/strong><\/p>\n<p><strong>1. Ask for an estimate, not a fact.<\/strong><br />\nAsk a hard question and Perplexity often replies that the figure is not\npublicly available. That is a dead end. Tell it upfront that an estimate\nis acceptable and it will build one.<\/p>\n<p><strong>Prompt<\/strong><br />\nThe exact figure is likely not published. Do not tell me it is\nunavailable. Build the best possible estimate from adjacent public data,\nstate every assumption explicitly, and show the arithmetic.<\/p>\n<p><strong>2. Demand a confidence level on every number.<\/strong><br />\nAn estimate with no confidence marker looks exactly like a hard fact.\nThat is how weak numbers reach board decks.<\/p>\n<p><strong>Prompt<\/strong><br />\nFor each figure, tag it High, Medium or Low confidence, and give a\none-line reason for the grade. High = directly sourced. Medium = derived\nfrom sourced inputs. Low = inferred or analogous.<\/p>\n<p><strong>3. Ask for three independent approaches to the same\nnumber.<\/strong><br />\nTop-down, bottom-up, analogue. If all three land in the same range, you\ncan use the number. If they are far apart, the question is harder than\nyou assumed.<\/p>\n<p><strong>Prompt<\/strong><br />\nEstimate this three ways using independent methods — top-down from\nmarket size, bottom-up from unit economics, and by analogy to a\ncomparable market. Show each separately, then compare. Where they\ndisagree, explain why.<\/p>\n<p><strong>4. Ask for a range, not a single number.<\/strong><br />\nOne number implies a precision you do not have. A low case and a high\ncase, each with its logic, holds up better when questioned.<\/p>\n<p><strong>Prompt<\/strong><br />\nGive a plausible low, central and high case. For the low and high, state\nspecifically what would have to be true for that case to hold.<\/p>\n<p><strong>5. Ask for the closest real number available.<\/strong><br />\nYour exact metric may not exist, but something near it usually does. Get\nthat figure and the gap between it and what you asked for.<\/p>\n<p><strong>Prompt<\/strong><br />\nIf this exact metric is not published, tell me the closest figure that\nis actually reported, cite it, and explain precisely how it differs from\nwhat I asked for.<\/p>\n<p><strong>6. Give it your own number and ask it to\nreact.<\/strong><br />\nThe tool is better at checking a number than producing one from scratch.\nPut your assumption into the prompt.<\/p>\n<p><strong>Prompt<\/strong><br />\nMy working assumption is X. Assess whether that is plausible against\navailable evidence. If it is wrong, tell me the direction and rough\nmagnitude of the error.<\/p>\n<p><strong>7. Ask for the inputs and do the maths\nyourself.<\/strong><br />\nFor anything going to a client, source the inputs and run the\ncalculation yourself. You can then defend every step.<\/p>\n<p><strong>Prompt<\/strong><br />\nDo not calculate the final answer. Give me the three to five input\nvariables this depends on, the current sourced value and date for each,\nand the formula that connects them.<\/p>\n<p><strong>Controlling what it searches<\/strong><\/p>\n<p><strong>8. Use Academic mode when the claim must survive\nscrutiny.<\/strong> It limits results to peer-reviewed papers instead of\nblog posts and press releases. Use it when someone will ask where the\nnumber came from.<\/p>\n<p><strong>9. Use Social mode to find out what users actually\nsay.<\/strong> It pulls from Reddit and similar sites. This is the\nfastest way to learn how a software product performs after month three,\nrather than how the vendor describes it.<\/p>\n<p><strong>10. Restrict the source type in the prompt.<\/strong><br />\nPrimary documents contain numbers that never appear in articles.<\/p>\n<p><strong>Prompt<\/strong><br />\nRestrict yourself to primary sources — annual reports, regulatory\nfilings, investor presentations, earnings call transcripts and\ngovernment statistics. No news summaries, no aggregator sites, no vendor\nmarketing pages.<\/p>\n<p><strong>11. Set a recency floor.<\/strong><br />\nPerplexity will mix a 2019 figure with a 2026 figure and present both as\ncurrent.<\/p>\n<p><strong>Prompt<\/strong><br />\nPrioritise sources from the last 18 months. Label every figure with the\nyear it refers to, not the year it was published. Flag anything older\nthan three years explicitly.<\/p>\n<p><strong>12. Name the geography or you get US data.<\/strong><br />\nAsk a market question without naming a country and you get American\nfigures built on American assumptions. For Indian enterprise work, that\nerror runs through everything after it.<\/p>\n<p><strong>Prompt<\/strong><br />\nAnswer for India specifically. Where only global or US data exists, say\nso, and state whether the Indian figure is likely to be higher or lower\nand roughly why.<\/p>\n<p><strong>Structuring the answer<\/strong><\/p>\n<p><strong>13. Specify the format before you ask the\nquestion.<\/strong><br />\nOtherwise you spend your time converting prose into a table.<\/p>\n<p><strong>Prompt<\/strong><br />\nReturn this as a table with columns: Metric, Value, Year, Source,\nConfidence. One row per metric. No introduction or conclusion.<\/p>\n<p><strong>14. Cap the length.<\/strong><br />\nLeft alone, it writes five hundred words of background you did not ask\nfor.<\/p>\n<p><strong>Prompt<\/strong><br />\nMaximum 150 words. Lead with the answer. No preamble, no summary of what\nI asked.<\/p>\n<p><strong>15. Ask where the sources disagree.<\/strong><br />\nPerplexity blends everything it finds into one smooth answer. If two\ncredible sources give different numbers, that gap disappears. The gap is\noften the most useful thing you will learn.<\/p>\n<p><strong>Prompt<\/strong><br />\nWhere do credible sources disagree on this? Show the range of published\nestimates, identify who produced each, and explain what methodological\ndifference accounts for the spread.<\/p>\n<p><strong>16. Ask what would change the answer.<\/strong><br />\nThis turns a fixed number into something you can monitor.<\/p>\n<p><strong>Prompt<\/strong><br />\nList the three developments that would most change this conclusion over\nthe next twelve months, and what the leading indicator for each would\nbe.<\/p>\n<p><strong>Catching it when it is wrong<\/strong><\/p>\n<p><strong>17. Check the citations in a separate prompt.<\/strong><br />\nPerplexity rarely invents a source. The real problem is a genuine source\nthat does not actually say what the answer claims. Ask in a new thread,\nnot the same one.<\/p>\n<p><strong>Prompt<\/strong><br />\nFor each numbered claim above, quote the specific line from the cited\nsource that supports it. If no line directly supports the claim, mark it\nUnsupported.<\/p>\n<p><strong>18. Ask for the opposite case.<\/strong><br />\nSearch results favour whoever ranks highest, which is usually the vendor\nspending most on content. That bias carries straight into the\nanswer.<\/p>\n<p><strong>Prompt<\/strong><br />\nNow argue the opposite position using the strongest available evidence.\nWhat is the best case against what you just told me?<\/p>\n<p><strong>19. Use Model Council for decisions.<\/strong><br />\nIt runs one query through three frontier models at the same time and\nshows all three answers together, marking where they agree and where\nthey differ. If the three disagree, the question is genuinely unsettled\n— not just poorly researched.<\/p>\n<p><strong>20. Ask the same question again in a clean\nthread.<\/strong><br />\nA long thread picks up your framing and starts agreeing with you. If a\nnumber matters, ask it again from scratch, in different words, with no\nhistory. The same answer from two separate starting points is worth more\nthan ten follow-up questions in one conversation.<\/p>\n<p><strong>Two workflow habits<\/strong><\/p>\n<p>Use a Space for recurring work. Set your source rules and output\nformat once instead of retyping them. Anything you research monthly — a\nclient's competitors, a sector's regulatory changes — belongs there.<\/p>\n<p>Separate the two modes. Use fast search for questions that already\nhave an answer. Use Deep Research for questions where the answer has to\nbe built. Using the first for the second is why most people conclude the\ntool is shallow.<\/p>\n<p><strong>The point<\/strong><\/p>\n<p>Perplexity is not a source of truth. It is a fast research associate\nthat delivers exactly the standard you ask for and nothing more.<\/p>\n<p>Ask for a number and you get a number. Ask for a number, three ways\nof reaching it, a confidence grade, and the conditions that would make\nit wrong — and you get something you can defend in a room.<\/p>\n<p>Most people never set the standard.<\/p>", "excerpt": "Most people use Perplexity as a better Google. Type a question, read the answer, move on. That covers about ten percent of what it does. The bigger use is diffe"}, {"part": 5, "title": "Working with Unclean Excel Files", "kind": "Article", "imgs": ["imgs/a28_0.jpg", "imgs/a28_1.jpg"], "html": "<p>Once you can generate a working HTML dashboard from a prompt, the\nbottleneck stops being the code. It becomes the file someone drags into\nit.<\/p>\n<p>Almost every failure we see in these builds traces back to a\nspreadsheet that was designed to be read by a human and is now being\nread by a parser. Humans skip the title row, ignore the blank line,\nunderstand that the bold row at the bottom is a total. Code does none of\nthis.<\/p>\n<p>Twenty things to get right, on both sides — the file and the parsing\nlogic.<\/p>\n<p><strong>Layout<\/strong><\/p>\n<p><strong>1. Data starts at A1.<\/strong> No company name in row 1, no\nlogo, no \"Report as of March 2025\", no blank spacer row. The parser\ntakes the first row it finds as the header. Give it the header.<\/p>\n<p><strong>2. No merged cells anywhere.<\/strong> A merged cell resolves\nto one value and a series of empty cells. Merged headers are the worst\nversion of this, because the columns underneath end up unnamed and\neverything downstream is silently misaligned.<\/p>\n<p><strong>3. One table per sheet.<\/strong> Two tables side by side, or\nstacked with a gap, will be read as one rectangle with a lot of holes.\nIf a sheet has a summary block above the detail, split them.<\/p>\n<p><strong>4. Name the sheet you want.<\/strong> Parsers default to the\nfirst sheet, which in most corporate workbooks is a cover page or an\ninstructions tab. Read sheets by name in the code, and fail loudly with\na list of available sheets when the name is missing.<\/p>\n<p><strong>5. Hidden and filtered rows still come through.<\/strong>\nFilters and hidden columns are a display state, not a data state. If\nsomeone filtered to Q4 before sending the file, the code still sees all\nfour quarters. Delete, don't hide.<\/p>\n<p><strong>Headers<\/strong><\/p>\n<p><strong>6. No two columns with the same heading.<\/strong> Most\nparsers map rows to objects keyed by header. Two columns called \"Amount\"\nmeans one of them silently overwrites the other, and the dashboard will\nlook completely plausible while being wrong.<\/p>\n<p><strong>7. No blank headings.<\/strong> An unnamed column becomes\n__EMPTY, __EMPTY_1, and so on. Either name it or drop it before\nupload.<\/p>\n<p><strong>8. One header row, not two.<\/strong> Stacked headers — a\nmerged category row above a detail row — are a human convention. Flatten\nthem into single names like Q1_Revenue, Q1_Units before the file goes\nanywhere near the parser.<\/p>\n<p><strong>9. Trim and normalise in the code.<\/strong> \"Region \" and\n\"Region\" are different keys, and the trailing space is invisible to\nwhoever created the file. Strip whitespace, standardise case, and build\na mapping layer rather than trusting the header string exactly as\ntyped.<\/p>\n<p><strong>Data types<\/strong><\/p>\n<p><strong>10. Numbers stored as text.<\/strong> The most common single\ncause of a chart that renders with everything at zero, or a total that\nconcatenates instead of adding. Coerce explicitly and check what fails\nrather than assuming the type.<\/p>\n<p><strong>11. Currency symbols and separators live inside the\ncell.<\/strong> ₹1,20,000 is a string. So is $4.5M. Format currency in\nthe display layer, keep the underlying cell as a raw number.<\/p>\n<p><strong>12. Percentages are ambiguous.<\/strong> A cell showing 45%\nmay hold 0.45 or 45 depending on how it was formatted. Decide the\nconvention, state it, and validate against a known total.<\/p>\n<p><strong>13. Dates are the biggest trap.<\/strong> Excel stores them as\nserial numbers, so 45231 is a date that will parse as a number.\nConverting through a JavaScript date without controlling for timezone\nroutinely shifts everything by one day. And 03/04/2025 is March or April\ndepending on who made the file. Force an unambiguous format like\nYYYY-MM-DD at source.<\/p>\n<p><strong>14. Leading zeros disappear.<\/strong> Employee IDs, PIN\ncodes, cost centre codes, account numbers. 007 becomes 7, and your join\nagainst another table quietly returns nothing. These are identifiers,\nnot numbers — keep them as text.<\/p>\n<p><strong>Rows and content<\/strong><\/p>\n<p><strong>15. No total or subtotal rows inside the data.<\/strong> A\ngrand total row will be charted as a data point roughly twice the size\nof everything else. Totals are something the dashboard calculates, not\nsomething it inherits.<\/p>\n<p><strong>16. No blank rows in the middle, no footnotes at the\nbottom.<\/strong> * Figures exclude the Nagpur plant is not a data row,\nbut it will become one. Strip trailing rows that don't match the column\nstructure.<\/p>\n<p><strong>17. Blank is not zero.<\/strong> An empty cell and a 0 mean\ndifferent things — one is \"no sales\", the other is \"we don't know\".\nAverages change materially depending on how you treat them. Decide\ndeliberately, and say which you chose on the dashboard itself.<\/p>\n<p><strong>18. Category values must be consistent.<\/strong> North,\nnorth, North and NORTH will produce four bars in a chart that should\nhave one. Normalise on read, and surface the distinct values so someone\ncan spot the duplicates.<\/p>\n<p><strong>19. Never use a pivot table or a formula-heavy sheet as the\nsource.<\/strong> Pivots are output, not data. Formula errors — #REF!,\n#N/A, #DIV/0! — flow straight through as strings and break every numeric\noperation after them. Paste as values into a clean sheet.<\/p>\n<p><strong>Practical<\/strong><\/p>\n<p><strong>20. Reference columns by name, never by position.<\/strong>\nrow[3] works until someone inserts a column, at which point the\ndashboard is wrong rather than broken — which is far more dangerous. Map\nby header name and throw an explicit error when an expected column is\nmissing.<\/p>\n<p>Two more worth building in as habit rather than rules. Browser-side\nparsing struggles well before you reach enterprise data volumes, so set\na row limit and tell the user what it is instead of letting the tab\nfreeze. And be deliberate about what goes into the file at all — a\nbrowser tool is exactly the wrong place to discover that a sheet has\nsalary data or customer names in columns nobody was looking at.<\/p>\n<p><strong>The habit that prevents most of this<\/strong><\/p>\n<p>One sheet. One table. Starting at A1. One row of unique headers. No\nmerges, no totals, no footnotes, no formatting doing the work of\ndata.<\/p>\n<p>Almost every rule above is a specific instance of that. Most teams\nget there faster by building a clean extract sheet next to the working\nfile than by trying to reform the working file itself — the operational\nspreadsheet has a human audience and should keep it.<\/p>\n<p>The parser gets its own copy.<\/p>", "excerpt": "Once you can generate a working HTML dashboard from a prompt, the bottleneck stops being the code. It becomes the file someone drags into it. Almost every failu"}, {"part": 5, "title": "Safety of HTML", "kind": "Article", "imgs": ["imgs/a29_0.jpg"], "html": "<p><strong>The business case<\/strong><\/p>\n<p>When you're building dashboards, reports, calculators, or internal\nutilities through AI-assisted (\"vibe\") coding, HTML is often the most\npractical output format — not because it's technically superior in every\ndimension, but because of what it means for deployment and adoption\ninside a business.<\/p>\n<p><strong>1. Zero-friction distribution.<\/strong> An HTML file opens in\nany browser — no installation, no license, no IT approval cycle. You can\nemail it, put it on a shared drive, or drop it into a Teams channel, and\nthe person on the other end just double-clicks and it works. Compare\nthis to a Python script (needs an interpreter and dependencies) or a\ncompiled app (needs OS compatibility, permissions, sometimes admin\nrights). For a consulting practice or an internal team rolling out a\ntool to dozens of non-technical stakeholders, this removes almost all\ndeployment friction.<\/p>\n<p><strong>2. Self-contained and portable.<\/strong> A single HTML file\ncan carry its own CSS, JavaScript, and even embedded data or charting\nlibraries. There's nothing to \"install\" and nothing that breaks because\na server went down or a subscription lapsed. This makes it ideal for\ncalculators, one-off dashboards, or utilities that need to outlive a\nsingle project engagement — the client can keep using it long after your\ncontract ends.<\/p>\n<p><strong>3. Fast iteration cycles.<\/strong> Because HTML/JS is quick\nto generate, test, and modify with AI assistance, you can go from\n\"here's what I want\" to a working prototype in the same meeting. This is\na major advantage when you're co-designing a tool live with a business\nstakeholder — changes to layout, logic, or branding can be shown\nimmediately.<\/p>\n<p><strong>4. No recurring cost or vendor lock-in.<\/strong> Unlike SaaS\ndashboard tools, an HTML deliverable has no subscription, no seat\nlicensing, and no dependency on a third-party platform staying in\nbusiness. For clients who want a tool they fully own, this matters\ncommercially.<\/p>\n<p><strong>5. Branding and professionalism.<\/strong> HTML gives full\ncontrol over look and feel — logos, color palettes, typography — so\ndeliverables can be styled to match a client's or firm's brand identity,\nwhich matters when the output is client-facing.<\/p>\n<p><strong>On data safety: does uploading an Excel file into an HTML\ntool \"go online\"?<\/strong><\/p>\n<p>This depends entirely on <em>how<\/em> the HTML tool is built, and\nit's worth being precise here rather than making a blanket claim:<\/p>\n<ul>\n<li><p><strong>If the HTML file processes the upload entirely in the\nbrowser<\/strong> (i.e., the JavaScript reads the Excel file locally\nusing something like the SheetJS/xlsx library and does all calculations\nclient-side), then the data never leaves the user's machine. Nothing is\ntransmitted to a server, and there is no network call involved in\nreading or processing the file. In this case, it's accurate to say the\ndata stays local and private.<\/p><\/li>\n<\/ul>\n<p><strong>If the HTML tool includes any server call<\/strong> — for\nexample, it sends data to an API, calls a backend for AI processing, or\nlogs data to an external service — then the file's contents (or parts of\nthem) <em>are<\/em> going online, and this needs to be disclosed clearly\nto users.<br />\n<\/p>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "The business case When you're building dashboards, reports, calculators, or internal utilities through AI-assisted (\"vibe\") coding, HTML is often the most pract"}, {"part": 5, "title": "People to Follow", "kind": "Article", "imgs": [], "html": "<div class=\"tw\"><table><thead><tr>\n<th><strong>Name<\/strong><\/th>\n<th><strong>Best Known For<\/strong><\/th>\n<th><strong>Why Leaders Should Follow<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Allie K. Miller<\/td>\n<td>AI advisor, ex-Amazon/IBM<\/td>\n<td>Named AI Innovator of the Year, with daily content on AI strategy,\ngovernance, and implementation for enterprises grounded in real\noperational experience<\/td>\n<\/tr><tr>\n<td>Andrej Karpathy<\/td>\n<td>Independent researcher, ex-Tesla/OpenAI<\/td>\n<td>Deep technical expertise with clear communication; cautions that AI\nagents should be \"kept on a leash\" rather than left unsupervised<\/td>\n<\/tr><tr>\n<td>Andrew Ng<\/td>\n<td>Educator, founder of DeepLearning.AI, \"The Batch\" newsletter<\/td>\n<td>Practical, hands-on approach to AI adoption widely followed by\nbusiness audiences, not just technologists<\/td>\n<\/tr><tr>\n<td>Cassie Kozyrkov<\/td>\n<td>Former Chief Decision Scientist, Google<\/td>\n<td>Decision-science framing of AI — useful for governance and judgment\nquestions<\/td>\n<\/tr><tr>\n<td>Dario Amodei<\/td>\n<td>CEO, Anthropic<\/td>\n<td>Deep credibility and insight into what AI companies believe about\nsafety, deployment, and enterprise risk<\/td>\n<\/tr><tr>\n<td>Demis Hassabis<\/td>\n<td>CEO, Google DeepMind<\/td>\n<td>Founder-level perspective from one of the frontier labs, shaping\nwhere model capability is headed<\/td>\n<\/tr><tr>\n<td>Emad Mostaque<\/td>\n<td>Founder, Stability AI<\/td>\n<td>Vocal advocate for open, decentralised AI development as an\nalternative to closed, corporate-controlled AI systems<\/td>\n<\/tr><tr>\n<td>Ethan Mollick<\/td>\n<td>Wharton professor, \"One Useful Thing\" Substack<\/td>\n<td>One of the most cited voices for translating AI capability into real\nworkplace use cases<\/td>\n<\/tr><tr>\n<td>Fei-Fei Li<\/td>\n<td>Co-Director, Stanford HAI<\/td>\n<td>Prioritizes responsible AI over sensationalism; strong voice on\nhuman-centered design<\/td>\n<\/tr><tr>\n<td>Kai-Fu Lee<\/td>\n<td>Chairman/CEO, Sinovation Ventures; author, AI Superpowers<\/td>\n<td>Bridge voice between Western and Chinese AI development, uniquely\npositioned as both practitioner and investor amid intensifying AI\ngeopolitics<\/td>\n<\/tr><tr>\n<td>Paul Roetzer<\/td>\n<td>Founder, Marketing AI Institute<\/td>\n<td>Translates frontier AI developments into actionable business\nguidance without oversimplifying, including case studies on mandatory\nenterprise AI adoption<\/td>\n<\/tr><tr>\n<td>Sam Altman<\/td>\n<td>CEO, OpenAI<\/td>\n<td>Company founder shaping the commercial and product direction of the\nindustry<\/td>\n<\/tr><tr>\n<td>Satya Nadella<\/td>\n<td>CEO, Microsoft<\/td>\n<td>\"AI for everyone\" vision and massive infrastructure investment have\nmade Microsoft a dominant force in enterprise AI adoption<\/td>\n<\/tr><tr>\n<td>Sundar Pichai<\/td>\n<td>CEO, Alphabet/Google<\/td>\n<td>Leads one of the world's largest AI research organisations, driving\nthe Gemini model family<\/td>\n<\/tr><tr>\n<td>Yann LeCun<\/td>\n<td>AI researcher, formerly Chief AI Scientist at Meta<\/td>\n<td>One of the most influential foundational researchers in the\nfield<\/td>\n<\/tr><tr>\n<td>Yoshua Bengio<\/td>\n<td>Turing Award laureate, AI safety researcher<\/td>\n<td>Operates at the cutting edge of technical research; leading voice on\nAI safety<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Name Best Known For Why Leaders Should Follow Allie K. Miller AI advisor, ex-Amazon/IBM Named AI Innovator of the Year, with daily content on AI strategy, gover"}, {"part": 5, "title": "Links", "kind": "Article", "imgs": [], "html": "<p><strong>Websites<\/strong><\/p>\n<p><a\nhref=\"https://ruben.substack.com/\">https://ruben.substack.com/<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://venturebeat.com/\">https://venturebeat.com/<\/a><\/p>\n<p><a\nhref=\"https://www.xda-developers.com/\">https://www.xda-developers.com/<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://menlovc.com/\">https://menlovc.com/<\/a><\/p>\n<p><a\nhref=\"https://lifearchitect.ai/about-alan/\">https://lifearchitect.ai/about-alan/<\/a><\/p>\n<p><a\nhref=\"https://simonwillison.net/\">https://simonwillison.net/<\/a><\/p>\n<p><a\nhref=\"https://magazine.s
