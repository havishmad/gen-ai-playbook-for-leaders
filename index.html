<title>GenAI Playbook Library</title>
<style>
/* Layout: plain white library shelf — parts as sections, 4:5 cards, popup reader split infographic | article */
:root{
  --bg:#ffffff; --ink:#14203f; --muted:#5d6782; --line:#e3e7ef; --soft:#f4f6fa; --navy:#1e2761; --accent:#2f5bd3;
  --display:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:48px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;letter-spacing:-.015em;font-size:clamp(26px,3.4vw,36px);line-height:1.08;margin:8px 0 6px;color:var(--navy);text-wrap:balance}
.sub{color:var(--muted);margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:500 13px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.filters button:focus-visible,.card:focus-visible,.mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin-top:44px}
.ph{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.ph .pn{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent);white-space:nowrap}
.ph h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:28px 22px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.thumb{position:relative;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft);transition:transform .18s ease,box-shadow .18s ease}
.card:hover .thumb{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(20,32,63,.35)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.txt{height:100%;padding:20px 18px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.txt .q{font-family:var(--display);font-weight:700;letter-spacing:-.01em;font-size:22px;line-height:1.15;color:var(--navy)}
.txt .ex{font-size:12.5px;color:var(--muted);line-height:1.5;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent)}
.badge{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;background:rgba(255,255,255,.94);color:var(--navy);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.ct{font-weight:600;font-size:14.5px;line-height:1.3;color:var(--ink)}
.cm{font-size:12px;color:var(--muted);margin-top:-6px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(14,22,48,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--bg);width:min(1240px,100%);height:min(94vh,100%);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.mh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh .t{flex:1;min-width:0}
.mh .t small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.mh .t strong{display:block;font-family:var(--display);font-weight:700;font-size:22px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn{font:500 13px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);height:36px;min-width:36px;padding:0 10px;border-radius:6px;cursor:pointer}
.mbtn:hover{background:var(--soft)}
.mb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mb.solo{grid-template-columns:minmax(0,1fr)}
.pics{overflow:auto;background:var(--soft);padding:20px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line)}
.pics a{display:block}
.pics img{width:100%;display:block;border-radius:4px;box-shadow:0 2px 10px -4px rgba(20,32,63,.25);background:#fff}
.art{overflow:auto;padding:26px 34px 48px}
.art>div{max-width:68ch;margin:0 auto}
.mb.solo .art>div{max-width:780px}
.art p{margin:0 0 .9em}
.art h3,.art h4{font-family:var(--display);font-weight:700;color:var(--navy)}
.art strong{color:var(--navy)}
.art ul,.art ol{padding-left:1.2em;margin:0 0 1em}
.art li{margin-bottom:.45em}
.art a{color:var(--accent);word-break:break-all}
.tw{overflow-x:auto;margin:0 0 1.2em;border:1px solid var(--line);border-radius:6px}
.art table{border-collapse:collapse;width:100%;font-size:13px}
.art th,.art td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.art thead th,.art tr:first-child th{background:var(--soft)}
.art td p,.art th p{margin:0}
@media (max-width:820px){
  .mb{grid-template-columns:minmax(0,1fr);overflow:auto;display:block}
  .pics{overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .art{overflow:visible;padding:20px 18px 40px}
  .mh .t strong{font-size:18px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){.thumb{transition:none}.card:hover .thumb{transform:none}}
body.lock{overflow:hidden}
</style>

<script id="data" type="application/json">{"parts": ["Part 1 — Awareness: Understand the Landscape", "Part 2 — Strategy: Decide Where to Play", "Part 3 — Adoption: Get it Used", "Part 4 — ROI: Prove it", "Part 5 — Risk: Know What Can Go Wrong", "Part 6 — Governance: Run AI Safely", "Part 7 — Architecture: What Leaders are Being Sold", "Part 8 — For your Teams: The Builder’s Kit", "Appendix"], "articles": [{"part": 0, "title": "Awareness to Adoption to ROI", "kind": "Article", "imgs": ["imgs/a00_0.jpg"], "html": "<p><strong>Every Organisation Thinks It Is One Stage Ahead of Where It\nIs<\/strong><\/p>\n<p>Ask a leadership team where they are on AI and you will almost always\nhear the same answer. We are past the basics. We're scaling now. We just\nneed to show the returns.<\/p>\n<p>Then you walk the floor and find managers who have never opened the\ntool, a pilot that has been running for eleven months, and a finance\nteam that cannot say what any of it has saved because nobody wrote down\nwhat it cost before.<\/p>\n<p>There are three stages. Awareness, Adoption, ROI. Nobody skips one.\nOrganisations that believe they have skipped one have simply not noticed\nthat they are still standing in it.<\/p>\n<p><strong>Stage One: Awareness<\/strong><\/p>\n<p>Awareness is routinely mistaken for exposure. A town hall was held. A\nnewsletter went out. Two hundred licences were purchased. Everyone has\nheard of the technology, so surely the stage is complete.<\/p>\n<p>Being told is not the same as knowing what to do on Monday\nmorning.<\/p>\n<p>Real awareness has three markers. People can say what the technology\ndoes and what it does not do, because a team that cannot separate a\nchatbot from an agent cannot scope a use case or judge a vendor. Every\nfunction can name three tasks inside their own workflow where this\napplies, because specificity is awareness and enthusiasm is not. And\npeople know what they are allowed to do with company data, because where\nno safety position exists, the cautious stop and the reckless proceed,\nand the second group reaches the board first.<\/p>\n<p>The work here takes four to six weeks. Run a baseline before anything\ngoes live, one process at a time, capturing what it costs today in\nhours, error rate and rework. Put the leadership team in a room and make\nthem fail with the tool rather than watch a demo. Publish a two-page\nsafety position. Set a 90-Day North Star with one named owner and one\ndate.<\/p>\n<p><strong>The gate:<\/strong> a randomly chosen mid-level manager can\nname one task they now do differently, and one task they have\ndeliberately decided not to use AI for. Both halves matter. The second\nis what separates an aware organisation from an excited one.<\/p>\n<p><strong>Stage Two: Adoption<\/strong><\/p>\n<p>This is the longest stage and the one where most organisations\nquietly stop. It has two halves, and the gap between them is where the\nmoney goes to die.<\/p>\n<p>The first half is the pilot. Pilots are easy and almost always\nsucceed. You pick a motivated team, a clean process and a forgiving\nsuccess metric. Something works. Slides are made.<\/p>\n<p>The second half is scale, and it fails for reasons that have nothing\nto do with the technology. The process was never documented, so there is\nnothing to standardise. The workflow depends on one enthusiastic person\nwho has now been promoted. Nobody has budget authority for the licences\nbeyond the pilot. Middle managers were measured on the old outputs the\nentire time and correctly concluded that the new way was a personal risk\nwith no personal upside.<\/p>\n<p>Pilot purgatory is an organisational design problem wearing a\ntechnology costume. The tell is a company with fourteen successful\npilots and zero changed processes.<\/p>\n<p>What actually moves an organisation through this stage is\nunglamorous. Rewrite the standard operating procedure, not just the tool\naccess. Change what managers are measured on, because behaviour follows\nthe scorecard and nothing else. Name an owner for each workflow who has\nthe authority to stop the old version, since running both in parallel\nforever is how adoption dies politely. Retire the previous method on a\nstated date.<\/p>\n<p><strong>The gate:<\/strong> the old way of doing the work is switched\noff, and the organisation has not fallen over. Until something is turned\noff, nothing has been adopted. You have added a tool, not changed a\nprocess.<\/p>\n<p><strong>Stage Three: ROI<\/strong><\/p>\n<p>ROI is treated as a result. It should be treated as a discipline, and\nit is a stage rather than a finish line because most organisations reach\nit and discover they cannot prove anything.<\/p>\n<p>The failure is almost always structural, and it happened months\nearlier. There was no baseline. Nobody recorded what the process cost\nbefore the change, so every claim of saving becomes a negotiation\nbetween an optimistic function head and a sceptical CFO. The honest\nanswer is that nobody knows.<\/p>\n<p>The second failure is measuring activity instead of outcome. Licences\nissued, prompts run, hours of training delivered. These are inputs. They\ntell you what was spent, not what was returned. A dashboard full of\nusage statistics is a confession that the outcome was never defined.<\/p>\n<p>The third is attribution. Something improved during a period in which\nmany things changed. A defensible ROI claim requires a stated baseline,\na comparison population or period, and an honest note on what else was\nhappening at the time. Senior finance people respect a smaller number\nwith a clear method far more than a large number with a vague one.<\/p>\n<p>Done properly, this stage produces something more valuable than a\npercentage. It produces the ability to say which use cases are worth\nrepeating and which were expensive theatre, which is the only basis on\nwhich anyone should be approving the next round of investment.<\/p>\n<p><strong>The gate:<\/strong> the CFO will repeat your number to someone\noutside the organisation. Numbers that survive only inside the room that\nproduced them are not returns. They are morale.<\/p>\n<p><strong>The point of naming the stages<\/strong><\/p>\n<p>The value is not in the diagram. It is in the diagnosis, and\ndiagnosis is uncomfortable because most organisations that describe\nthemselves as scaling are still in Awareness, and most that describe\nthemselves as measuring ROI never left the pilot.<\/p>\n<p>Run the three gate tests before your next AI investment decision.\nThey take an afternoon.<\/p>\n<p>Whichever gate you fail first is where the work is. Everything you\nspend beyond that point is spent on the wrong stage.<strong><br />\n<\/strong><\/p>", "excerpt": "Every Organisation Thinks It Is One Stage Ahead of Where It Is Ask a leadership team where they are on AI and you will almost always hear the same answer. We ar"}, {"part": 0, "title": "Creating Value", "kind": "Article", "imgs": ["imgs/a01_0.jpg"], "html": "<p><strong>Where GenAI Creates Value: Four Places to Look\nFirst<\/strong><\/p>\n<p>Most leaders start with the wrong question: “What can AI do?” The\nhonest answer is “almost anything,” which helps nobody decide what to do\non Monday.<\/p>\n<p>The better question is narrower: where in your team’s week does time\ngo on work that needs effort but not expertise? That is where GenAI pays\nback first.<\/p>\n<p>In practice, the value lands in four places.<\/p>\n<p><strong>1. Productivity: the first draft, done in\nminutes<\/strong><\/p>\n<p>Summarising a 40-page report. Turning meeting notes into an action\nlist. Drafting the monthly update, the vendor email or the first version\nof a presentation.<\/p>\n<ul>\n<li><p><strong>What it looks like:<\/strong> a manager spends 10 minutes\nreviewing a draft instead of 90 minutes writing it<\/p><\/li>\n<li><p><strong>Where to start:<\/strong> the documents your team writes\nevery week in roughly the same shape<\/p><\/li>\n<\/ul>\n<p>“Summarise this report in one page for the leadership team. Lead with\nthe three decisions it asks us to make.”<\/p>\n<p><strong>2. Knowledge: finding what the company already\nknows<\/strong><\/p>\n<p>Answers sit in SOPs, policy documents, product sheets and old\nproposals. People still ask a colleague because searching takes\nlonger.<\/p>\n<ul>\n<li><p><strong>What it looks like:<\/strong> a new joiner gets the leave\npolicy, the approval matrix and last year’s proposal for the same client\nin one question<\/p><\/li>\n<li><p><strong>Where to start:<\/strong> the questions your HR, finance\nor IT teams answer again and again<\/p><\/li>\n<\/ul>\n<p><strong>3. Innovation: more ideas, tested faster<\/strong><\/p>\n<p>Generating 20 campaign angles, drafting a product note, scanning what\ncompetitors launched last quarter or stress-testing a new idea before it\nreaches the board.<\/p>\n<ul>\n<li><p><strong>What it looks like:<\/strong> a team walks into the\nbrainstorm with 30 options already sorted, not a blank\nwhiteboard<\/p><\/li>\n<li><p><strong>Where to start:<\/strong> any decision that today waits\nfor “someone to do some research”<\/p><\/li>\n<\/ul>\n<p>“Give me 15 ideas to reduce dealer churn. Group them by cost and time\nto launch. Mark which ones a competitor has already tried.”<\/p>\n<p><strong>4. Decision-making: from data to a view<\/strong><\/p>\n<p>Analysing sales data, spotting patterns in complaints, building\nscenarios for the budget review.<\/p>\n<ul>\n<li><p><strong>What it looks like:<\/strong> the regional head asks “what\nif we cut the discount by 2%?” and gets three scenarios the same\nafternoon<\/p><\/li>\n<li><p><strong>Where to start:<\/strong> the reports that are produced\nevery month but rarely change a decision<\/p><\/li>\n<\/ul>\n<p><strong>How to pick your first use case<\/strong><\/p>\n<p>A good first use case has four things:<\/p>\n<ul>\n<li><p><strong>It repeats:<\/strong> weekly or daily, not once a\nyear<\/p><\/li>\n<li><p><strong>It’s slow but not sensitive:<\/strong> hours of effort,\nlow risk if the first draft is wrong<\/p><\/li>\n<li><p><strong>Someone checks it anyway:<\/strong> there’s already a\nreview step, so a human stays in the loop<\/p><\/li>\n<li><p><strong>You can measure it:<\/strong> time taken today, time taken\nwith AI<\/p><\/li>\n<\/ul>\n<p>Skip anything that touches salaries, client contracts or personal\ndata until your rules are clear.<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Ask each person in your team one question: “Which task eats your time\nevery week but doesn’t need your best thinking?” Pick the answer that\ncomes up most. That is your first use case.<\/p>\n<p><strong>The rule:<\/strong> start where effort is high and expertise\nis low. Every leader should leave with one to three use cases they can\ntest this month.<\/p>", "excerpt": "Where GenAI Creates Value: Four Places to Look First Most leaders start with the wrong question: “What can AI do?” The honest answer is “almost anything,” which"}, {"part": 0, "title": "China vs US Models", "kind": "Article", "imgs": ["imgs/a02_0.jpg"], "html": "<p><strong>China vs US Models: Build a Portfolio, Not a\nLoyalty<\/strong><\/p>\n<p>A year ago, “which AI model?” was a question for IT. Today it’s a\nquestion about cost, data and geopolitics, and it belongs on the\nleadership agenda.<\/p>\n<p>The model market has split into two broad camps. Knowing how they\ndiffer helps you spend less where it’s safe to and protect what matters\nwhere it isn’t.<\/p>\n<p><strong>The two camps<\/strong><\/p>\n<p><strong>US frontier labs: closed, premium,\nenterprise-ready<\/strong><\/p>\n<p>OpenAI, Anthropic and Google lead on raw capability and sell through\nclosed models you reach by subscription or API.<\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> top capability, enterprise contracts,\nadmin controls, SOC 2 and data agreements as standard<\/p><\/li>\n<li><p><strong>Watch:<\/strong> premium pricing; your data runs on the\nvendor’s cloud under their terms<\/p><\/li>\n<\/ul>\n<p><strong>Chinese labs: open-weight, low-cost, fast-moving<\/strong><\/p>\n<p>DeepSeek, Alibaba’s Qwen, Moonshot’s Kimi and Zhipu’s GLM release\nmany models as open weights that anyone can download and run.<\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> much lower cost, can be self-hosted\non infrastructure you control, rapid release cycles<\/p><\/li>\n<li><p><strong>Watch:<\/strong> independent evaluators place the best of\nthem a few months behind the US frontier overall; enterprise support,\ncertifications and data agreements are thinner; provenance and security\nreviews matter<\/p><\/li>\n<\/ul>\n<p>Open-weight isn’t the same as open-source. You get the model, not the\ntraining data, and licence terms vary.<\/p>\n<p><strong>Three implications for leaders<\/strong><\/p>\n<p><strong>1. Costs are diverging<\/strong><\/p>\n<p>Routine, lower-risk work (internal drafting, ticket triage,\nfirst-pass summaries) can run on cheaper open-weight models. Keep\nfrontier models for high-stakes reasoning, client-facing output and\nregulated decisions.<\/p>\n<p><strong>2. Data sovereignty is a board question<\/strong><\/p>\n<p>For any model touching customer, financial or employee data, ask:\nwhere does it run, who can see the logs and which country’s law applies?\nThe risk runs both ways. A US cloud API and a self-hosted Chinese model\neach raise different questions.<\/p>\n<p><strong>3. Self-hosting changes the trade-off<\/strong><\/p>\n<p>Running an open-weight model on your own servers keeps data inside\nyour walls and makes it easier to audit. It also makes you responsible\nfor security, updates and support.<\/p>\n<p><strong>How to decide, task by task<\/strong><\/p>\n<ul>\n<li><p><strong>Sensitive data, regulated decisions, client\noutput:<\/strong> an enterprise plan from a vendor with strong data\nterms<\/p><\/li>\n<li><p><strong>High volume, low risk, cost-sensitive:<\/strong> consider\nopen-weight models, ideally hosted by you or a trusted provider<\/p><\/li>\n<li><p><strong>Anything with export, sector or client\nrestrictions:<\/strong> check model provenance with legal before\nuse<\/p><\/li>\n<\/ul>\n<p>“Here are our five main AI use cases: [list with data types]. For\neach, recommend closed frontier or open-weight, where it should run and\nthe main risk to check.”<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>List every AI model your company uses, including those inside vendor\ntools. Note where each runs and who can see the data. If you can’t\nanswer for any model, that’s your first conversation with IT.<\/p>\n<p><strong>The rule:<\/strong> don’t pick a country, build a portfolio.\nRoute each task by sensitivity and cost, not by brand loyalty.<\/p>", "excerpt": "China vs US Models: Build a Portfolio, Not a Loyalty A year ago, “which AI model?” was a question for IT. Today it’s a question about cost, data and geopolitics"}, {"part": 0, "title": "HMC AI Readiness Index™", "kind": "Framework", "imgs": ["imgs/a03_0.jpg"], "html": "<p><strong>Are We Ready? Score Five Foundations Before You\nScale<\/strong><\/p>\n<p>Every leadership team asks it: “Are we ready for AI?” Most answer by\ncounting licences, or by pointing at one team that’s doing well.<\/p>\n<p>Neither tells you whether AI will spread across the company.\nReadiness isn’t one thing. It’s five foundations, and a weak one will\nstall the other four.<\/p>\n<p>The HMC AI Readiness Index™ scores each foundation from 1 to 5, so\nyou know where to invest before you scale.<\/p>\n<p><strong>1. Data: can the AI reach good information?<\/strong><\/p>\n<ul>\n<li><p><strong>1:<\/strong> data sits in personal Excel files and email\nattachments<\/p><\/li>\n<li><p><strong>3:<\/strong> key data sets live in shared systems, with\nsome known owners<\/p><\/li>\n<li><p><strong>5:<\/strong> the data for your top use cases is clean,\ncurrent, owned and accessible to approved tools<\/p><\/li>\n<\/ul>\n<p><strong>Ask:<\/strong> if AI needed our sales, HR or inventory data\ntomorrow, how many people would we have to call?<\/p>\n<p><strong>2. People: can your teams use it well?<\/strong><\/p>\n<ul>\n<li><p><strong>1:<\/strong> a handful of enthusiasts; most staff have\nnever tried it at work<\/p><\/li>\n<li><p><strong>3:<\/strong> basic training done; usage is uneven across\nfunctions<\/p><\/li>\n<li><p><strong>5:<\/strong> every role knows which tasks to use AI for,\nand managers expect it<\/p><\/li>\n<\/ul>\n<p><strong>Ask:<\/strong> can a randomly chosen manager show you one task\nthey now do differently?<\/p>\n<p><strong>3. Process: is there somewhere for AI to land?<\/strong><\/p>\n<ul>\n<li><p><strong>1:<\/strong> processes live in people’s heads<\/p><\/li>\n<li><p><strong>3:<\/strong> core processes are documented but haven’t\nchanged since AI arrived<\/p><\/li>\n<li><p><strong>5:<\/strong> processes have been redesigned with AI in\nthem, and the old way is switched off<\/p><\/li>\n<\/ul>\n<p><strong>Ask:<\/strong> which process has actually changed, not just\nsped up?<\/p>\n<p><strong>4. Technology: are the tools approved and\nconnected?<\/strong><\/p>\n<ul>\n<li><p><strong>1:<\/strong> staff use personal accounts on consumer\ntools<\/p><\/li>\n<li><p><strong>3:<\/strong> an enterprise tool is approved but sits apart\nfrom core systems<\/p><\/li>\n<li><p><strong>5:<\/strong> approved tools connect to the systems people\nwork in, with access controls<\/p><\/li>\n<\/ul>\n<p><strong>Ask:<\/strong> what share of AI use happens on tools IT has\napproved?<\/p>\n<p><strong>5. Governance: can you say yes safely?<\/strong><\/p>\n<ul>\n<li><p><strong>1:<\/strong> no AI policy; nobody knows who approves a use\ncase<\/p><\/li>\n<li><p><strong>3:<\/strong> a policy exists; approvals are slow and case\nby case<\/p><\/li>\n<li><p><strong>5:<\/strong> a risk-tiered policy, a named owner and a\nfast track for low-risk use cases<\/p><\/li>\n<\/ul>\n<p><strong>Ask:<\/strong> how long does it take to get a low-risk use\ncase approved?<\/p>\n<p><strong>Reading the score<\/strong><\/p>\n<ul>\n<li><p><strong>Under 12:<\/strong> build foundations first. Pilots will\nwork, but they won’t scale.<\/p><\/li>\n<li><p><strong>12 to 19:<\/strong> scale selectively. Fix the lowest\nfoundation before adding use cases.<\/p><\/li>\n<li><p><strong>20 and above:<\/strong> you’re ready to scale. Shift focus\nto ROI and redesign.<\/p><\/li>\n<\/ul>\n<p>The total matters less than the gap. A company scoring 5, 5, 5, 5 and\n1 is not “mostly ready”: the 1 will block everything.<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Ask five leaders from different functions to score the five\nfoundations on their own. Compare the answers. Where scores differ by\ntwo or more points, you’ve found a blind spot worth a conversation.<\/p>\n<p><strong>The rule:<\/strong> readiness is set by your weakest\nfoundation, not your strongest pilot. Fix the lowest score first.<\/p>", "excerpt": "Are We Ready? Score Five Foundations Before You Scale Every leadership team asks it: “Are we ready for AI?” Most answer by counting licences, or by pointing at "}, {"part": 1, "title": "Who Owns AI at the Top", "kind": "Article", "imgs": ["imgs/a04_0.jpg"], "html": "<p><strong>Who Owns AI at the Top?<\/strong><\/p>\n<p>Ask ten companies who’s responsible for AI and you’ll get ten\nanswers. The CIO, because it’s technology. The CDO, because it runs on\ndata. The CHRO, because it changes jobs. A new Chief AI Officer. Or the\nCEO, because it changes everything.<\/p>\n<p>Often the real answer is “all of them, so none of them.” AI gets\nsplit across functions, with each owning a piece and nobody owning the\nwhole. Projects stall, risks fall between the gaps, and the board can’t\nget a straight answer about what’s happening.<\/p>\n<p>AI needs one clear owner at the top, supported by the right people\naround them.<\/p>\n<p><strong>The usual candidates<\/strong><\/p>\n<p><strong>CIO / CTO (technology)<\/strong><\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> understands systems, security,\nvendors and infrastructure<\/p><\/li>\n<li><p><strong>Risk:<\/strong> AI becomes an IT project focused on tools\nand platforms, not business outcomes<\/p><\/li>\n<\/ul>\n<p><strong>Chief Data / Analytics Officer<\/strong><\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> owns the data AI depends on and\nunderstands models and analytics<\/p><\/li>\n<li><p><strong>Risk:<\/strong> strong on technique, often lacks the\nauthority to redesign business processes<\/p><\/li>\n<\/ul>\n<p><strong>Chief AI Officer (CAIO)<\/strong><\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> dedicated focus, a single point of\naccountability, a clear signal that AI matters<\/p><\/li>\n<li><p><strong>Risk:<\/strong> becomes an isolated function, “the AI\nperson,” while the business carries on unchanged<\/p><\/li>\n<\/ul>\n<p><strong>CHRO<\/strong><\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> owns skills, roles, culture and\nchange, which is where adoption actually happens<\/p><\/li>\n<li><p><strong>Risk:<\/strong> rarely has budget or technical authority\nover AI tools<\/p><\/li>\n<\/ul>\n<p><strong>Business unit heads<\/strong><\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> closest to real use cases and\nvalue<\/p><\/li>\n<li><p><strong>Risk:<\/strong> fragmented efforts, duplicated tools and\ninconsistent rules across units<\/p><\/li>\n<\/ul>\n<p><strong>The CEO<\/strong><\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> the only role with authority across\nevery function<\/p><\/li>\n<li><p><strong>Risk:<\/strong> too stretched to drive it day to\nday<\/p><\/li>\n<\/ul>\n<p><strong>The answer: the CEO owns it, and someone runs\nit<\/strong><br />\nAI isn’t a technology decision. It changes how work gets done, how\npeople are organised and how the company competes. That makes it a\nCEO-level agenda.<\/p>\n<p>But the CEO can’t run it alone. The model that works:<\/p>\n<ul>\n<li><p><strong>CEO: owns the AI agenda.<\/strong> Sets the ambition, ties\nAI to strategy, and is accountable to the board.<\/p><\/li>\n<li><p><strong>One named executive runs it.<\/strong> A CAIO, CDO, CIO or\nCOO, whoever fits your company. This person drives the programme day to\nday and has the authority to cross functional lines.<\/p><\/li>\n<li><p><strong>An AI Steering Council supports it.<\/strong> Technology,\ndata, HR, legal, risk, finance and business heads decide together on\npriorities, rules and resources.<\/p><\/li>\n<li><p><strong>The board oversees it.<\/strong> It sets risk appetite and\nasks for regular reports on value, risk and incidents.<\/p><\/li>\n<\/ul>\n<p><strong>What the AI owner must have<\/strong><br />\nWhatever the title, the person running AI needs:<\/p>\n<ol type=\"1\">\n<li><p><strong>A direct line to the CEO,<\/strong> not buried three\nlevels down<\/p><\/li>\n<li><p><strong>Authority across functions<\/strong> to change processes,\nnot just deploy tools<\/p><\/li>\n<li><p><strong>Budget,<\/strong> or at least a strong say in AI\nspending<\/p><\/li>\n<li><p><strong>Accountability for both value and risk,<\/strong> not one\nwithout the other<\/p><\/li>\n<li><p><strong>A seat at the table<\/strong> where strategy is\nset<\/p><\/li>\n<\/ol>\n<p>Without these, the title is decoration.<\/p>\n<p><strong>Warning signs<\/strong><\/p>\n<ul>\n<li><p>Every function has its own AI plan and nobody has merged\nthem<\/p><\/li>\n<li><p>AI updates reach the board only through the CIO’s tech\nreport<\/p><\/li>\n<li><p>Nobody can answer “what’s our AI value this year?”<\/p><\/li>\n<li><p>Risk and innovation are owned by people who rarely talk<\/p><\/li>\n<li><p>The “AI owner” has to ask permission from every department to\nchange anything<\/p><\/li>\n<\/ul>\n<p><strong>For smaller firms<\/strong><br />\nYou don’t need a new C-suite title. The founder or CEO owns AI directly,\nwith one trusted person (often ops, finance or a senior consultant)\ndriving it and a monthly leadership check-in. Clear ownership matters\nmore than a big structure.<\/p>\n<p><strong>Try this<\/strong><br />\nAsk your leadership team one question: “Who owns AI here?” If you get\nmore than one name, or a long pause, you’ve found the problem. Agree on\none owner, give them authority, and tell the organisation.<\/p>\n<p><strong>The rule:<\/strong> AI belongs on the CEO’s agenda, run by one\nempowered executive, with the board watching. Shared ownership becomes\nno ownership.<\/p>", "excerpt": "Who Owns AI at the Top? Ask ten companies who’s responsible for AI and you’ll get ten answers. The CIO, because it’s technology. The CDO, because it runs on dat"}, {"part": 1, "title": "HMC Use-Case Triage™", "kind": "Framework", "imgs": ["imgs/a05_0.jpg"], "html": "<p><strong>Which Use Cases First? Sort Every Idea into Now, Next or\nNever<\/strong><\/p>\n<p>Run one workshop and you’ll have 60 AI ideas by lunch. Every function\nhas a list. The marketing team wants a content engine, finance wants\nautomated reconciliation and HR wants a policy bot.<\/p>\n<p>Trying all of them spreads budget, attention and patience thin.\nPicking the loudest one is how companies end up with a clever demo\nnobody uses.<\/p>\n<p>The HMC Use-Case Triage™ scores every idea on three questions and\nsorts it into Now, Next or Never.<\/p>\n<p><strong>The three scores<\/strong><\/p>\n<p><strong>1. Value: how much does it matter?<\/strong><\/p>\n<p>Hours saved, errors avoided, revenue protected or a decision made\nfaster. Score 1 (nice to have) to 5 (a business head would fight for\nit).<\/p>\n<p><strong>2. Feasibility: how easy is it to do well?<\/strong><\/p>\n<p>Is the data available and clean? Does a tool already do this? Is\nthere a team willing to try it? Score 1 (needs new systems and data) to\n5 (can start next week with what we have).<\/p>\n<p><strong>3. Risk: what happens if it goes wrong?<\/strong><\/p>\n<p>Who sees the output, and how hard is a mistake to undo? Score 1\n(internal draft, easy to fix) to 5 (customer, money, legal or people\ndecisions).<\/p>\n<p><strong>The sort<\/strong><\/p>\n<ul>\n<li><p><strong>Now:<\/strong> value 4 or more, feasibility 4 or more,\nrisk 3 or less. Start this quarter.<\/p><\/li>\n<li><p><strong>Next:<\/strong> high value but lower feasibility or higher\nrisk. Fix the data, set the guardrails, then start.<\/p><\/li>\n<li><p><strong>Never (for now):<\/strong> low value, whatever the\nfeasibility. A cool demo that saves nobody time is still a\ncost.<\/p><\/li>\n<\/ul>\n<p>High-risk ideas aren’t banned. They move to Next until the controls\nare in place: a human approver, tested on real data, a named owner.<\/p>\n<p><strong>Common traps<\/strong><\/p>\n<ul>\n<li><p><strong>Picking by excitement:<\/strong> the most impressive demo\nis rarely the best first use case<\/p><\/li>\n<li><p><strong>Picking by seniority:<\/strong> the CEO’s idea skips the\nqueue and fails publicly<\/p><\/li>\n<li><p><strong>Ignoring feasibility:<\/strong> a high-value idea with\nmessy data becomes a six-month data project<\/p><\/li>\n<li><p><strong>Too many “Now”s:<\/strong> more than three or four at once\nand none get proper attention<\/p><\/li>\n<\/ul>\n<p><strong>What a good “Now” list looks like<\/strong><\/p>\n<p>Three to five use cases, spread across functions, each with an owner,\na baseline and a 90-day target. At least one should be boring and\ncertain: the quick win that builds confidence for the harder ones.<\/p>\n<p>“Here are our 40 AI ideas: [paste list]. Score each one from 1 to 5\non value, feasibility and risk. Sort them into Now, Next and Never, and\nexplain the top five in one line each.”<\/p>\n<p>Use the AI to draft the first scores, then argue about them as a\nleadership team. The debate is where the real prioritisation\nhappens.<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Take your current list of AI ideas and score the top ten in a\n30-minute meeting. If more than four land in Now, raise the bar. If none\ndo, your ideas are too ambitious or your data isn’t ready.<\/p>\n<p><strong>The rule:<\/strong> value decides what’s worth doing,\nfeasibility decides what’s possible now, and risk decides how carefully.\nSort before you start.<\/p>", "excerpt": "Which Use Cases First? Sort Every Idea into Now, Next or Never Run one workshop and you’ll have 60 AI ideas by lunch. Every function has a list. The marketing t"}, {"part": 1, "title": "HMC Build-Buy-Configure Decision Tree™", "kind": "Framework", "imgs": ["imgs/a06_0.jpg"], "html": "<p><strong>Build, Buy or Configure? Four Questions Before You\nSpend<\/strong><\/p>\n<p>A vendor pitches a specialised AI tool for your industry. Your IT\nteam says they can build something better in-house. Someone in finance\nhas already built a working prototype in an afternoon with Claude.<\/p>\n<p>All three can be right. The mistake is deciding by habit: IT always\nbuilds, procurement always buys. The right answer depends on the use\ncase.<\/p>\n<p><strong>The three options<\/strong><\/p>\n<p><strong>Configure<\/strong> an enterprise AI tool you already have\n(Claude, ChatGPT Enterprise, Copilot, Gemini) with projects, skills,\nconnectors and instructions.<\/p>\n<ul>\n<li><p><strong>Best when:<\/strong> the task is common, like drafting,\nsummarising, analysis or research<\/p><\/li>\n<li><p><strong>Cost:<\/strong> low, because you already pay for\nit<\/p><\/li>\n<li><p><strong>Watch:<\/strong> adoption depends on training, not\ntechnology<\/p><\/li>\n<\/ul>\n<p><strong>Buy<\/strong> a specialised tool built for one job: contract\nreview, call-centre analytics, recruitment screening.<\/p>\n<ul>\n<li><p><strong>Best when:<\/strong> the problem is standard in your\nindustry and a vendor has solved it at scale<\/p><\/li>\n<li><p><strong>Cost:<\/strong> medium to high, plus integration<\/p><\/li>\n<li><p><strong>Watch:<\/strong> lock-in, data terms and tools that\noverlap with what you already own<\/p><\/li>\n<\/ul>\n<p><strong>Build<\/strong> your own: an internal app, an agent or an\nintegration with your systems.<\/p>\n<ul>\n<li><p><strong>Best when:<\/strong> the workflow is unique to you and\ngives you an edge<\/p><\/li>\n<li><p><strong>Cost:<\/strong> highest, including maintenance nobody\nbudgets for<\/p><\/li>\n<li><p><strong>Watch:<\/strong> the “prototype that became production”\nproblem: no owner, no tests, no support<\/p><\/li>\n<\/ul>\n<p><strong>The decision tree: four questions<\/strong><\/p>\n<p><strong>1. Can an approved tool we already own do 80% of it with good\ninstructions?<\/strong><\/p>\n<p>Yes: <strong>configure.<\/strong> Most use cases stop here.<\/p>\n<p><strong>2. Is this a standard problem many companies in our industry\nshare?<\/strong><\/p>\n<p>Yes: <strong>buy<\/strong>, after checking that the vendor’s data\nterms and integrations meet your standards.<\/p>\n<p><strong>3. Is the workflow unique to us, and does doing it better\ngive us an advantage?<\/strong><\/p>\n<p>Yes: <strong>build<\/strong>, with a named owner and a budget for\nrunning it.<\/p>\n<p><strong>4. None of the above?<\/strong><\/p>\n<p>Configure first and learn. Revisit in 90 days with real usage\ndata.<\/p>\n<p><strong>Questions that cut through the pitch<\/strong><\/p>\n<ul>\n<li><p>What will this do that our existing tools can’t, with a good\nprompt or skill?<\/p><\/li>\n<li><p>Who maintains it after the vendor or builder moves on?<\/p><\/li>\n<li><p>Where does our data go, and is it used for training?<\/p><\/li>\n<li><p>What does it cost per user, per month, at full scale?<\/p><\/li>\n<li><p>How hard is it to leave?<\/p><\/li>\n<\/ul>\n<p><strong>Try this<\/strong><\/p>\n<p>Take your three most expensive AI proposals on the table right now.\nRun each through the four questions. If any can be configured on a tool\nyou already own, test that first for two weeks before signing.<\/p>\n<p><strong>The rule:<\/strong> configure before you buy, and buy before\nyou build. Build only what makes you different.<\/p>", "excerpt": "Build, Buy or Configure? Four Questions Before You Spend A vendor pitches a specialised AI tool for your industry. Your IT team says they can build something be"}, {"part": 1, "title": "Choosing an AI Vendor", "kind": "Article", "imgs": ["imgs/a07_0.jpg"], "html": "<p><strong>Choosing an AI Vendor: Ten Questions Before You\nSign<\/strong><\/p>\n<p>Every AI vendor demo looks good. The model answers fluently, the\ndashboard is clean and the case studies come from companies you’ve heard\nof.<\/p>\n<p>The demo is the least useful part of the decision. What matters is\nwhat happens to your data, what it really costs at scale, how it fits\nyour systems and how hard it is to leave. None of that shows up on\nscreen.<\/p>\n<p>Ask these ten questions before you sign.<\/p>\n<p><strong>Data and security<\/strong><\/p>\n<p><strong>1. Is our data used to train your models?<\/strong><\/p>\n<p>The answer should be a clear “no” in the contract, not just on the\nwebsite.<\/p>\n<p><strong>2. Where is our data stored and processed, and for how\nlong?<\/strong><\/p>\n<p>Location matters for India’s DPDP Act, GDPR and Gulf data laws. Ask\nabout retention and deletion.<\/p>\n<p><strong>3. Which certifications do you hold?<\/strong><\/p>\n<p>SOC 2 Type II and ISO 27001 are the usual baseline. ISO 42001 shows a\nmanaged AI system.<\/p>\n<p><strong>Cost<\/strong><\/p>\n<p><strong>4. What will this cost per user, per month, at full\nscale?<\/strong><\/p>\n<p>Pilots are priced to win. Ask for the price at 10x the pilot,\nincluding usage-based charges.<\/p>\n<p><strong>5. What’s not in the licence?<\/strong><\/p>\n<p>Integration, training, premium support, extra storage and API usage\nare often billed separately.<\/p>\n<p><strong>Fit<\/strong><\/p>\n<p><strong>6. What does this do that our existing tools\ncan’t?<\/strong><\/p>\n<p>If an enterprise AI tool you already pay for can do 80% of it, the\nvendor needs a strong answer.<\/p>\n<p><strong>7. Which of our systems does it connect to, and who builds\nthat?<\/strong><\/p>\n<p>Check for standard connectors (including MCP) rather than custom\nintegrations you’ll maintain forever.<\/p>\n<p><strong>Control and exit<\/strong><\/p>\n<p><strong>8. Which model sits underneath, and what happens when it\nchanges?<\/strong><\/p>\n<p>Model updates can change output quality overnight. Ask how you’re\ntold and whether you can test first.<\/p>\n<p><strong>9. Can we see logs of who used it, for what?<\/strong><\/p>\n<p>Without usage logs and admin controls, you can’t govern it or measure\nit.<\/p>\n<p><strong>10. How do we leave, and what do we take with\nus?<\/strong><\/p>\n<p>Your prompts, data, configurations and outputs should be exportable\nin usable formats.<\/p>\n<p><strong>Red flags<\/strong><\/p>\n<ul>\n<li><p>“Our AI is proprietary, so we can’t say which model it\nuses”<\/p><\/li>\n<li><p>Data terms that differ between the website and the\ncontract<\/p><\/li>\n<li><p>No reference customer in your industry or region<\/p><\/li>\n<li><p>Pricing that only works if adoption stays low<\/p><\/li>\n<\/ul>\n<p><strong>How to run the evaluation<\/strong><\/p>\n<p>Shortlist two or three vendors. Give each the same real task with\ndummy data. Score the outputs blind. Have IT, legal and the business\nowner score the ten answers separately, then compare.<\/p>\n<p>“Here is the vendor’s security document and contract: [paste]. Check\nthem against these ten questions. List any answer that is missing, vague\nor contradicts the other document.”<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Take the AI tool your company most recently bought. Answer the ten\nquestions from the contract, not from memory. Every blank is a risk\nyou’re carrying today.<\/p>\n<p><strong>The rule:<\/strong> buy the contract, not the demo. Data,\ncost, fit and exit decide whether a vendor is right.<\/p>", "excerpt": "Choosing an AI Vendor: Ten Questions Before You Sign Every AI vendor demo looks good. The model answers fluently, the dashboard is clean and the case studies co"}, {"part": 1, "title": "How Leaders Should Use AI Themselves", "kind": "Article", "imgs": ["imgs/a08_0.jpg"], "html": "<p><strong>How Leaders Should Use AI Themselves: Go First,\nVisibly<\/strong><\/p>\n<p>Most leaders sponsor AI. Fewer use it. They approve the budget, open\nthe town hall and ask for the adoption numbers, then go back to working\nexactly as before.<\/p>\n<p>Teams notice. If the person asking for AI adoption has never drafted\nanything with it, the message is clear: this is for other people.<\/p>\n<p>Leaders who use AI themselves make better decisions about it, and\nthey move adoption faster than any memo.<\/p>\n<p><strong>Why it matters<\/strong><\/p>\n<p><strong>1. You can’t judge what you haven’t tried<\/strong><\/p>\n<p>A leader who has used AI knows what it does well, where it fails and\nhow much checking it needs. That makes budget and risk decisions\nsharper.<\/p>\n<p><strong>2. Teams copy what they see<\/strong><\/p>\n<p>When a leader shares a prompt in a meeting, it gives everyone\npermission to use AI openly.<\/p>\n<p><strong>3. It shows you the real friction<\/strong><\/p>\n<p>Slow logins, blocked tools, unclear rules: you only see them when you\nhit them yourself.<\/p>\n<p><strong>Six ways to use it this week<\/strong><\/p>\n<p><strong>1. Pre-read in five minutes<\/strong><\/p>\n<p>“Summarise this 30-page board pack. What are the three decisions it\nasks for, and what’s missing that I should ask about?”<\/p>\n<p><strong>2. Prepare for a difficult conversation<\/strong><\/p>\n<p>“I need to tell a high performer they didn’t get the promotion. Play\ntheir role and push back so I can practise.”<\/p>\n<p><strong>3. Stress-test a decision<\/strong><\/p>\n<p>“Here’s my plan to restructure the sales team. Argue against it as\nthe CFO, then as the regional head.”<\/p>\n<p><strong>4. Draft, don’t write<\/strong><\/p>\n<p>Dictate rough thoughts for a strategy note or an all-hands message\nand let AI shape the first draft. You edit for judgement and tone.<\/p>\n<p><strong>5. Prepare for meetings<\/strong><\/p>\n<p>“I’m meeting the MD of [client]. Summarise their last two annual\nreports and their stated priorities. Suggest five questions.”<\/p>\n<p><strong>6. Learn something fast<\/strong><\/p>\n<p>“Explain carbon border taxes as they affect an Indian steel exporter,\nin one page, with three questions I should ask my team.”<\/p>\n<p><strong>Habits that build trust<\/strong><\/p>\n<ul>\n<li><p><strong>Share your prompts:<\/strong> in leadership meetings, show\nwhat you asked and what came back<\/p><\/li>\n<li><p><strong>Admit the misses:<\/strong> “It got this wrong, and here’s\nhow I caught it” teaches more than a success story<\/p><\/li>\n<li><p><strong>Keep judgement visible:<\/strong> say what you changed and\nwhy<\/p><\/li>\n<li><p><strong>Follow your own rules:<\/strong> use approved tools and\nkeep sensitive data out, exactly as you ask your teams to<\/p><\/li>\n<\/ul>\n<p><strong>What not to delegate to AI<\/strong><\/p>\n<p>Decisions about people, final numbers going to the board, anything\nyou’ll sign, and messages where your own voice matters more than\npolish.<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>For one week, use AI for one real task every day: a pre-read, a\ndraft, a stress-test. At the next leadership meeting, share one thing it\ndid well and one thing it got wrong.<\/p>\n<p><strong>The rule:<\/strong> adoption follows example. Use it yourself,\nopenly, before you ask anyone else to.<\/p>", "excerpt": "How Leaders Should Use AI Themselves: Go First, Visibly Most leaders sponsor AI. Fewer use it. They approve the budget, open the town hall and ask for the adopt"}, {"part": 2, "title": "HMC Role-Task-Tool Matrix™", "kind": "Framework", "imgs": ["imgs/a09_0.jpg"], "html": "<p><strong>Role-Task-Tool: Map the Fit Before You Issue the\nLicence<\/strong><\/p>\n<p>“Everyone gets Claude.” It sounds generous. Three weeks later, most\nlicences sit unused.<\/p>\n<p>A finance analyst, a plant supervisor and a sales rep don’t do the\nsame work. Give all three the same tool and the same training, and it\nfeels relevant to none of them. Adoption isn’t about access. It’s about\nfit: a tool matched to a task the person owns, this week, with a payoff\nthey can see.<\/p>\n<p>The HMC Role-Task-Tool Matrix™ makes that match before a single\nlicence is issued.<\/p>\n<p><strong>The three layers<\/strong><\/p>\n<p><strong>1. Role: who is this person, and what are they accountable\nfor?<\/strong><\/p>\n<p>List roles by what they do, not by title. A regional sales lead and a\nkey account lead may share a title band but need different tasks.<\/p>\n<ul>\n<li><p><strong>If you skip it:<\/strong> training is generic, and nobody\nfeels it was “for me”<\/p><\/li>\n<\/ul>\n<p><strong>2. Task: which recurring task in that role is slow,\nrepetitive or error-prone?<\/strong><\/p>\n<p>Pick the three to five tasks that eat the most hours or carry the\nmost risk. Interview people; don’t assume. The task leaders think is\npainful is often not the one staff struggle with.<\/p>\n<ul>\n<li><p><strong>If you skip it:<\/strong> AI gets used for novelty demos,\nnot real work<\/p><\/li>\n<\/ul>\n<p><strong>3. Tool: which AI capability fits that task, in which\nworkflow?<\/strong><\/p>\n<p>Be specific. Not “use Claude,” but “use Claude to draft the weekly\nvariance commentary from the finance dashboard export.”<\/p>\n<ul>\n<li><p><strong>If you skip it:<\/strong> the wrong tool for the job, and\none bad experience ends further use<\/p><\/li>\n<\/ul>\n<p><strong>Why it comes before training<\/strong><\/p>\n<ul>\n<li><p><strong>No shelf-ware:<\/strong> a licence with no mapped task\ngoes unused by week three<\/p><\/li>\n<li><p><strong>ROI you can attribute:<\/strong> when the task is named,\ntime saved on it is measurable<\/p><\/li>\n<li><p><strong>Smarter training spend:<\/strong> the matrix shows where\nthree hours of training changes behaviour and where 30 minutes is\nenough<\/p><\/li>\n<li><p><strong>It feeds ADOPT-9™:<\/strong> once tool meets task, the\npersona grid shows how much coaching each person needs<\/p><\/li>\n<\/ul>\n<p><strong>How to build it<\/strong><\/p>\n<p><strong>Step 1: Role inventory.<\/strong> List roles by function and\noutcome.<\/p>\n<p><strong>Step 2: Task audit.<\/strong> For each role, find the three to\nfive heaviest tasks by talking to the people who do them.<\/p>\n<p><strong>Step 3: Tool assignment.<\/strong> Match each task to a\ncapability and a written workflow, with a sample prompt.<\/p>\n<p><strong>Step 4: Pilot and confirm.<\/strong> Test each match with a\nsmall group. If it doesn’t save time in week one, the mapping is wrong.\nFix the mapping; don’t push harder on adoption messages.<\/p>\n<p>“For a [role] in a [industry] company, list the five tasks that take\nthe most time each week. For each, suggest which AI capability fits and\nwrite one ready-to-use prompt.”<\/p>\n<p>Use the AI’s list as a starting point, then check it against\ninterviews with real people in the role.<\/p>\n<p><strong>Keep it alive<\/strong><\/p>\n<p>Roles change and AI improves. Revisit the matrix every quarter: some\ntasks will be fully handled, and new ones will open up.<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Pick one function. List its five most common roles and, for each, the\nsingle task that takes the most time. If you can’t name a specific AI\nworkflow for each, that role isn’t ready for a licence yet.<\/p>\n<p><strong>The rule:<\/strong> adoption follows fit, not access. Map\nrole, task and tool before you hand out a single licence.<\/p>", "excerpt": "Role-Task-Tool: Map the Fit Before You Issue the Licence “Everyone gets Claude.” It sounds generous. Three weeks later, most licences sit unused. A finance anal"}, {"part": 2, "title": "HMC ADOPT-9 AI Persona™", "kind": "Framework", "imgs": ["imgs/a10_0.jpg"], "html": "<p><strong>The Nine Types of AI Users<\/strong><\/p>\n<p>Not every employee relates to AI the same way — some avoid it, some\noveruse it blindly, and only a few use it well. The HMC ADOPT-9™ Persona\nGrid maps users across two axes: how much they engage with AI, and how\nmuch they trust its output.<\/p>\n<p>The riskiest quadrant isn't the loud Skeptic — it's the quiet Passive\nTruster, who rarely checks what they're told.<\/p>\n<p>The goal for leaders isn't universal adoption; it's moving people\ntoward the AI-Native Leader corner: high engagement, high — but verified\n— trust.<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><\/th>\n<th><strong>Low Trust in Output<\/strong><\/th>\n<th><strong>Mid Trust in Output<\/strong><\/th>\n<th><strong>High Trust in Output<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td><strong>High Engagement<\/strong><\/td>\n<td><p><strong>The Skeptic<\/strong><\/p>\n<p>Understands AI well enough to distrust it. Points out flaws faster\nthan use cases.<\/p><\/td>\n<td><p><strong>The Power User<\/strong><\/p>\n<p>Fluent across tools and use cases. Actively finds new applications\nfor the team.<\/p><\/td>\n<td><p><strong>The AI-Native Leader<\/strong><\/p>\n<p>Redesigns workflows around AI, verifies rigorously, coaches\nothers.<\/p><\/td>\n<\/tr><tr>\n<td><strong>Mid Engagement<\/strong><\/td>\n<td><p><strong>The Dabbler<\/strong><\/p>\n<p>Tried it once for a demo. Curious but hasn't built a habit or seen\nreal payoff.<\/p><\/td>\n<td><p><strong>The Utility User<\/strong><\/p>\n<p>Treats AI like a tool, not a partner. Reliable for specific,\nrepeatable tasks.<\/p><\/td>\n<td><p><strong>The Delegator<\/strong><\/p>\n<p>Hands off real work to AI and spot-checks outcomes. Balanced\nreliance.<\/p><\/td>\n<\/tr><tr>\n<td><strong>Low Engagement<\/strong><\/td>\n<td><p><strong>The Avoider<\/strong><\/p>\n<p>Hasn't opened an AI tool yet. Sees it as a fad or \"someone else's\njob.\"<\/p><\/td>\n<td><p><strong>The Cautious Adopter<\/strong><\/p>\n<p>Uses AI for safe, low-stakes tasks only. Slow to expand\nscope.<\/p><\/td>\n<td><p><strong>The Passive Truster<\/strong><\/p>\n<p>Rarely uses AI, but accepts output without checking. Risky\ncombination.<\/p><\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "The Nine Types of AI Users Not every employee relates to AI the same way — some avoid it, some overuse it blindly, and only a few use it well. The HMC ADOPT-9™ "}, {"part": 2, "title": "Organizational Adoption", "kind": "Article", "imgs": ["imgs/a11_0.jpg"], "html": "<p><strong>GenAI Adoption Is a Change Programme, Not a Technology\nRollout<\/strong><\/p>\n<p>The licences are live, the launch mail went out and the training was\nwell attended. Three months later, a few enthusiasts use AI daily and\neveryone else works exactly as before.<\/p>\n<p>That isn’t a technology failure. AI adoption is won on habits, and\nhabits change through people, not through a launch mail. The leader’s\nreal job is sequencing: prove value, build confidence, remove friction,\nthen expand.<\/p>\n<p><strong>The four stages<\/strong><\/p>\n<p><strong>1. Prove value in one place<\/strong><\/p>\n<p>Start with a focused pilot: one team, a willing manager, a clear use\ncase and a baseline. Pick a task where success is visible in weeks, not\nquarters.<\/p>\n<ul>\n<li><p><strong>Done when:<\/strong> the team can show time saved on a\nnamed task, in numbers<\/p><\/li>\n<\/ul>\n<p><strong>2. Build confidence<\/strong><\/p>\n<p>Share the pilot’s results through the people who achieved them, not\nthrough a leadership slide. Train by role, with people’s own tasks. Make\nthe policy clear so nobody is unsure what’s allowed.<\/p>\n<ul>\n<li><p><strong>Done when:<\/strong> people in other teams ask “when do we\nget this?”<\/p><\/li>\n<\/ul>\n<p><strong>3. Remove friction<\/strong><\/p>\n<p>Find what stops people using it day to day: slow access, blocked\ntools, unclear rules, no time to learn. Fixing these matters more than\nmore training.<\/p>\n<ul>\n<li><p><strong>Done when:<\/strong> the approved tool is the easiest way\nto get the job done<\/p><\/li>\n<\/ul>\n<p><strong>4. Expand, function by function<\/strong><\/p>\n<p>Roll out in waves, each with champions, mapped tasks and a 90-day\ncheck. Don’t move to the next function until the current one has changed\nat least one process.<\/p>\n<ul>\n<li><p><strong>Done when:<\/strong> the old way of working is switched\noff somewhere real<\/p><\/li>\n<\/ul>\n<p><strong>What drives it<\/strong><\/p>\n<ul>\n<li><p><strong>Sponsorship:<\/strong> a senior leader who uses AI visibly\nand asks about it in reviews<\/p><\/li>\n<li><p><strong>Workflow fit:<\/strong> the tool matched to tasks people\nown (Role-Task-Tool Matrix™)<\/p><\/li>\n<li><p><strong>Champions:<\/strong> respected peers who show, not\ntell<\/p><\/li>\n<li><p><strong>Fluency, not expertise:<\/strong> most people need\ncomfortable everyday use, not deep technical skill<\/p><\/li>\n<li><p><strong>Reskilling:<\/strong> a clear path for people whose roles\nshift<\/p><\/li>\n<\/ul>\n<p><strong>What kills it<\/strong><\/p>\n<ul>\n<li><p><strong>“Everyone must use AI” mandates<\/strong> before skills,\ntrust and fit exist<\/p><\/li>\n<li><p><strong>Vanity metrics:<\/strong> logins and training hours\ninstead of tasks changed<\/p><\/li>\n<li><p><strong>Silence on jobs:<\/strong> people fill it with the worst\ncase<\/p><\/li>\n<li><p><strong>Expecting instant, uniform uptake:<\/strong> adoption\nspreads in a curve, from early adopters to the late majority<\/p><\/li>\n<\/ul>\n<p>“We’re rolling out [tool] to [function]. Draft a four-stage adoption\nplan: pilot, confidence, friction, expansion. For each stage, give the\ngoal, two actions and how we’ll know it’s done.”<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Ask three managers what stops their team using AI more. Write down\nevery answer. If more than half are about access, rules or time, you\nhave a friction problem, not a training problem. Fix the top two this\nmonth.<\/p>\n<p><strong>The rule:<\/strong> adoption is won on habits, not licences.\nProve it, build confidence, clear the friction, then expand.<\/p>", "excerpt": "GenAI Adoption Is a Change Programme, Not a Technology Rollout The licences are live, the launch mail went out and the training was well attended. Three months "}, {"part": 2, "title": "Trust Deficit Between Leaders and Staff", "kind": "Article", "imgs": ["imgs/a12_0.jpg"], "html": "<p>In the boardroom, AI is an opportunity: productivity, growth,\ncompetitive edge. On the shop floor and in the back office, it often\nfeels like a threat: “Is this coming for my job?” “Are they tracking my\nwork?” “Will I be blamed if the AI gets it wrong?”<\/p>\n<p>Same technology, two very different stories. The gap between them is\nthe trust deficit, and it quietly undermines more AI programmes than any\ntechnical failure.<\/p>\n<p><strong>What the deficit looks like<\/strong><\/p>\n<p><strong>Leaders tend to believe:<\/strong><\/p>\n<ul>\n<li><p>“Our people are excited about AI.”<\/p><\/li>\n<li><p>“We’ve explained why we’re doing this.”<\/p><\/li>\n<li><p>“AI will free people for higher-value work.”<\/p><\/li>\n<li><p>“Adoption is slow because people need more training.”<\/p><\/li>\n<\/ul>\n<p><strong>Staff tend to believe:<\/strong><\/p>\n<ul>\n<li><p>“Nobody has told me what this means for my role.”<\/p><\/li>\n<li><p>“‘Higher-value work’ is code for fewer people.”<\/p><\/li>\n<li><p>“If I show AI makes me faster, my targets go up or my team\nshrinks.”<\/p><\/li>\n<li><p>“If I admit I use AI, people will think my work isn’t\nmine.”<\/p><\/li>\n<\/ul>\n<p>Both sides are acting rationally on what they see. The problem is\nthey’re seeing different things.<\/p>\n<p><strong>Why it happens<\/strong><\/p>\n<p><strong>1. Silence about jobs<\/strong><br />\nLeaders avoid the job question because they don’t have a full answer\nyet. Staff fill the silence with the worst case.<\/p>\n<p><strong>2. Gains flow upward<\/strong><br />\nWhen AI saves time, staff see higher targets, not a shorter day or more\ninteresting work. The benefit feels one-sided.<\/p>\n<p><strong>3. AI done to people, not with them<\/strong><br />\nTools get chosen, configured and rolled out without asking the people\nwho’ll use them. That reads as “this is being imposed on you.”<\/p>\n<p><strong>4. Surveillance fears<\/strong><br />\nAI tools that log usage, score productivity or analyse communication\nlook like monitoring, even when they aren’t meant that way.<\/p>\n<p><strong>5. Unclear blame<\/strong><br />\nIf the AI makes a mistake, who’s accountable? When staff fear they’ll\ncarry the blame for a tool they didn’t choose, they avoid using it.<\/p>\n<p><strong>6. Hidden use<\/strong><br />\nMany employees use AI quietly, sometimes on unapproved tools, because\nthey’re unsure if it’s allowed. Leaders don’t see real usage, and staff\ndon’t get guidance or protection.<\/p>\n<p><strong>How to close the gap<\/strong><\/p>\n<p><strong>Be honest about jobs<\/strong><br />\nSay what you know and what you don’t. “Some tasks will change. Here’s\nwhat we’re committing to: reskilling before restructuring, and no one\nwill learn about changes to their role through a tool rollout.” Honesty,\neven when incomplete, builds more trust than silence.<\/p>\n<p><strong>Share the gains<\/strong><br />\nDecide visibly where saved time goes: development, better work,\nflexibility, recognition. If every hour saved becomes a higher target,\npeople will stop saving hours.<\/p>\n<p><strong>Build with people, not for them<\/strong><br />\nInvolve staff in choosing use cases, testing tools and setting rules.\nThe best AI ideas come from the people who do the work every day.<\/p>\n<p><strong>Make the rules clear and safe<\/strong><br />\nPublish a simple AI policy: what’s allowed, which tools are approved,\nwhat data stays out. Make it safe to say “I used AI for this.” Clear\npermission brings hidden use into the open.<\/p>\n<p><strong>Be clear on accountability<\/strong><br />\nState it plainly: the person approving the output owns it, and the\norganisation owns the decision to use the tool. Staff shouldn’t carry\nthe risk of a system they didn’t design.<\/p>\n<p><strong>Separate AI from surveillance<\/strong><br />\nIf a tool tracks usage, say so and explain why. Don’t use AI adoption\ndata to rank or judge individuals.<\/p>\n<p><strong>Leaders go first<\/strong><br />\nLeaders who use AI openly, share their own prompts, admit their mistakes\nand show what they’ve learned do more for trust than any memo.<\/p>\n<p><strong>Signs the deficit is closing<\/strong><\/p>\n<ul>\n<li><p>Staff bring AI ideas to leaders, not just the other way\nround<\/p><\/li>\n<li><p>People openly share how they use AI<\/p><\/li>\n<li><p>Usage of approved tools rises while shadow use falls<\/p><\/li>\n<li><p>Questions about jobs are asked in meetings, not just in\ncorridors<\/p><\/li>\n<li><p>Early adopters are recognised, not overloaded<\/p><\/li>\n<\/ul>\n<p><strong>Try this<\/strong><br />\nAsk your team two anonymous questions: “How do you feel about AI in your\nrole?” and “What would make you more comfortable using it?” Then ask\nyour leadership team to predict the answers. The gap between the\npredictions and the real answers is your trust deficit.<\/p>\n<p><strong>The rule:<\/strong> AI adoption moves at the speed of trust.\nBe honest, share the gains and build with people, not around them.<\/p>", "excerpt": "In the boardroom, AI is an opportunity: productivity, growth, competitive edge. On the shop floor and in the back office, it often feels like a threat: “Is this"}, {"part": 2, "title": "Building an AI Champions Network", "kind": "Article", "imgs": ["imgs/a13_0.jpg"], "html": "<p><strong>Building an AI Champions Network: Adoption Spreads Peer to\nPeer<\/strong><\/p>\n<p>Training sessions reach everyone once. Champions reach people every\nday.<\/p>\n<p>Most employees don’t learn AI from a workshop. They learn it when the\nperson at the next desk shows them how they cut a two-hour report to\ntwenty minutes. A champions network turns that by chance into something\nyou plan.<\/p>\n<p><strong>What a champion is, and isn’t<\/strong><\/p>\n<p>A champion is a respected practitioner in a team, not an IT person\nand not the most junior volunteer. They use AI well in their own work,\nand colleagues already go to them for help.<\/p>\n<ul>\n<li><p><strong>They are:<\/strong> the go-to person for “how do I do this\nwith AI?” in their function<\/p><\/li>\n<li><p><strong>They aren’t:<\/strong> a help desk, a trainer for the\nwhole company or an unpaid extra job<\/p><\/li>\n<\/ul>\n<p><strong>How to build the network<\/strong><\/p>\n<p><strong>1. Pick one champion per 25 to 50 people<\/strong><\/p>\n<p>Spread them across functions and locations. Plants, branches and\nregional offices need champions as much as head office does.<\/p>\n<p><strong>2. Choose for credibility, not enthusiasm alone<\/strong><\/p>\n<p>The best champion is someone whose work others respect. A sceptic who\nhas been converted is often the most persuasive.<\/p>\n<p><strong>3. Give them time, formally<\/strong><\/p>\n<p>Two to four hours a week, agreed with their manager and written into\ntheir goals. Without it, champions quit by month three.<\/p>\n<p><strong>4. Train them deeper and earlier<\/strong><\/p>\n<p>Champions get advanced training, early access to new tools and a\ndirect line to the AI programme team.<\/p>\n<p><strong>5. Give them a clear job<\/strong><\/p>\n<ul>\n<li><p>Run a short monthly “show and tell” in their team<\/p><\/li>\n<li><p>Collect and share prompts and skills that work<\/p><\/li>\n<li><p>Spot friction (blocked tools, unclear rules) and report it\nupward<\/p><\/li>\n<li><p>Help colleagues one to one on real tasks<\/p><\/li>\n<\/ul>\n<p><strong>6. Connect them to each other<\/strong><\/p>\n<p>A monthly champions call and a shared channel. The best ideas move\nacross functions this way.<\/p>\n<p><strong>Recognise them<\/strong><\/p>\n<p>Champions should be visible. Mention their wins in leadership\nupdates, give them a role in the AI steering agenda and count the work\nin performance reviews. If the network feels like unpaid labour, it\ndies.<\/p>\n<p><strong>Measure the network<\/strong><\/p>\n<ul>\n<li><p>Usage in teams with an active champion vs teams without<\/p><\/li>\n<li><p>Number of prompts or skills shared across the company<\/p><\/li>\n<li><p>Friction issues raised and fixed<\/p><\/li>\n<li><p>Champion retention after six months<\/p><\/li>\n<\/ul>\n<p><strong>Common mistakes<\/strong><\/p>\n<ul>\n<li><p><strong>Volunteers only:<\/strong> you get enthusiasts, not\ninfluencers<\/p><\/li>\n<li><p><strong>No time allowance:<\/strong> champions burn out within a\nquarter<\/p><\/li>\n<li><p><strong>Head office only:<\/strong> the field never\nadopts<\/p><\/li>\n<li><p><strong>No feedback loop:<\/strong> champions raise issues and\nnothing changes<\/p><\/li>\n<\/ul>\n<p><strong>Try this<\/strong><\/p>\n<p>Ask each department head for one name: “Who do people already ask\nwhen they’re stuck with a tool?” That list is your first champions\nnetwork. Meet them this month.<\/p>\n<p><strong>The rule:<\/strong> people learn AI from people they trust.\nFind those people, give them time and make their work visible.<\/p>", "excerpt": "Building an AI Champions Network: Adoption Spreads Peer to Peer Training sessions reach everyone once. Champions reach people every day. Most employees don’t le"}, {"part": 2, "title": "Upskilling Programme Design", "kind": "Article", "imgs": ["imgs/a14_0.jpg"], "html": "<p><strong>Upskilling Programme Design: Who Learns What, and\nWhen<\/strong><\/p>\n<p>Most AI training is one session for everyone. The CFO, the plant\nsupervisor and the sales trainee sit through the same two hours on\nprompting, then go back to work and change nothing.<\/p>\n<p>People don’t need the same training. They need training for their\nrole, their tasks and their level. Design the programme in four\ntiers.<\/p>\n<p><strong>Tier 1: Everyone (AI fluency)<\/strong><\/p>\n<p><strong>Who:<\/strong> all employees<\/p>\n<p><strong>Goal:<\/strong> safe, confident everyday use<\/p>\n<ul>\n<li><p>What AI does well and where it fails<\/p><\/li>\n<li><p>The company’s AI policy: approved tools, what data stays\nout<\/p><\/li>\n<li><p>Prompting basics, using C.R.A.F.T.S.™<\/p><\/li>\n<li><p>Three tasks from their own job, done live in the session<\/p><\/li>\n<\/ul>\n<p><strong>Format:<\/strong> a 90-minute session plus short follow-up\ntips over four weeks<\/p>\n<p><strong>Tier 2: Power users (function depth)<\/strong><\/p>\n<p><strong>Who:<\/strong> analysts, managers and anyone whose role is\nheavy on documents or data<\/p>\n<p><strong>Goal:<\/strong> using AI on real workflows in their\nfunction<\/p>\n<ul>\n<li><p>Function-specific use cases: finance reconciliations, HR policy\nqueries, marketing content<\/p><\/li>\n<li><p>Working with Excel, PDFs and data safely<\/p><\/li>\n<li><p>Building reusable prompts and skills<\/p><\/li>\n<\/ul>\n<p><strong>Format:<\/strong> half-day workshops by function, using the\nteam’s own (masked) files<\/p>\n<p><strong>Tier 3: Builders (champions and makers)<\/strong><\/p>\n<p><strong>Who:<\/strong> champions and people building tools for\nothers<\/p>\n<p><strong>Goal:<\/strong> creating apps, dashboards and automations\nresponsibly<\/p>\n<ul>\n<li><p>Vibe coding HTML tools, Python basics and connectors<\/p><\/li>\n<li><p>Testing, guardrails and the six Responsible AI\nprinciples<\/p><\/li>\n<li><p>Sharing and maintaining what they build<\/p><\/li>\n<\/ul>\n<p><strong>Format:<\/strong> a multi-week cohort with a real project to\nfinish<\/p>\n<p><strong>Tier 4: Leaders (strategy and governance)<\/strong><\/p>\n<p><strong>Who:<\/strong> senior leadership and the board<\/p>\n<p><strong>Goal:<\/strong> directing AI, not just approving it<\/p>\n<ul>\n<li><p>Use-case triage, ROI and readiness<\/p><\/li>\n<li><p>Risk, governance and their own accountability<\/p><\/li>\n<li><p>Using AI themselves, visibly<\/p><\/li>\n<\/ul>\n<p><strong>Format:<\/strong> a leadership session plus one-to-one\ncoaching<\/p>\n<p><strong>Design principles<\/strong><\/p>\n<ul>\n<li><p><strong>Use their tasks, not generic demos:<\/strong> people adopt\nwhat they’ve already done once<\/p><\/li>\n<li><p><strong>Role before tool:<\/strong> map roles and tasks first (HMC\nRole-Task-Tool Matrix™), then pick content<\/p><\/li>\n<li><p><strong>Spread it out:<\/strong> short sessions over weeks beat\none long day<\/p><\/li>\n<li><p><strong>Test application, not attendance:<\/strong> ask “what do\nyou do differently?” at day 30, not “did you enjoy it?”<\/p><\/li>\n<\/ul>\n<p><strong>Measuring it<\/strong><\/p>\n<ul>\n<li><p>Share of each tier trained<\/p><\/li>\n<li><p>Active use 30 and 90 days after training<\/p><\/li>\n<li><p>Tasks changed per team<\/p><\/li>\n<li><p>Champions emerging from Tier 2 and Tier 3<\/p><\/li>\n<\/ul>\n<p><strong>Try this<\/strong><\/p>\n<p>List your roles and put each into one of the four tiers. Count the\npeople in each tier. If your current plan trains all of them the same\nway, redesign the first session around Tier 1 and book separate function\nworkshops for Tier 2.<\/p>\n<p><strong>The rule:<\/strong> train by role and task, not by headcount.\nEveryone needs fluency; only some need depth.<\/p>", "excerpt": "Upskilling Programme Design: Who Learns What, and When Most AI training is one session for everyone. The CFO, the plant supervisor and the sales trainee sit thr"}, {"part": 2, "title": "HMC 90-Day North Star™", "kind": "Framework", "imgs": ["imgs/a15_0.jpg"], "html": "<p><strong>The 90-Day North Star: Three Checkpoints, One Fixed\nOrder<\/strong><\/p>\n<p>Ask how an AI rollout is going three months in, and you usually get a\nstory: a good demo, a team that “seems excited,” a licence count. Not\nbecause it failed, but because nobody agreed in advance what progress\nwould look like, or when it would be checked.<\/p>\n<p>Without a fixed rhythm, updates come from whoever asks loudest. The\nchampion reports wins. The sceptic reports the one failure they heard\nabout. Leadership gets noise, not a trend.<\/p>\n<p>The HMC 90-Day North Star™ replaces that with three fixed\ncheckpoints, each asking a different question, in an order you can’t\nskip.<\/p>\n<p><strong>Day 30: Adoption check<\/strong><\/p>\n<p><strong>The question:<\/strong> are people actually using it?<\/p>\n<ul>\n<li><p><strong>Good looks like:<\/strong> weekly use by role, not licence\ncount<\/p><\/li>\n<li><p><strong>Warning sign:<\/strong> 100% licensed, 20% weekly users.\nThat isn’t adoption; it’s shelf-ware with a receipt.<\/p><\/li>\n<\/ul>\n<p><strong>Day 60: Workflow check<\/strong><\/p>\n<p><strong>The question:<\/strong> has it moved from a side experiment\ninto how the work gets done?<\/p>\n<ul>\n<li><p><strong>Good looks like:<\/strong> the task has visibly changed:\nfewer steps, shorter cycle time, a day’s work done in an hour<\/p><\/li>\n<li><p><strong>Warning sign:<\/strong> “people like it,” but the process\nis exactly the same<\/p><\/li>\n<\/ul>\n<p><strong>Day 90: ROI check<\/strong><\/p>\n<p><strong>The question:<\/strong> what did it actually deliver?<\/p>\n<ul>\n<li><p><strong>Good looks like:<\/strong> time saved, quality improved or\nnew work made possible, measured against the baseline<\/p><\/li>\n<li><p><strong>Warning sign:<\/strong> numbers from three power users\npresented as the team result<\/p><\/li>\n<\/ul>\n<p><strong>Why the order can’t be skipped<\/strong><\/p>\n<p><strong>1. ROI without adoption is fiction.<\/strong> Savings from\nthree enthusiasts tell you nothing about the other twenty people.<\/p>\n<p><strong>2. Adoption without workflow change is a vanity\nmetric.<\/strong> High usage with no change to the work means curiosity,\nnot progress.<\/p>\n<p><strong>3. The order shows where it broke.<\/strong> If Day 90\ndisappoints, you already know whether the problem was adoption, workflow\nor value, instead of starting from zero three months late.<\/p>\n<p><strong>How leaders use it<\/strong><\/p>\n<ul>\n<li><p><strong>One page, three dates:<\/strong> every new AI initiative\ngets all three checkpoints in the calendar on launch day<\/p><\/li>\n<li><p><strong>Report the miss:<\/strong> a weak Day 30 isn’t a failed\nreport; it’s the report doing its job, with time to correct before Day\n60<\/p><\/li>\n<li><p><strong>End each checkpoint with a decision:<\/strong> continue,\nadjust or stop. A checkpoint without a decision is just a calendar\nreminder.<\/p><\/li>\n<\/ul>\n<p>“Here’s our AI initiative: [description, team, baseline]. Draft a\n90-Day North Star page: what we’ll measure at Day 30, 60 and 90, what\ngood looks like, and the decision we’ll take at each.”<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Take your newest AI initiative. Put three dates in the calendar\ntoday, 30, 60 and 90 days from launch, each with one question and one\nowner. If it launched more than 30 days ago, run the Day 30 check this\nweek.<\/p>\n<p><strong>The rule:<\/strong> adoption first, workflow second, ROI\nthird. Check on schedule, and decide at every checkpoint.<\/p>", "excerpt": "The 90-Day North Star: Three Checkpoints, One Fixed Order Ask how an AI rollout is going three months in, and you usually get a story: a good demo, a team that "}, {"part": 3, "title": "The AI Baseline Document", "kind": "Article", "imgs": ["imgs/a16_0.jpg"], "html": "<p><strong>Why This Exists<\/strong><\/p>\n<p>You cannot measure an AI initiative's ROI if you never wrote down\nwhat \"before\" looked like. Most rollouts skip this step entirely — they\ngo from vendor pitch to go-live with no ground-truth snapshot of the\nprocess being changed. Three months later, someone asks, \"did it work?\"\nand the honest answer is \"we don't know, because we never measured the\nstarting point.\"<\/p>\n<p>This document is filled out <strong>before<\/strong> any AI tool goes\nlive. It takes 30–45 minutes per process and should be completed with\nthe people who actually do the work — not just their manager's\nassumption of what the work looks like.<\/p>\n<p>One baseline per process/task. If you're rolling out AI across five\nworkflows, fill this out five times.<\/p>\n<p><strong>Section 0 — Identification<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Field<\/strong><\/th>\n<th><strong>Entry<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Process / task being baselined<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Business owner (accountable for outcome)<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>IT / technical owner<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>AI tool being introduced<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Team / function<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Baseline date<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Number of people currently performing this task<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Section 1 — Quantitative Baseline<\/strong><\/p>\n<p><em>Hard numbers. If you don't have exact figures, use your best\nhonest estimate and mark it \"(est.)\" — an honest estimate beats a false\nprecision.<\/em><\/p>\n<p><strong>Time<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Average time to complete one instance of this task<\/td>\n<td>_______________ (mins/hrs)<\/td>\n<\/tr><tr>\n<td>Number of times this task is performed per week/month<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Total person-hours consumed per month<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Number of people involved per instance (handoffs)<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Quality / Error<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Error rate (errors per X instances)<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Rework rate (% of instances requiring correction)<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Average time to catch and fix an error<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Cost of a typical error (rework hours, client impact, compliance\nexposure)<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Cost<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Fully loaded cost per instance (people time × rate)<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Any current tool/vendor cost being replaced<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Cost of delay (revenue/opportunity lost while task is in\nprogress)<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Speed / Cycle Time<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Time from task start to final output delivered<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Time from output delivered to decision/action taken on it<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Number of review/approval cycles before output is considered\nfinal<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Volume Trend<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Metric<\/strong><\/th>\n<th><strong>Current State<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Is task volume growing, flat, or shrinking?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Expected volume in 12 months<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Section 2 — Qualitative Baseline<\/strong><\/p>\n<p><em>Numbers alone miss the story. Capture this from the people doing\nthe task, in their own words where possible.<\/em><\/p>\n<p><strong>Experience of the Work<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Question<\/strong><\/th>\n<th><strong>Response<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>In one sentence, how does the team describe this task today?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>What part of this task do people find most tedious or draining?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>What part requires genuine judgment or expertise (i.e., shouldn't be\nautomated away)?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Where does this task currently cause frustration for internal\nstakeholders or clients?<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Risk &amp; Judgment<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Question<\/strong><\/th>\n<th><strong>Response<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>What's the worst-case outcome if this task is done poorly?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>Is there a compliance, legal, or regulatory dimension to this\ntask?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>How much of this task currently relies on one person's tacit\nknowledge (i.e., a single point of failure)?<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Stakeholder Perception<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Question<\/strong><\/th>\n<th><strong>Response<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>How do downstream users/clients currently rate the output of this\ntask (if measured)?<\/td>\n<td>_______________<\/td>\n<\/tr><tr>\n<td>What's the most common complaint about the current process, if\nany?<\/td>\n<td>_______________<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Team Readiness (feeds directly into HMC\nADOPT-9™)<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Question<\/strong><\/th>\n<th><strong>Response<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>How would you describe the tea
