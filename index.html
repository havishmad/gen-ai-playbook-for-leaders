fected clients<\/p><\/li>\n<li><p>Check the rules in every country you operate in; GDPR and others\nhave their own timelines<\/p><\/li>\n<\/ul>\n<p><strong>4. Learn<\/strong><br />\nMake sure it doesn’t happen again.<\/p>\n<ul>\n<li><p>Find the root cause: data, model, guardrail or process<\/p><\/li>\n<li><p>Fix it and re-test<\/p><\/li>\n<li><p>Update your risk register and share the lessons with other\nteams<\/p><\/li>\n<\/ul>\n<p><strong>Your one-page AI incident plan<\/strong><br />\nEvery AI tool should have answers to:<\/p>\n<ol type=\"1\">\n<li><p>Who monitors it?<\/p><\/li>\n<li><p>How do users report problems?<\/p><\/li>\n<li><p>Who can switch it off, and how?<\/p><\/li>\n<li><p>Who decides whether to notify the Board and users?<\/p><\/li>\n<li><p>Where are the logs kept?<\/p><\/li>\n<li><p>Who owns the fix and the lessons learned?<\/p><\/li>\n<\/ol>\n<p><strong>Try this<\/strong><br />\nPick one live AI tool in your organisation. Write down 20 test questions\nwith known answers and run them today. Then answer the six incident\nquestions above. If you can’t, you’ve found your next priority.<\/p>\n<p><strong>The rule:<\/strong> test on your data before launch, watch it\nafter, and have a plan to detect, contain, notify and learn before you\nneed it.<\/p>\n<p>The DPDP timelines should be checked against the current rules (or\nwith your legal team) before the book goes to print, since the\nregulations are new.<\/p>", "excerpt": "Test What Matters, and Plan for When It Fails Most AI tools get tested once: someone tries a few examples, it looks good, and it goes live. Then real users, rea"}, {"part": 5, "title": "HMC Stakes Ladder™", "kind": "Framework", "imgs": ["imgs/a33_0.jpg"], "html": "<p><strong>Human-in-the-Loop: Match Your Oversight to the\nStakes<\/strong><\/p>\n<p>You’ve built an app with AI. It drafts client emails, scores job\napplicants or prepares the monthly finance report. It works, and it’s\nfast. The question is how much you should let it run on its own.<\/p>\n<p>The answer isn’t “always check everything” or “trust it completely.”\nIt depends on what’s at stake. The more an output affects people, money\nor reputation, and the harder it is to undo, the closer a human needs to\nbe.<\/p>\n<p><strong>The three levels<\/strong><\/p>\n<p><strong>High stakes: human-in-the-loop<\/strong><br />\nThe AI suggests, and a person approves every output before anything\nhappens.<\/p>\n<ul>\n<li><p>Hiring and shortlisting decisions<\/p><\/li>\n<li><p>Credit or loan approvals<\/p><\/li>\n<li><p>Client emails and proposals<\/p><\/li>\n<li><p>Financial reports and board numbers<\/p><\/li>\n<li><p>Anything legal, contractual or salary-related<\/p><\/li>\n<\/ul>\n<p>Here the AI drafts and a human decides. Nothing goes out\nunchecked.<\/p>\n<p><strong>Medium stakes: human-on-the-loop<\/strong><br />\nThe AI acts on its own, and people monitor samples and step in when\nsomething looks off.<\/p>\n<ul>\n<li><p>Routing support tickets to the right team<\/p><\/li>\n<li><p>Coding invoices to expense categories<\/p><\/li>\n<li><p>FAQ bots answering routine questions<\/p><\/li>\n<li><p>Tagging and sorting incoming emails<\/p><\/li>\n<\/ul>\n<p>The AI handles the volume and a human spot-checks, say 1 in 20, and\nfixes patterns, not individual cases.<\/p>\n<p><strong>Low stakes: human-out-of-the-loop<\/strong><br />\nFully automated, and mistakes are easy to reverse.<\/p>\n<ul>\n<li><p>Spell-check and grammar fixes<\/p><\/li>\n<li><p>Spam filtering<\/p><\/li>\n<li><p>Meeting transcripts<\/p><\/li>\n<li><p>Formatting and tidying data<\/p><\/li>\n<\/ul>\n<p>If it gets something wrong, nobody’s hurt and it’s a two-second\nfix.<\/p>\n<p><strong>Why it matters<\/strong><\/p>\n<p><strong>1. Too little oversight is risky<\/strong><br />\nAn AI-written email sent to your biggest client with a wrong figure, or\na candidate rejected by a flawed scoring rule, can do real damage to\nmoney, trust and reputation, and it’s hard to take back.<\/p>\n<p><strong>2. Too much oversight wastes the benefit<\/strong><br />\nIf you personally review every spell-check fix or ticket tag, you’ve\njust added work. The point of building the tool was to save time.<\/p>\n<p><strong>3. It makes you accountable<\/strong><br />\nWhen someone asks “who approved this?”, there should be a clear answer\nfor anything that matters. AI can do the work, but responsibility stays\nwith people.<\/p>\n<p><strong>Build the loop into the app<\/strong><br />\nWhen you vibe code a tool, decide the oversight level up front and ask\nfor it:<\/p>\n<p><strong>For high stakes:<\/strong><\/p>\n<p>“Don’t send anything automatically. Show each draft with an Approve /\nEdit / Reject button. Keep a log of who approved what and when.”<\/p>\n<p><strong>For medium stakes:<\/strong><\/p>\n<p>“Process automatically, but flag anything with low confidence for\nreview. Add a daily summary showing a random sample of 10 items so I can\nspot-check.”<\/p>\n<p><strong>For low stakes:<\/strong><\/p>\n<p>“Run fully automatically. Add an undo button for the last\nchange.”<\/p>\n<p><strong>Questions to decide the level<\/strong><\/p>\n<ul>\n<li><p>Does this output affect a person’s job, money or rights?<\/p><\/li>\n<li><p>Will a client, regulator or senior leader see it?<\/p><\/li>\n<li><p>How costly is a mistake, and how easy is it to undo?<\/p><\/li>\n<li><p>How often has the AI been wrong on this task so far?<\/p><\/li>\n<\/ul>\n<p>Two or more “yes” or “costly” answers means the human stays in the\nloop.<\/p>\n<p><strong>The level can change<\/strong><br />\nStart new tools at a higher level of oversight. As the AI proves\nreliable over weeks, a task can move from in-the-loop to on-the-loop. If\nmistakes creep in, move it back.<\/p>\n<p><strong>Try this<\/strong><br />\nList every AI tool or automation you or your team use today. Put each\none into one of the three levels. Look for any high-stakes task running\nwithout approval and any low-stakes one where someone is checking\neverything for no reason.<\/p>\n<p><strong>The rule:<\/strong> the more an output affects people, money\nor reputation, and the harder it is to undo, the closer the human must\nbe.<\/p>", "excerpt": "Human-in-the-Loop: Match Your Oversight to the Stakes You’ve built an app with AI. It drafts client emails, scores job applicants or prepares the monthly financ"}, {"part": 6, "title": "Why Agents Matter", "kind": "Article", "imgs": ["imgs/a34_0.jpg"], "html": "<p><strong>Why Agents Matter: Chatbots Respond, Agents\nExecute<\/strong><\/p>\n<p>Ask a chatbot to prepare the monthly vendor report and it gives you\ntext: a template, a summary, some advice. You still pull the data, build\nthe sheet, check the numbers and send the email.<\/p>\n<p>Ask an agent and it does the work: pulls the data from the system,\nbuilds the report, checks it against last month, flags the outliers and\ndrafts the email for your approval.<\/p>\n<p>That’s the shift. A chatbot answers. An agent acts.<\/p>\n<p><strong>How an agent works<\/strong><\/p>\n<p>An agent runs in a loop: <strong>plan, act, check,\nrepeat.<\/strong><\/p>\n<ul>\n<li><p><strong>Plan:<\/strong> it breaks the goal into steps<\/p><\/li>\n<li><p><strong>Act:<\/strong> it uses tools: searching, reading files,\nquerying a database, updating a system<\/p><\/li>\n<li><p><strong>Check:<\/strong> it looks at the result and decides the\nnext step<\/p><\/li>\n<li><p><strong>Repeat:<\/strong> until the job is done or it needs a\nperson<\/p><\/li>\n<\/ul>\n<p><strong>What makes it different from a chatbot<\/strong><\/p>\n<p><strong>1. It uses tools<\/strong><\/p>\n<p>It can run a query, open a file, call a system or send a message, not\njust describe how you would.<\/p>\n<p><strong>2. It remembers progress<\/strong><\/p>\n<p>It keeps track of where it is in a multi-step task instead of\nstarting fresh with every message.<\/p>\n<p><strong>3. It can check its own work<\/strong><\/p>\n<p>Good agents compare the output against the goal and try again before\nhanding it over.<\/p>\n<p><strong>4. It can work in teams<\/strong><\/p>\n<p>Larger tasks are split across several agents: one plans, others\nresearch, build or review.<\/p>\n<p><strong>Why it matters for the business<\/strong><\/p>\n<p><strong>1. Whole tasks, not single answers<\/strong><\/p>\n<p>Real work is a chain: extract, clean, check, produce, send. A chatbot\nhandles one link; an agent can handle the chain.<\/p>\n<p><strong>2. Less human glue<\/strong><\/p>\n<p>Today, much of the effort in using AI is people copying output from\none step into the next. Agents remove that glue work.<\/p>\n<p><strong>3. Your rules, applied consistently<\/strong><\/p>\n<p>An agent can follow your reconciliation logic, screening criteria or\nescalation rules the same way every time, at volume.<\/p>\n<p><strong>4. It connects to your systems<\/strong><\/p>\n<p>Through connectors and standards like MCP, agents can read and update\nyour CRM, ERP and shared drives, with a log of what they did.<\/p>\n<p><strong>The risk changes too<\/strong><\/p>\n<p>A chatbot’s mistake is one wrong answer that a person sees. An\nagent’s mistake can travel: a wrong figure at step two becomes the input\nfor steps three to nine, and the final output looks complete and\nconfident.<\/p>\n<p>So the leadership question moves from “is this answer good?” to “what\nis this system allowed to do without asking?” That means:<\/p>\n<ul>\n<li><p><strong>Permissions:<\/strong> only the systems and actions it\nneeds<\/p><\/li>\n<li><p><strong>Approval gates:<\/strong> a person confirms anything\nirreversible, financial or customer-facing<\/p><\/li>\n<li><p><strong>Logs:<\/strong> every step and tool call recorded<\/p><\/li>\n<li><p><strong>A stop button:<\/strong> someone can pause it\ninstantly<\/p><\/li>\n<\/ul>\n<p>Set these with the HMC Agent Autonomy Levels™.<\/p>\n<p>“Here’s a weekly task my team does: [describe steps]. Which steps\ncould an agent do on its own, which need a person to approve, and which\nshould stay fully human? Explain why for each.”<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Pick one recurring task in your team with five or more steps. Map\nwhich steps are tool work (fetching, copying, formatting) and which are\njudgement. The tool-work steps are your first agent candidates.<\/p>\n<p><strong>The rule:<\/strong> agents turn AI from an advisor into a\nworker. Give them clear tasks, limited permissions and a person who\napproves what matters.<\/p>", "excerpt": "Why Agents Matter: Chatbots Respond, Agents Execute Ask a chatbot to prepare the monthly vendor report and it gives you text: a template, a summary, some advice"}, {"part": 6, "title": "Agent vs Agentic AI", "kind": "Article", "imgs": ["imgs/a35_0.jpg"], "html": "<p><strong>Agents vs Agentic AI: What Leaders Actually Need to\nDistinguish<\/strong><\/p>\n<p>Most enterprise AI conversations in 2026 use \"agent\" and \"agentic AI\"\ninterchangeably. They are not the same thing, and the difference\ndetermines what you buy, what you govern, and what you can realistically\ndeploy this year.<\/p>\n<p><strong>The distinction<\/strong><\/p>\n<p>An <em>agent<\/em> is a thing. A model given a defined task, a set of\ntools, and instructions on how to use them. It drafts the variance\ncommentary, reconciles the invoice batch, screens the CVs.<\/p>\n<p><em>Agentic<\/em> is a property. It describes how much of the\ndecision-making the system does for itself. An agentic system is given\nan outcome rather than a task, and decides its own sequence of steps to\nget there, correcting as it goes.<\/p>\n<p>Put simply: agent is the noun, agentic is the adjective. The variable\nthat separates them is <strong>who decides the next step<\/strong> — your\nprocess designer, or the system.<\/p>\n<p><strong>The autonomy spectrum<\/strong><\/p>\n<p>Level 0 — Assistant. You prompt, it responds. You do every\nstep.<br />\nLevel 1 — Agent. Given a task, it executes a largely fixed path using\ndefined tools.<br />\nLevel 2 — Agentic. Given a goal, it plans its own path, retries, and\ndecides when the work is done.<br />\nLevel 3 — Multi-agent. Several agentic systems delegate to and hand off\nto each other.<\/p>\n<p>Nearly all enterprise value being captured today sits at Level 1.\nNearly all vendor marketing describes Level 2 and 3.<\/p>\n<p><strong>Side by side<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><\/th>\n<th><strong>Agent (Level 1)<\/strong><\/th>\n<th><strong>Agentic (Level 2–3)<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>You supply<\/td>\n<td>A task<\/td>\n<td>An outcome<\/td>\n<\/tr><tr>\n<td>Sequence decided by<\/td>\n<td>Your designer<\/td>\n<td>The system<\/td>\n<\/tr><tr>\n<td>Memory<\/td>\n<td>Usually per-run<\/td>\n<td>Persistent across steps<\/td>\n<\/tr><tr>\n<td>Failure mode<\/td>\n<td>Visible, contained<\/td>\n<td>Compounding across steps<\/td>\n<\/tr><tr>\n<td>Oversight<\/td>\n<td>Check the output<\/td>\n<td>Check the reasoning and every action<\/td>\n<\/tr><tr>\n<td>Time to value<\/td>\n<td>Weeks<\/td>\n<td>Quarters<\/td>\n<\/tr><tr>\n<td>Best fit<\/td>\n<td>High-volume, repeatable, bounded<\/td>\n<td>Variable-path, exploratory, iterative<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Five questions to ask any vendor<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Who decides the order of steps — your system, or our workflow\ndesigner?<\/p><\/li>\n<li><p>What can it change in our systems without a human approving\nfirst?<\/p><\/li>\n<li><p>Does it carry state across steps, or is each call\nindependent?<\/p><\/li>\n<li><p>If it fails at step four of nine, what happens to steps one to\nthree?<\/p><\/li>\n<li><p>Does the audit trail show only the output, or the reasoning and\nevery tool call?<\/p><\/li>\n<\/ol>\n<p>If the answers to 1 and 3 are \"our designer\" and \"independent,\" you\nare buying an agent with agentic branding. That is often the right\npurchase — but price and govern it accordingly.<\/p>\n<p><strong>The failure profiles are different, and this is the real\nissue<\/strong><\/p>\n<p>An agent fails cheaply. One task, one bad output, one human catches\nit.<\/p>\n<p>An agentic system fails expensively. An error at step two is not\ncaught — it becomes the input to step three, and the system confidently\nbuilds seven more steps on top of it. The output looks complete and\ninternally consistent. That is precisely what makes it hard to catch in\nreview.<\/p>\n<p>This is why agentic deployments demand a different control model. You\nare no longer reviewing outputs. You are reviewing decisions.<\/p>\n<p><strong>The governance rule: autonomy proportional to\nreversibility<\/strong><\/p>\n<p>Do not scale autonomy by confidence in the model. Scale it by the\ncost of being wrong.<\/p>\n<ul>\n<li><p>Reversible, internal, low value → let it run, sample the\noutput.<\/p><\/li>\n<li><p>Reversible but externally visible → human approves before it\nleaves the building.<\/p><\/li>\n<li><p>Irreversible, financial, or contractual → the system proposes, a\nnamed human commits.<\/p><\/li>\n<\/ul>\n<p>Most organisations invert this. They pilot agentic AI on the\nhighest-stakes process because that is where the ROI story is, then\nwithdraw the programme when it fails once. Sequence it the other\nway.<\/p>\n<p><strong>What to do<\/strong><\/p>\n<p>Start at Level 1 and earn your way up. Deploy bounded agents against\nprocesses you have already measured — time taken, error rate, cost per\ncycle, captured before go-live, one process at a time. Re-run the same\nnumbers at 90 days. Only then consider handing over path decisions.<\/p>\n<p>Assess readiness before autonomy, not after. Team readiness, not\nmodel capability, is what breaks agentic pilots. A team that cannot yet\nreview an agent's output has no business reviewing an agentic system's\nreasoning.<\/p>\n<p>And be direct about the shape of the portfolio. In year one, most\nenterprises need many narrow agents and one or two carefully scoped\nagentic pilots. The reverse looks more ambitious in a board deck and\ndelivers materially less.<\/p>\n<p><strong>Bottom line<\/strong><\/p>\n<p>Agents automate tasks. Agentic AI automates judgement about tasks.\nThe first is a productivity decision. The second is a governance\ndecision. Treat them as the same purchase and you will over-buy\nautonomy, under-build controls, and stall at the pilot.<\/p>", "excerpt": "Agents vs Agentic AI: What Leaders Actually Need to Distinguish Most enterprise AI conversations in 2026 use \"agent\" and \"agentic AI\" interchangeably. They are "}, {"part": 6, "title": "HMC Agent Autonomy Levels™", "kind": "Framework", "imgs": ["imgs/a36_0.jpg"], "html": "<p><strong>Agent Autonomy Levels: Decide How Much an Agent Can Do on Its\nOwn<\/strong><\/p>\n<p>Agents don’t just answer. They send emails, update records, place\norders and move money. The question for leaders is no longer “is the\nanswer good?” but “what is this system allowed to do without\nasking?”<\/p>\n<p>Most companies answer that by accident: whatever the vendor switched\non by default. The HMC Agent Autonomy Levels™ make it a decision, use\ncase by use case.<\/p>\n<p><strong>The five levels<\/strong><\/p>\n<p><strong>Level 0: Assist<\/strong><\/p>\n<p>The AI suggests. A person does every step.<\/p>\n<p>Example: it recommends which supplier to call; the buyer calls.<\/p>\n<p><strong>Level 1: Draft<\/strong><\/p>\n<p>The AI prepares the work. A person reviews and sends it.<\/p>\n<p>Example: it drafts the collection email; the finance executive edits\nand sends.<\/p>\n<p><strong>Level 2: Act with approval<\/strong><\/p>\n<p>The AI can act, but every action waits for a person to approve\nit.<\/p>\n<p>Example: it prepares a vendor payment run; the controller approves\neach batch.<\/p>\n<p><strong>Level 3: Act and report<\/strong><\/p>\n<p>The AI acts within set limits and logs everything. People review\nsamples and exceptions.<\/p>\n<p>Example: it reorders stock below a threshold, up to ₹50,000 per\norder, with a daily summary.<\/p>\n<p><strong>Level 4: Act alone<\/strong><\/p>\n<p>The AI runs a bounded process end to end. People are alerted only\nwhen something breaks a rule.<\/p>\n<p>Example: it routes and tags incoming support tickets around the\nclock.<\/p>\n<p><strong>How to set the level<\/strong><\/p>\n<p>Scale autonomy by the cost of being wrong, not by how impressive the\nmodel is. Ask four questions:<\/p>\n<ul>\n<li><p>Can the action be undone easily?<\/p><\/li>\n<li><p>Does it touch money, customers or people’s records?<\/p><\/li>\n<li><p>Is the volume high enough that approvals would cancel the\nbenefit?<\/p><\/li>\n<li><p>How often has the agent been wrong on this task so far?<\/p><\/li>\n<\/ul>\n<p>Irreversible, financial or customer-facing actions stay at Level 2 or\nbelow. High-volume, easily reversed actions can earn Level 3 or 4.<\/p>\n<p><strong>Promotion has to be earned<\/strong><\/p>\n<p>New agents start one level lower than you think they need. An agent\nmoves up a level only after a set period at the current level with an\nerror rate below an agreed threshold. If errors rise, it moves back\ndown. Write the promotion rule before launch.<\/p>\n<p><strong>Guardrails at every level<\/strong><\/p>\n<ul>\n<li><p><strong>Limits:<\/strong> value caps, record caps, allowed systems\nonly<\/p><\/li>\n<li><p><strong>Least access:<\/strong> only the permissions the level\nneeds<\/p><\/li>\n<li><p><strong>Logs:<\/strong> every action, with inputs and reasoning,\nkept and searchable<\/p><\/li>\n<li><p><strong>A stop button:<\/strong> anyone authorised can pause the\nagent instantly<\/p><\/li>\n<li><p><strong>An owner:<\/strong> a named person accountable for what\nthe agent does<\/p><\/li>\n<\/ul>\n<p><strong>Questions to ask any vendor<\/strong><\/p>\n<ul>\n<li><p>Which level does your agent run at by default, and can we change\nit?<\/p><\/li>\n<li><p>Can we set different levels for different actions?<\/p><\/li>\n<li><p>What does the log show: just the outcome, or every step and tool\ncall?<\/p><\/li>\n<\/ul>\n<p><strong>Try this<\/strong><\/p>\n<p>List every agent or automation running in your company. Assign each a\nlevel from 0 to 4. Then check: does any agent sit at Level 3 or 4 while\ntouching money, customers or personal data? Move it down until it has\nearned its way back.<\/p>\n<p><strong>The rule:<\/strong> autonomy is earned, not configured. Match\nthe level to the cost of a mistake, and promote only on evidence.<\/p>", "excerpt": "Agent Autonomy Levels: Decide How Much an Agent Can Do on Its Own Agents don’t just answer. They send emails, update records, place orders and move money. The q"}, {"part": 6, "title": "API vs MCP", "kind": "Article", "imgs": ["imgs/a37_0.jpg"], "html": "<p><strong>API vs MCP: Why Connecting AI to Your Systems Just Got\nEasier<\/strong><\/p>\n<p>For AI to be useful at work, it has to reach your systems: the CRM,\nthe ERP, the shared drive, the ticketing tool. How it connects decides\nhow much each new connection costs, who controls access and how easily\nyou can switch AI providers.<\/p>\n<p>There are two ways to connect. Leaders don’t need the technical\ndetail, but they do need to know the difference.<\/p>\n<p><strong>The API way: one custom cable per connection<\/strong><\/p>\n<p>An API is a door into a system. To connect an AI tool to your CRM,\nyour team writes custom code. To connect it to the ERP, more custom\ncode. To connect a second AI tool to the same CRM, more again.<\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> familiar, proven, fully\ncontrollable<\/p><\/li>\n<li><p><strong>Weakness:<\/strong> effort grows with every pairing. Ten\nsystems and three AI tools can mean dozens of custom integrations to\nmaintain.<\/p><\/li>\n<\/ul>\n<p><strong>The MCP way: one standard plug<\/strong><\/p>\n<p>MCP (Model Context Protocol) is an open standard for connecting AI to\ntools and data. Each system is connected once through an MCP server, and\nany MCP-compatible AI tool can use it.<\/p>\n<p>Think of it as the move from a different charger for every phone to\nUSB-C: the standard does the work, not the cable.<\/p>\n<ul>\n<li><p><strong>Strengths:<\/strong> connect once, use from many AI tools;\neasier to switch providers<\/p><\/li>\n<li><p><strong>Weakness:<\/strong> still a young standard; not every\nenterprise system has a mature MCP server yet<\/p><\/li>\n<\/ul>\n<p><strong>What changes for leaders<\/strong><\/p>\n<p><strong>1. Integration cost falls<\/strong><\/p>\n<p>With APIs, cost grows with every tool-system pairing. With MCP, a\nsystem is connected once and reused. This matters most if you’ll run\nseveral AI tools against the same systems.<\/p>\n<p><strong>2. Governance moves to access settings<\/strong><\/p>\n<p>With APIs, permissions are buried in code. With MCP, what the AI can\nsee and do (read-only or write, which systems, which data) is set in one\nplace. That’s easier to audit, but only if someone designs access\ncarefully. A loosely set MCP connection can expose more than\nintended.<\/p>\n<p><strong>3. Lock-in drops, standard risk rises<\/strong><\/p>\n<p>Because MCP works across AI providers, switching tools no longer\nmeans rebuilding every integration. The trade-off: the standard is still\nevolving, so some connections will still need direct API work.<\/p>\n<p><strong>Questions to ask your team or vendor<\/strong><\/p>\n<ul>\n<li><p>Which of our core systems already have an MCP connector?<\/p><\/li>\n<li><p>Who decides what each connector can read and write?<\/p><\/li>\n<li><p>Are connections read-only by default?<\/p><\/li>\n<li><p>Is every action through a connector logged?<\/p><\/li>\n<\/ul>\n<p>“List the five systems my team uses most: [list]. For each, tell me\nwhether a standard MCP connector is commonly available and what read or\nwrite access an AI assistant would typically need.”<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Ask IT for a list of every AI tool connected to company systems\ntoday, and how. Mark each as API or MCP, and note who approved its\naccess. Any connection with no named approver is your first governance\nfix.<\/p>\n<p><strong>The rule:<\/strong> APIs aren’t going away; MCP often sits on\ntop of them. Use custom APIs for one-off, high-control needs, and MCP\nfor anything several AI tools will need again and again.<\/p>", "excerpt": "API vs MCP: Why Connecting AI to Your Systems Just Got Easier For AI to be useful at work, it has to reach your systems: the CRM, the ERP, the shared drive, the"}, {"part": 6, "title": "Skills", "kind": "Article", "imgs": ["imgs/a38_0.jpg"], "html": "<p><strong>Skills: A Good Prompt Solves a Moment. A Skill Solves the\nWorkflow.<\/strong><\/p>\n<p>An analyst spends an afternoon getting the perfect prompt for the\nweekly sales commentary. It works brilliantly. A week later a colleague\nneeds the same report and rebuilds the prompt from memory. Three months\nlater the analyst leaves, and the prompt leaves with them.<\/p>\n<p>That’s the limit of prompting. A skill fixes it.<\/p>\n<p><strong>What a skill is<\/strong><\/p>\n<p>A skill is a saved, reusable set of instructions for a task: the\ncontext, steps, format, rules and examples it needs. Instead of being\nretyped in every chat, it’s saved once, called by name, shared across\nthe team and updated in one place.<\/p>\n<ul>\n<li><p><strong>A prompt:<\/strong> lives in one chat and disappears with\nit<\/p><\/li>\n<li><p><strong>A skill:<\/strong> lives on its own, works the same for\neveryone and improves over time<\/p><\/li>\n<\/ul>\n<p>The shift is from “ask well every time” to “define it once, reuse it\nforever.”<\/p>\n<p><strong>Three problems skills solve<\/strong><\/p>\n<p><strong>1. Inconsistency between people<\/strong><\/p>\n<p>Two analysts producing the “same” report end up with different\nstructure, tone and detail, because each wrote their own prompt.<\/p>\n<p><strong>2. Knowledge walking out of the door<\/strong><\/p>\n<p>The person who worked out how to get the analysis right is the only\none who knows how they asked.<\/p>\n<p><strong>3. Drift over time<\/strong><\/p>\n<p>Small wording changes week to week produce small output changes. Six\nmonths later, nobody knows why this month’s report looks different from\nJanuary’s.<\/p>\n<p>A skill fixes all three: one set of instructions, the same for\neveryone, updated centrally.<\/p>\n<p><strong>What should become a skill<\/strong><\/p>\n<ul>\n<li><p><strong>Good candidates:<\/strong> recurring reports, review\nchecklists, the company’s way of structuring a proposal or analysis, any\nmulti-step task done the same way each time<\/p><\/li>\n<li><p><strong>Poor candidates:<\/strong> one-off questions, open\nbrainstorms, anything where the right approach is still being worked\nout<\/p><\/li>\n<\/ul>\n<p><strong>The test:<\/strong> if you’ve written a similar prompt three\ntimes with small changes, it isn’t a prompt any more. It’s a skill\nwaiting to be written down.<\/p>\n<p><strong>What goes into a good skill<\/strong><\/p>\n<ul>\n<li><p><strong>Purpose:<\/strong> what the task is and when to use\nit<\/p><\/li>\n<li><p><strong>Inputs:<\/strong> what the user must provide<\/p><\/li>\n<li><p><strong>Steps:<\/strong> the order the work should follow<\/p><\/li>\n<li><p><strong>Format:<\/strong> structure, length, tone,\nbranding<\/p><\/li>\n<li><p><strong>Rules:<\/strong> what never to do; what to check before\nfinishing<\/p><\/li>\n<li><p><strong>An example:<\/strong> one good output to copy<\/p><\/li>\n<\/ul>\n<p>“Turn this prompt and the output I liked into a reusable skill:\n[paste]. Include purpose, inputs, steps, format, rules and one\nexample.”<\/p>\n<p><strong>Why leaders should care<\/strong><\/p>\n<p>For one person, a skill saves typing. For a company, it turns\nknow-how into an asset that survives turnover and scales without\nretraining everyone.<\/p>\n<p>It also changes the question to ask. Not “are our people good at\nprompting?”, which is hard to measure, but “which of our recurring tasks\nhave a skill behind them, and which still depend on what someone\nremembers to type?”<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>List the five tasks your team uses AI for most often. For each, ask:\nis there a saved skill, or is everyone writing their own prompt? Turn\nthe most repeated one into a skill this week and share it with the\nteam.<\/p>\n<p><strong>The rule:<\/strong> prompting is a conversation; a skill is\ninfrastructure. Turn your best, most repeated prompts into skills.<\/p>", "excerpt": "Skills: A Good Prompt Solves a Moment. A Skill Solves the Workflow. An analyst spends an afternoon getting the perfect prompt for the weekly sales commentary. I"}, {"part": 6, "title": "Skills vs MCP vs RAG vs Memory", "kind": "Article", "imgs": ["imgs/a39_0.jpg", "imgs/a39_1.jpg"], "html": "<p><strong>Skills vs MCP vs RAG vs Memory: The Four Layers<\/strong><\/p>\n<p>These four terms dominate enterprise AI architecture discussions, and\nthey are routinely presented as competing options. They are not\nalternatives. They answer four different questions, and a serious\ndeployment usually needs all four.<\/p>\n<p><strong>The four questions<\/strong><\/p>\n<p><strong>RAG<\/strong> — <em>What does the organisation know?<\/em>\nRetrieval-augmented generation pulls relevant passages from your\ndocuments at the moment of the question and hands them to the model.\nRead-only, corpus-bound.<\/p>\n<p><strong>MCP<\/strong> — <em>What can it reach and do?<\/em> The Model\nContext Protocol is the plumbing that connects a model to live systems:\nyour CRM, your ticketing tool, your file store. It reads current state\nand, if permitted, changes it.<\/p>\n<p><strong>Skills<\/strong> — <em>How do we do this here?<\/em> A packaged\nprocedure the model loads when relevant. The steps, the format, the\nstandard, the house style, the things a good analyst knows on their\nthird month that a new one does not.<\/p>\n<p><strong>Memory<\/strong> — <em>What carries over?<\/em> What persists\nabout a user or team across sessions, so context does not have to be\nre-supplied every time.<\/p>\n<p>Knowledge, access, procedure, continuity. Four layers, four owners,\nfour failure modes.<\/p>\n<p><strong>Side by side<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><\/th>\n<th><strong>RAG<\/strong><\/th>\n<th><strong>MCP<\/strong><\/th>\n<th><strong>Skills<\/strong><\/th>\n<th><strong>Memory<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Answers<\/td>\n<td>What's true<\/td>\n<td>What it can reach<\/td>\n<td>How we do it<\/td>\n<td>What carries over<\/td>\n<\/tr><tr>\n<td>Direction<\/td>\n<td>Read-only<\/td>\n<td>Read and write<\/td>\n<td>Instruction<\/td>\n<td>Accumulates<\/td>\n<\/tr><tr>\n<td>Freshness<\/td>\n<td>As fresh as the index<\/td>\n<td>Live<\/td>\n<td>As fresh as the author<\/td>\n<td>Rolling<\/td>\n<\/tr><tr>\n<td>Typical owner<\/td>\n<td>IT / knowledge management<\/td>\n<td>IT / security<\/td>\n<td>The function itself<\/td>\n<td>Platform + policy<\/td>\n<\/tr><tr>\n<td>Effort to stand up<\/td>\n<td>Project<\/td>\n<td>Integration<\/td>\n<td>Document<\/td>\n<td>Setting plus policy<\/td>\n<\/tr><tr>\n<td>Highest risk<\/td>\n<td>Permission leakage<\/td>\n<td>State change, injection<\/td>\n<td>Silent drift<\/td>\n<td>Privacy, wrong recall<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>The diagnostic: when output is wrong, which layer\nfailed?<\/strong><\/p>\n<ul>\n<li><p>It invented facts or cited the wrong document →\n<strong>RAG<\/strong>. Retrieval, not the model.<\/p><\/li>\n<li><p>The facts were stale, or it could describe the action but not\ntake it → <strong>MCP<\/strong>.<\/p><\/li>\n<li><p>The facts were right but the format, sequence, or standard was\nwrong → <strong>Skills<\/strong>.<\/p><\/li>\n<li><p>It was correct, but you had to re-explain context you had already\ngiven twice → <strong>Memory<\/strong>.<\/p><\/li>\n<\/ul>\n<p>Most enterprises diagnose all four as \"the model isn't good enough\"\nand go shopping for a better model. That fixes none of them.<\/p>\n<p><strong>Where the money usually goes wrong<\/strong><\/p>\n<p>The default enterprise instinct is to start with RAG — \"build us a\nbot that knows our documents.\" It is the most expensive layer per unit\nof value in year one. It requires a pipeline, chunking decisions, an\nevaluation set, and permission inheritance that mirrors your existing\naccess controls. Done badly, it produces a system that confidently\nanswers from the wrong version of a policy, or shows a junior the\ncompensation deck.<\/p>\n<p>Skills are the cheapest layer and the most under-invested. Encoding\nhow your finance team actually writes variance commentary — the\nsequence, the thresholds, the tone, the exclusions — is a document, not\na project. It usually delivers more visible improvement in the first\nmonth than a retrieval build delivers in six.<\/p>\n<p>MCP is the highest-leverage and highest-risk layer, because it is the\nonly one that changes something. Read-only connections first. Write\naccess earned, scoped, and logged.<\/p>\n<p>Memory is the layer to leave largely alone at the start. It accrues\nnaturally, and the governance question — what the system is allowed to\nretain about employees and clients, and for how long — should be settled\nby policy before it is settled by default.<\/p>\n<p><strong>Three questions to ask any vendor<\/strong><\/p>\n<ol type=\"1\">\n<li><p>When it answers a question, is it retrieving from a snapshot or\nreading live? If a snapshot, how old, and who refreshes it?<\/p><\/li>\n<li><p>Does it inherit our existing permissions, or does it have its own\naccess model we now have to maintain separately?<\/p><\/li>\n<li><p>What can it write to, and what is the log of every\nwrite?<\/p><\/li>\n<\/ol>\n<p>The second question is the one most often skipped and most often\nregretted. A parallel permission model is a permanent operational\nliability.<\/p>\n<p><strong>The governance rule: separate what it knows from what it can\ndo<\/strong><\/p>\n<p>Knowledge access and action authority are different grants and should\nbe approved by different people. A system that can read every contract\nis a confidentiality question. A system that can amend one is a controls\nquestion. Bundling them into a single \"AI access\" approval is how\norganisations end up with capabilities nobody deliberately signed off\non.<\/p>\n<p><strong>What to do<\/strong><\/p>\n<p>Sequence it: Skills, then read-only MCP, then RAG, then write access,\nwith memory governed by policy from day one. Assign an owner per layer —\nthe function owns its skills, IT owns access, and neither should own\nboth.<\/p>\n<p>And when the next architecture proposal arrives, ask which of the\nfour questions it answers. If the answer is \"all of them,\" it answers\nnone of them well.<\/p>\n<p><strong>Bottom line<\/strong><\/p>\n<p>RAG is what it knows. MCP is what it can touch. Skills are how it\nworks. Memory is what it retains. Confuse them and you will fund the\nexpensive layer, skip the cheap one, and grant the risky one by\naccident.<\/p>", "excerpt": "Skills vs MCP vs RAG vs Memory: The Four Layers These four terms dominate enterprise AI architecture discussions, and they are routinely presented as competing "}, {"part": 7, "title": "HMC C.R.A.F.T.S.™", "kind": "Framework", "imgs": ["imgs/a40_0.jpg"], "html": "<p><strong>Prompt Architecture Framework<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Letter<\/strong><\/th>\n<th><strong>Element 1<\/strong><\/th>\n<th><strong>Element 2<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td><strong>C<\/strong><\/td>\n<td><strong>Context<\/strong> — background, data, situation the model\nneeds<\/td>\n<td><strong>Character<\/strong> — persona/role the model should\nassume<\/td>\n<\/tr><tr>\n<td><strong>R<\/strong><\/td>\n<td><strong>Role<\/strong> — the specific task/job being asked<\/td>\n<td><strong>Reasoning<\/strong> — step-by-step thinking shown, or final\nanswer only<\/td>\n<\/tr><tr>\n<td><strong>A<\/strong><\/td>\n<td><strong>Aim<\/strong> — the specific goal or outcome<\/td>\n<td><strong>Audience<\/strong> — who the output is ultimately for<\/td>\n<\/tr><tr>\n<td><strong>F<\/strong><\/td>\n<td><strong>Format<\/strong> — structure: bullets, table, headers,\nlength<\/td>\n<td><strong>Flow<\/strong> — logical sequence the response should\nfollow<\/td>\n<\/tr><tr>\n<td><strong>T<\/strong><\/td>\n<td><strong>Tone<\/strong> — voice: formal, casual, technical,\npersuasive<\/td>\n<td><strong>Test<\/strong> — review, refine, re-prompt (built-in\niteration loop)<\/td>\n<\/tr><tr>\n<td><strong>S<\/strong><\/td>\n<td><strong>Scope<\/strong> — what's in/out of bounds for the task<\/td>\n<td><strong>Constraints<\/strong> — hard limits: length, budget,\ncompliance, format rules<\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "Prompt Architecture Framework Letter Element 1 Element 2 C Context — background, data, situation the model needs Character — persona/role the model should assum"}, {"part": 7, "title": "Work with Sensitive Data", "kind": "Article", "imgs": ["imgs/a41_0.jpg"], "html": "<p><strong>Work with Sensitive Data: Share the Structure, Not the\nSecrets<\/strong><\/p>\n<p>You want to build a salary dashboard, a customer tracker or a sales\nreport. The data is sitting in Excel: names, phone numbers, salaries,\nclient deals. The easy move is to paste the whole sheet into the AI and\nsay “build me a dashboard.”<\/p>\n<p>Don’t. The AI doesn’t need your real data to build the tool. It only\nneeds to know what the data looks like.<\/p>\n<p><strong>The core idea: headers, not rows<\/strong><\/p>\n<p>To build an app, the AI needs the column names, the type of data in\neach column, and a sense of the format. It doesn’t need Ramesh’s salary\nor your top client’s phone number.<\/p>\n<p>So copy only the header row:<\/p>\n<p>Employee ID | Name | Department | Joining Date | Basic Salary | HRA |\nBonus | Manager<\/p>\n<p>That one line tells the AI everything it needs to build the tool.<\/p>\n<p><strong>Why it works<\/strong><\/p>\n<p><strong>1. Your data stays private<\/strong><\/p>\n<p>Customer details, salaries, financials and personal information never\nleave your system. No risk of exposure and no policy breach.<\/p>\n<p><strong>2. The AI builds just as well<\/strong><\/p>\n<p>A dashboard built from headers works exactly the same as one built\nfrom real rows. Once it’s ready, you load your real data into it on your\nown computer.<\/p>\n<p><strong>3. You stay compliant<\/strong><\/p>\n<p>Most companies have rules about what can go into AI tools. Data\nprotection laws apply to personal information. Sharing only the\nstructure keeps you on the right side of both.<\/p>\n<p><strong>4. It forces clearer thinking<\/strong><\/p>\n<p>Describing your columns makes you think about what the app actually\nneeds. You’ll often find fields you can drop.<\/p>\n<p><strong>Ways to share safely<\/strong><\/p>\n<p><strong>Headers only<\/strong><\/p>\n<p>“My Excel has these columns: [paste headers]. Build a dashboard\nshowing total bonus by department.”<\/p>\n<p><strong>Headers plus data types<\/strong><\/p>\n<p>“Joining Date is DD-MM-YYYY. Basic Salary is a number in rupees.\nDepartment has 6 values: Sales, HR, Finance, Ops, IT, Admin.”<\/p>\n<p><strong>Fake sample rows<\/strong><\/p>\n<p>“Create 20 rows of realistic dummy data with these columns so I can\ntest the app.”<\/p>\n<p>The AI generates fake data, you test with it, then swap in the real\nthing.<\/p>\n<p><strong>Masked data<\/strong><\/p>\n<p>If you have to show real patterns, replace the sensitive parts first.\nNames become Employee 1, Employee 2, and so on. Phone numbers become\n9XXXXXXXXX. Amounts can be scaled or rounded.<\/p>\n<p><strong>Build it so the data stays local<\/strong><\/p>\n<p>Ask for a tool that runs on your machine:<\/p>\n<p>“Build this as a single HTML file / Excel macro / Python script that\nruns on my computer. I’ll load the real data myself. Don’t include any\nof my data in the code.”<\/p>\n<p><strong>What never goes into AI<\/strong><\/p>\n<ul>\n<li><p>Passwords, API keys, bank details<\/p><\/li>\n<li><p>ID numbers (PAN, Aadhaar, passport)<\/p><\/li>\n<li><p>Salaries and personal details of named people<\/p><\/li>\n<li><p>Client contracts and confidential deals<\/p><\/li>\n<li><p>Anything your company policy marks as restricted<\/p><\/li>\n<\/ul>\n<p><strong>When in doubt<\/strong><\/p>\n<p>Check your company’s AI policy, use your organisation’s approved\nenterprise tools, and ask IT if you’re unsure. Enterprise plans often\nhave stronger data protections, but even then, headers-only is a good\nhabit.<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Take a sensitive report you work on. Copy only the header row, ask\nthe AI to build the tool and generate dummy data to test it. Once it\nworks, load your real data on your own machine.<\/p>\n<p><strong>The rule:<\/strong> the AI needs the shape of your data, not\nthe data itself. Share headers, keep the rows.<\/p>", "excerpt": "Work with Sensitive Data: Share the Structure, Not the Secrets You want to build a salary dashboard, a customer tracker or a sales report. The data is sitting i"}, {"part": 7, "title": "Context Window", "kind": "Article", "imgs": ["imgs/a42_0.jpg"], "html": "<p><strong>Context Window: Why AI “Forgets” in Long\nConversations<\/strong><\/p>\n<p>You’ve been working with AI for an hour on a strategy note. Then it\nstarts ignoring the format you set at the start, contradicts something\nit said earlier or forgets a key number from the first document.<\/p>\n<p>The instinct is to think the AI got worse. It didn’t. The\nconversation outgrew its context window.<\/p>\n<p><strong>What the context window is<\/strong><\/p>\n<p>The context window is everything the AI can see at once: your\nmessages, its replies and every document you’ve pasted or attached. Each\ntime it answers, it re-reads all of it from the start.<\/p>\n<p>It isn’t memory. Think of it as a desk: the AI can only work with\nwhat’s on the desk. A bigger desk holds more papers, but when it’s full,\nthe oldest ones get pushed out of view.<\/p>\n<p><strong>Why it matters<\/strong><\/p>\n<ul>\n<li><p><strong>Long email threads:<\/strong> the AI’s answer misses\nnuance from the first messages<\/p><\/li>\n<li><p><strong>Long working sessions:<\/strong> instructions you gave an\nhour ago stop shaping the output<\/p><\/li>\n<li><p><strong>Big documents:<\/strong> a 200-page due diligence file may\nnot fit, however good the model is<\/p><\/li>\n<\/ul>\n<p>This isn’t the AI being careless. It’s a fixed limit, and it behaves\nthe same way every time once you know the rule: what’s off the desk\ndoesn’t exist for that answer.<\/p>\n<p><strong>Size varies by tool<\/strong><\/p>\n<p>Some tools hold a few thousand words; others hold hundreds of\nthousands. A bigger window helps, but doesn’t remove the problem. The\nsame task can work in one tool and fail in another simply because of how\nmuch each can hold at once.<\/p>\n<p><strong>Five habits that work<\/strong><\/p>\n<p><strong>1. Put what matters close to where you need it<\/strong><\/p>\n<p>If a format, a constraint or a number is critical, restate it in the\nmessage where you need it used.<\/p>\n<p><strong>2. Work in chunks<\/strong><\/p>\n<p>Instead of one pass over a 100-page report, go section by section.\nThe output is more reliable and easier to check.<\/p>\n<p><strong>3. Start fresh on purpose<\/strong><\/p>\n<p>When a long chat starts drifting, start a new one with a tight\nsummary of what matters.<\/p>\n<p>“Summarise everything we’ve agreed in this conversation in one page:\ndecisions, numbers, format rules and open questions. I’ll start a new\nchat with it.”<\/p>\n<p><strong>4. Don’t assume it carries over<\/strong><\/p>\n<p>A new chat starts with an empty desk unless the tool has a memory or\nproject feature. Paste in what it needs.<\/p>\n<p><strong>5. Use projects and skills for standing\ninstructions<\/strong><\/p>\n<p>Instructions saved in a project or skill are loaded every time, so\nthey don’t scroll away.<\/p>\n<p><strong>The point for leaders<\/strong><\/p>\n<p>The context window is a fixed resource, like budget or headcount.\nTeams that treat it as unlimited end up blaming the model for what is\nreally a workflow design problem.<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Next time a long AI session goes off track, don’t argue with it. Ask\nfor a one-page summary, open a new chat, paste the summary and continue.\nCompare the quality.<\/p>\n<p><strong>The rule:<\/strong> the AI only sees what’s on its desk. Keep\nwhat matters on it, and clear the desk when it gets crowded.<\/p>", "excerpt": "Context Window: Why AI “Forgets” in Long Conversations You’ve been working with AI for an hour on a strategy note. Then it starts ignoring the format you set at"}, {"part": 7, "title": "Multimodal Inputs", "kind": "Article", "imgs": ["imgs/a43_0.jpg"], "html": "<p><strong>Multimodal Inputs: The Format You Upload Decides the Answer\nYou Get<\/strong><\/p>\n<p>AI tools now accept almost anything: Excel files, PDFs, screenshots,\nCSVs, photos, scanned documents. So people upload whatever they have to\nhand. Often that’s a screenshot of a spreadsheet, and the totals come\nback wrong.<\/p>\n<p>Format isn’t cosmetic. It decides how accurately the AI reads your\ndata, how much it can work with and how safely it’s handled.<\/p>\n<p><strong>Why format matters<\/strong><\/p>\n<p>Each format is read differently:<\/p>\n<ul>\n<li><p><strong>Excel or CSV:<\/strong> read as real rows, columns and\nvalues. The AI can calculate on them.<\/p><\/li>\n<li><p><strong>PDF:<\/strong> read as text and layout. Tables often come\nthrough broken, especially with merged cells or across pages.<\/p><\/li>\n<li><p><strong>Screenshot or photo:<\/strong> read visually, like a\nperson squinting at a picture. Every number is a guess that might be\nwrong.<\/p><\/li>\n<\/ul>\n<p><strong>Five rules for choosing the format<\/strong><\/p>\n<p><strong>1. Numbers? Upload the native file<\/strong><\/p>\n<p>For totals, trends or anything across many rows, upload the Excel or\nCSV, never a screenshot or PDF export. This is the single biggest driver\nof accuracy on data tasks.<\/p>\n<p><strong>2. Documents? Use the PDF<\/strong><\/p>\n<p>Reports, contracts, policies and slide-style content work well as\nPDFs. But if the data also exists as a spreadsheet, use that for the\nnumbers.<\/p>\n<p><strong>3. Screenshots? For context, not for figures<\/strong><\/p>\n<p>Great for “what’s wrong with this chart?” or “why does this screen\nshow an error?” Never the source for numbers that drive a decision.<\/p>\n<p><strong>4. Big flat tables? Use CSV<\/strong><\/p>\n<p>For large, simple datasets, CSV is lighter and strips out formatting\nnoise like merged cells and colours.<\/p>\n<p><strong>5. Match the format to the task, not to what’s on your\nscreen<\/strong><\/p>\n<p>If you only have a screenshot of a spreadsheet, spend the extra\nminute finding the real file. The accuracy gain is worth it.<\/p>\n<p><strong>Quick guide<\/strong><\/p>\n<ul>\n<li><p><strong>Calculate, compare, chart:<\/strong> Excel or CSV<\/p><\/li>\n<li><p><strong>Summarise, review, extract clauses:<\/strong> PDF or\nWord<\/p><\/li>\n<li><p><strong>Explain a chart, a UI or a photo:<\/strong> screenshot or\nimage<\/p><\/li>\n<li><p><strong>Voice notes and meetings:<\/strong> audio or a\ntranscript<\/p><\/li>\n<\/ul>\n<p><strong>Safety still applies<\/strong><\/p>\n<p>A screenshot can carry more than you meant to share: names, phone\nnumbers, other open tabs. Crop to what matters and check what’s visible\nbefore uploading. The same data rules apply whatever the format.<\/p>\n<p>“I’ve attached the Excel file. Use the ‘Sales_FY26’ sheet only.\nBefore analysing, tell me the columns you see and the number of rows, so\nI can confirm you read it correctly.”<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Take a recent analysis where you uploaded a screenshot or PDF of a\ntable. Run it again with the original Excel file and compare the\nnumbers. Any difference shows you how much the format was costing\nyou.<\/p>\n<p><strong>The rule:<\/strong> numbers go in as spreadsheets, documents\nas PDFs, and screenshots only for context. Match the format to the\ntask.<\/p>", "excerpt": "Multimodal Inputs: The Format You Upload Decides the Answer You Get AI tools now accept almost anything: Excel files, PDFs, screenshots, CSVs, photos, scanned d"}, {"part": 7, "title": "Why Everyone Should Learn Python", "kind": "Article", "imgs": ["imgs/a44_0.jpg"], "html": "<p><strong>Why Everyone Should Learn Python: It’s the New\nExcel<\/strong><\/p>\n<p>Twenty years ago, Excel was a specialist skill. Today nobody in a\nbusiness role gets by without it. Python is on the same path.<\/p>\n<p>You don’t need to become a software engineer. You need enough Python\nto read what AI writes for you, check it and change it with confidence.\nThat’s a literacy, not a career change.<\/p>\n<p><strong>Six reasons it matters now<\/strong><\/p>\n<p><strong>1. It’s the easiest way into coding<\/strong><\/p>\n<p>Python reads almost like English. “For each row in the sales file, if\nthe region is North, add the amount” is close to the actual code. Most\npeople can follow a simple script within a week.<\/p>\n<p><strong>2. It’s the language AI works in<\/strong><\/p>\n<p>Ask an AI to analyse a file, clean a dataset or build a forecast, and\nit usually writes Python behind the scenes. Knowing it means you can see\nwhat it actually did.<\/p>\n<p><strong>3. You can check the work<\/strong><\/p>\n<p>When an AI says “revenue grew 12%,” Python lets you see the\ncalculation: which rows it used, which it dropped, how it handled\nblanks. You stop trusting blindly and start checking.<\/p>\n<p><strong>4. It closes the gap between business and tech\nteams<\/strong><\/p>\n<p>A manager who can read a script can explain exactly what’s wrong,\ninstead of “the numbers look off.” Conversations with IT and analysts\nget faster and more precise.<\/p>\n<p><strong>5. It handles what Excel can’t<\/strong><\/p>\n<p>Millions of rows, dozens of files merged at once, the same report\nrebuilt every Monday automatically. Python does it in seconds.<\/p>\n<p><strong>6. It makes vibe coding safer<\/strong><\/p>\n<p>When you build tools with AI, a little Python lets you spot a wrong\nformula, a hard-coded number or data being sent somewhere it\nshouldn’t.<\/p>\n<p><strong>How much you actually need<\/strong><\/p>\n<ul>\n<li><p><strong>Read a script<\/strong> and explain what each part\ndoes<\/p><\/li>\n<li><p><strong>Change simple things:<\/strong> a file name, a column, a\nfilter<\/p><\/li>\n<li><p><strong>Run it<\/strong> in a notebook or online tool<\/p><\/li>\n<li><p><strong>Spot red flags:<\/strong> hard-coded passwords, unexpected\nweb addresses, deleted rows<\/p><\/li>\n<\/ul>\n<p>That’s it. You don’t need to write programs from scratch; the AI does\nthat.<\/p>\n<p><strong>How to start<\/strong><\/p>\n<p><strong>Week 1:<\/strong> ask AI to write a short script for a task\nyou already do in Excel, then ask it to explain every line.<\/p>\n<p><strong>Week 2:<\/strong> change one thing yourself (a filter, a\ncolumn) and run it again.<\/p>\n<p><strong>Week 3:<\/strong> ask AI to add comments and a check that\nprints row counts before and after each step.<\/p>\n<p>“Write a Python script that reads sales.xlsx, totals revenue by\nregion and month, and saves the result to a new file. Explain each line\nin plain English, and print the row count at each step so I can check\nnothing was lost.”<\/p>\n<p><strong>Try this<\/strong><\/p>\n<p>Pick one report you rebuild in Excel every week. Ask AI to write the\nPython version, run it once and compare the totals with your Excel\nversion. If they match, you’ve just automated a weekly task.<\/p>\n<p><strong>The rule:<\/strong> you don’t need to write Python. You need\nto read it well enough to trust, check and change what AI writes for\nyou.<\/p>", "excerpt": "Why Everyone Should Learn Python: It’s the New Excel Twenty years ago, Excel was a specialist skill. Today nobody in a business role gets by without it. Python "}, {"part": 7, "title": "Master Perplexity Research", "kind": "Article", "imgs": ["imgs/a45_0.jpg", "imgs/a45_1.jpg"], "html": "<p>Most people use Perplexity as a better Google. Type a question, read\nthe answer, move on. That covers about ten percent of what it does.<\/p>\n<p>The bigger use is different. Ask it to build a number, not find\none.<\/p>\n<p>Half of what an analyst needs was never published. Market size for a\nsegment you define your own way. What a competitor spends on something\nthey don't disclose. What a process costs at a company that never\nmeasured it.<\/p>\n<p>Most people stop there and guess privately. It is better to make the\ntool guess out loud, show its arithmetic, and rate its own\nconfidence.<\/p>\n<p>Twenty tips, with the prompt wording for each.<\/p>\n<p><strong>Getting numbers that were never published<\/strong><\/p>\n<p><strong>1. Ask for an estimate, not a fact.<\/strong><br />\nAsk a hard question and Perplexity often replies that the figure is not\npublicly available. That is a dead end. Tell it upfront that an estimate\nis acceptable and it will build one.<\/p>\n<p><strong>Prompt<\/strong><br />\nThe exact figure is likely not published. Do not tell me it is\nunavailable. Build the best possible estimate from adjacent public data,\nstate every assumption explicitly, and show the arithmetic.<\/p>\n<p><strong>2. Demand a confidence level on every number.<\/strong><br />\nAn estimate with no confidence marker looks exactly like a hard fact.\nThat is how weak numbers reach board decks.<\/p>\n<p><strong>Prompt<\/strong><br />\nFor each figure, tag it High, Medium or Low confidence, and give a\none-line reason for the grade. High = directly sourced. Medium = derived\nfrom sourced inputs. Low = inferred or analogous.<\/p>\n<p><strong>3. Ask for three independent approaches to the same\nnumber.<\/strong><br />\nTop-down, bottom-up, analogue. If all three land in the same range, you\ncan use the number. If they are far apart, the question is harder than\nyou assumed.<\/p>\n<p><strong>Prompt<\/strong><br />\nEstimate this three ways using independent methods — top-down from\nmarket size, bottom-up from unit economics, and by analogy to a\ncomparable market. Show each separately, then compare. Where they\ndisagree, explain why.<\/p>\n<p><strong>4. Ask for a range, not a single number.<\/strong><br />\nOne number implies a precision you do not have. A low case and a high\ncase, each with its logic, holds up better when questioned.<\/p>\n<p><strong>Prompt<\/strong><br />\nGive a plausible low, central and high case. For the low and high, state\nspecifically what would have to be true for that case to hold.<\/p>\n<p><strong>5. Ask for the closest real number available.<\/strong><br />\nYour exact metric may not exist, but something near it usually does. Get\nthat figure and the gap between it and what you asked for.<\/p>\n<p><strong>Prompt<\/strong><br />\nIf this exact metric is not published, tell me the closest figure that\nis actually reported, cite it, and explain precisely how it differs from\nwhat I asked for.<\/p>\n<p><strong>6. Give it your own number and ask it to\nreact.<\/strong><br />\nThe tool is better at checking a number than producing one from scratch.\nPut your assumption into the prompt.<\/p>\n<p><strong>Prompt<\/strong><br />\nMy working assumption is X. Assess whether that is plausible against\navailable evidence. If it is wrong, tell me the direction and rough\nmagnitude of the error.<\/p>\n<p><strong>7. Ask for the inputs and do the maths\nyourself.<\/strong><br />\nFor anything going to a client, source the inputs and run the\ncalculation yourself. You can then defend every step.<\/p>\n<p><strong>Prompt<\/strong><br />\nDo not calculate the final answer. Give me the three to five input\nvariables this depends on, the current sourced value and date for each,\nand the formula that connects them.<\/p>\n<p><strong>Controlling what it searches<\/strong><\/p>\n<p><strong>8. Use Academic mode when the claim must survive\nscrutiny.<\/strong> It limits results to peer-reviewed papers instead of\nblog posts and press releases. Use it when someone will ask where the\nnumber came from.<\/p>\n<p><strong>9. Use Social mode to find out what users actually\nsay.<\/strong> It pulls from Reddit and similar sites. This is the\nfastest way to learn how a software product performs after month three,\nrather than how the vendor describes it.<\/p>\n<p><strong>10. Restrict the source type in the prompt.<\/strong><br />\nPrimary documents contain numbers that never appear in articles.<\/p>\n<p><strong>Prompt<\/strong><br />\nRestrict yourself to primary sources — annual reports, regulatory\nfilings, investor presentations, earnings call transcripts and\ngovernment statistics. No news summaries, no aggregator sites, no vendor\nmarketing pages.<\/p>\n<p><strong>11. Set a recency floor.<\/strong><br />\nPerplexity will mix a 2019 figure with a 2026 figure and present both as\ncurrent.<\/p>\n<p><strong>Prompt<\/strong><br />\nPrioritise sources from the last 18 months. Label every figure with the\nyear it refers to, not the year it was published. Flag anything older\nthan three years explicitly.<\/p>\n<p><strong>12. Name the geography or you get US data.<\/strong><br />\nAsk a market question without naming a country and you get American\nfigures built on American assumptions. For Indian enterprise work, that\nerror runs through everything after it.<\/p>\n<p><strong>Prompt<\/strong><br />\nAnswer for India specifically. Where only global or US data exists, say\nso, and state whether the Indian figure is likely to be higher or lower\nand roughly why.<\/p>\n<p><strong>Structuring the answer<\/strong><\/p>\n<p><strong>13. Specify the format before you ask the\nquestion.<\/strong><br />\nOtherwise you spend your time converting prose into a table.<\/p>\n<p><strong>Prompt<\/strong><br />\nReturn this as a table with columns: Metric, Value, Year, Source,\nConfidence. One row per metric. No introduction or conclusion.<\/p>\n<p><strong>14. Cap the length.<\/strong><br />\nLeft alone, it writes five hundred words of background you did not ask\nfor.<\/p>\n<p><strong>Prompt<\/strong><br />\nMaximum 150 words. Lead with the answer. No preamble, no summary of what\nI asked.<\/p>\n<p><strong>15. Ask where the sources disagree.<\/strong><br />\nPerplexity blends everything it finds into one smooth answer. If two\ncredible sources give different numbers, that gap disappears. The gap is\noften the most useful thing you will learn.<\/p>\n<p><strong>Prompt<\/strong><br />\nWhere do credible sources disagree on this? Show the range of published\nestimates, identify who produced each, and explain what methodological\ndifference accounts for the spread.<\/p>\n<p><strong>16. Ask what would change the answer.<\/strong><br />\nThis turns a fixed number into something you can monitor.<\/p>\n<p><strong>Prompt<\/strong><br />\nList the three developments that would most change this conclusion over\nthe next twelve months, and what the leading indicator for each would\nbe.<\/p>\n<p><strong>Catching it when it is wrong<\/strong><\/p>\n<p><strong>17. Check the citations in a separate prompt.<\/strong><br />\nPerplexity rarely invents a source. The real problem is a genuine source\nthat does not actually say what the answer claims. Ask in a new thread,\nnot the same one.<\/p>\n<p><strong>Prompt<\/strong><br />\nFor each numbered claim above, quote the specific line from the cited\nsource that supports it. If no line directly supports the claim, mark it\nUnsupported.<\/p>\n<p><strong>18. Ask for the opposite case.<\/strong><br />\nSearch results favour whoever ranks highest, which is usually the vendor\nspending most on content. That bias carries straight into the\nanswer.<\/p>\n<p><strong>Prompt<\/strong><br />\nNow argue the opposite position using the strongest available evidence.\nWhat is the best case against what you just told me?<\/p>\n<p><strong>19. Use Model Council for decisions.<\/strong><br />\nIt runs one query through three frontier models at the same time and\nshows all three answers together, marking where they agree and where\nthey differ. If the three disagree, the question is genuinely unsettled\n— not just poorly researched.<\/p>\n<p><strong>20. Ask the same question again in a clean\nthread.<\/strong><br />\nA long thread picks up your framing and starts agreeing with you. If a\nnumber matters, ask it again from scratch, in different words, with no\nhistory. The same answer from two separate starting points is worth more\nthan ten follow-up questions in one conversation.<\/p>\n<p><strong>Two workflow habits<\/strong><\/p>\n<p>Use a Space for recurring work. Set your source rules and output\nformat once instead of retyping them. Anything you research monthly — a\nclient's competitors, a sector's regulatory changes — belongs there.<\/p>\n<p>Separate the two modes. Use fast search for questions that already\nhave an answer. Use Deep Research for questions where the answer has to\nbe built. Using the first for the second is why most people conclude the\ntool is shallow.<\/p>\n<p><strong>The point<\/strong><\/p>\n<p>Perplexity is not a source of truth. It is a fast research associate\nthat delivers exactly the standard you ask for and nothing more.<\/p>\n<p>Ask for a number and you get a number. Ask for a number, three ways\nof reaching it, a confidence grade, and the conditions that would make\nit wrong — and you get something you can defend in a room.<\/p>\n<p>Most people never set the standard.<\/p>", "excerpt": "Most people use Perplexity as a better Google. Type a question, read the answer, move on. That covers about ten percent of what it does. The bigger use is diffe"}, {"part": 8, "title": "AI Terms", "kind": "Article", "imgs": [], "html": "<div class=\"tw\"><table><thead><tr>\n<th><strong>Category<\/strong><\/th>\n<th><strong>Term<\/strong><\/th>\n<th><strong>Definition<\/strong><\/th>\n<th><strong>Relevance<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Foundational<\/td>\n<td>Artificial Intelligence (AI)<\/td>\n<td>Computer systems performing tasks that typically require human\nintelligence — reasoning, perception, language, decision-making.<\/td>\n<td>The umbrella term for the entire strategic conversation; sets scope\nfor board discussions and investment cases.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Machine Learning (ML)<\/td>\n<td>A subset of AI where systems learn patterns from data rather than\nfollowing explicit programmed rules.<\/td>\n<td>Most enterprise \"AI\" initiatives are actually ML; understanding this\nhelps set realistic expectations on data needs.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Deep Learning<\/td>\n<td>A type of ML using multi-layered neural networks, effective at\ncomplex pattern recognition (images, speech, text).<\/td>\n<td>Powers most modern breakthroughs; explains why compute and data\nvolume drive cost and capability.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Neural Network<\/td>\n<td>A model architecture loosely inspired by the brain, made of layers\nof interconnected nodes that process data.<\/td>\n<td>Underlying structure of nearly all modern AI; useful for\ninterpreting vendor technical claims.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Generative AI (GenAI)<\/td>\n<td>AI that creates new content — text, images, code, audio — rather\nthan just classifying or predicting.<\/td>\n<td>The category behind ChatGPT, Claude, etc.; the primary driver of\ncurrent enterprise AI investment.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Large Language Model (LLM)<\/td>\n<td>A GenAI model trained on vast text data to understand and generate\nhuman language.<\/td>\n<td>The engine behind most GenAI products; underpins build-vs-buy\ndecisions for AI tools.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Small Language Model (SLM)<\/td>\n<td>A compact, lower-parameter language model optimized for efficiency,\nspeed, and on-device or low-cost use.<\/td>\n<td>Enables cheaper, faster, more private deployments for narrow tasks —\nrelevant for cost-sensitive scale-ups.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Algorithm<\/td>\n<td>A set of rules or steps a computer follows to solve a problem or\ncomplete a task.<\/td>\n<td>Basic vocabulary needed to engage credibly with technical teams and\nvendors.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Model<\/td>\n<td>The trained system that makes predictions or generates outputs,\nproduced by running an algorithm on data.<\/td>\n<td>The \"product\" of AI development; distinguishing \"the model\" from\n\"the app\" clarifies vendor conversations.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Weights / Parameters<\/td>\n<td>The internal numerical values a model adjusts during training to\nencode learned patterns.<\/td>\n<td>Roughly correlates with model scale and cost; \"billions of\nparameters\" is a common vendor sizing metric.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Inference<\/td>\n<td>The process of a trained model generating an output for a new input\n(as opposed to training).<\/td>\n<td>The ongoing, recurring cost of running AI in production — distinct\nfrom one-time training cost, matters for budgeting.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Natural Language Processing (NLP)<\/td>\n<td>The field of AI focused on enabling computers to understand,\ninterpret, and generate human language.<\/td>\n<td>The technical foundation behind chatbots, document analysis, and\ntext-based automation tools.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Computer Vision<\/td>\n<td>The field of AI focused on enabling machines to interpret and\nprocess visual information from images or video.<\/td>\n<td>Powers use cases like quality inspection, safety monitoring, and\ndocument scanning in manufacturing/retail.<\/td>\n<\/tr><tr>\n<td>Foundational<\/td>\n<td>Transformer Architecture<\/td>\n<td>A neural network design that processes entire sequences of data at\nonce using \"attention,\" enabling modern LLMs.<\/td>\n<td>The technical breakthrough behind the current AI boom; useful\ncontext for why LLMs improved so rapidly since 2017.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Training Data<\/td>\n<td>The dataset used to teach a model patterns and relationships.<\/td>\n<td>Data quality and ownership are competitive assets; \"garbage in,\ngarbage out\" applies directly to ROI.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Fine-Tuning<\/td>\n<td>Further training a general-purpose model on a smaller,\ndomain-specific dataset to specialize it.<\/td>\n<td>Key lever for customizing AI to your industry/company without\nbuilding a model from scratch — faster, cheaper than full\ndevelopment.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Prompt Engineering<\/td>\n<td>Crafting inputs (prompts) to guide an AI model toward better, more\nuseful outputs.<\/td>\n<td>Low-cost, high-leverage skill; often the fastest path to value from\nexisting tools, worth investing in workforce training.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>RAG (Retrieval-Augmented Generation)<\/td>\n<td>A technique where a model retrieves relevant company/external data\nbefore generating a response, improving accuracy.<\/td>\n<td>Central to enterprise GenAI deployments — lets AI answer using your\nproprietary documents securely, without retraining.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Hallucination<\/td>\n<td>When an AI model generates plausible-sounding but factually\nincorrect or fabricated information.<\/td>\n<td>The single biggest reputational and operational risk in GenAI\ndeployment; drives the need for human-in-the-loop review.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Context Window<\/td>\n<td>The amount of text/information a model can \"see\" and consider at\nonce when generating a response.<\/td>\n<td>Determines how much company data (documents, chat history) a tool\ncan process in one interaction — a practical capability constraint.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Token<\/td>\n<td>A chunk of text (roughly a word or part of a word) that models\nprocess; usage is often billed per token.<\/td>\n<td>Directly tied to API and licensing costs; relevant to budgeting and\nvendor negotiations.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Multimodal AI<\/td>\n<td>Models that can process and generate multiple content types — text,\nimages, audio, video — together.<\/td>\n<td>Expands use cases beyond text (e.g., analyzing scanned documents,\nvideo, or design mockups), widening the addressable business problem\nset.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Embedding<\/td>\n<td>A numerical representation of text/data that captures meaning,\nallowing similarity comparisons between items.<\/td>\n<td>Powers search, recommendations, and RAG systems; helps explain how\nAI \"understands\" unstructured company data.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Vector Database<\/td>\n<td>A specialized database that stores embeddings for fast similarity\nsearch.<\/td>\n<td>Common infrastructure component in enterprise AI stacks; relevant\nwhen evaluating technical architecture proposals.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Reinforcement Learning from Human Feedback (RLHF)<\/td>\n<td>A training method where human ratings of model outputs are used to\nrefine model behavior.<\/td>\n<td>Explains why newer models feel more \"aligned\" and helpful; relevant\nto vendor claims about safety and quality.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Zero-shot / Few-shot Learning<\/td>\n<td>A model's ability to perform a task with no examples (zero-shot) or\njust a few examples (few-shot) provided in the prompt.<\/td>\n<td>Reduces the need for costly custom training; affects how quickly a\ntool can be adapted to a new task.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Chain-of-Thought Reasoning<\/td>\n<td>A technique where a model breaks a problem into intermediate steps\nbefore producing a final answer.<\/td>\n<td>Improves accuracy on complex tasks; explains why some \"reasoning\"\nmodels are slower but more reliable.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Synthetic Data<\/td>\n<td>Artificially generated data used to train or supplement AI models\nwhen real data is scarce or sensitive.<\/td>\n<td>Reduces privacy risk and data-scarcity constraints in regulated or\ndata-poor environments.<\/td>\n<\/tr><tr>\n<td>Development<\/td>\n<td>Model Distillation<\/td>\n<td>Compressing a large, expensive model into a smaller, cheaper one\nwhile retaining most of its capability.<\/td>\n<td>A key cost-reduction strategy for deploying AI at scale without\nsacrificing much performance.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>AI Agent<\/td>\n<td>An AI system that can autonomously plan and execute multi-step\ntasks, often using tools or software on a user's behalf.<\/td>\n<td>The next wave beyond chatbots — agents can complete workflows\n(booking, research, coding), shifting AI from \"assistant\" to\n\"worker.\"<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>API (Application Programming Interface)<\/td>\n<td>A technical interface allowing one software system to send requests\nto and receive data from another.<\/td>\n<td>The standard way companies integrate AI models into existing\ntools/systems; central to build-vs-buy technical conversations.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>MCP (Model Context Protocol)<\/td>\n<td>An emerging standard letting AI models securely connect to external\ntools, data sources, and apps.<\/td>\n<td>Reduces integration cost and vendor lock-in; relevant when\nevaluating platform strategy and interoperability.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Automation vs. Augmentation<\/td>\n<td>Automation replaces a task entirely; augmentation enhances human\nperformance on a task.<\/td>\n<td>Frames the workforce conversation — most near-term enterprise AI\nvalue comes from augmentation, not replacement.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Copilot<\/td>\n<td>An AI assistant embedded within existing software (e.g., email,\nspreadsheets) to support a user in real time.<\/td>\n<td>The dominant enterprise adoption pattern — lower change-management\nburden than standalone AI tools.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Model as a Service (MaaS)<\/td>\n<td>Accessing AI models via subscription/API rather than owning the\nunderlying infrastructure.<\/td>\n<td>The default enterprise consumption model; affects cost structure\n(opex vs. capex) and speed to deployment.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Chatbot vs. Agentic AI<\/td>\n<td>A chatbot responds conversationally; agentic AI takes independent\naction across multiple steps or systems.<\/td>\n<td>Marketing language often blurs this distinction; important for\naccurately scoping vendor capability claims.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Orchestration<\/td>\n<td>Coordinating multiple AI models, tools, or agents to complete a\ncomplex, multi-part task.<\/td>\n<td>Increasingly the differentiator between basic AI tools and\nenterprise-grade AI systems.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Latency<\/td>\n<td>The time delay between a request to an AI system and receiving its\nresponse.<\/td>\n<td>Affects user experience and viability for real-time use cases like\ncustomer service or trading.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Sandbox Environment<\/td>\n<td>An isolated testing environment where AI tools can be trialed safely\nwithout affecting live systems or data.<\/td>\n<td>Standard best practice for piloting new AI tools before\nenterprise-wide rollout.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Integration Layer / Middleware<\/td>\n<td>Software that connects AI models to existing enterprise systems\n(ERP, CRM, data warehouses).<\/td>\n<td>Often the largest hidden cost in AI projects — the model is rarely\nthe hard part, integration is.<\/td>\n<\/tr><tr>\n<td>Deployment<\/td>\n<td>Legacy System Compatibility<\/td>\n<td>The degree to which existing older IT infrastructure can support or\nintegrate with new AI tools.<\/td>\n<td>A common blocker in traditional industries (manufacturing, cement,\ntextiles); shapes realistic implementation timelines.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>AI Bias<\/td>\n<td>Systematic errors in AI outputs that unfairly favor or disadvantage\nparticular groups, often inherited from training data.<\/td>\n<td>Legal, reputational, and regulatory exposure; requires explicit\ngovernance in hiring, lending, and customer-facing use cases.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Explainability / Interpretability<\/td>\n<td>The degree to which humans can understand why an AI model produced a\ngiven output.<\/td>\n<td>Critical in regulated industries (finance, healthcare) where\ndecisions must be auditable and defensible.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Data Privacy<\/td>\n<td>Protections governing how personal or sensitive data is collected,\nused, and stored by AI systems.<\/td>\n<td>Governs vendor contracts, especially around whether client data is\nused to train third-party models.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>AI Governance<\/td>\n<td>The policies, roles, and controls an organization puts in place to\nmanage AI risk and ensure responsible use.<\/td>\n<td>Board-level responsibility increasingly expected by regulators and\ninvestors; foundational to scaling AI safely.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Shadow AI<\/td>\n<td>Unsanctioned use of AI tools by employees outside approved, governed\nchannels.<\/td>\n<td>A near-universal, underestimated risk; drives the urgency of clear\nusage policy and approved-tool lists.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Guardrails<\/td>\n<td>Technical and policy controls that constrain what an AI system can\nsay or do.<\/td>\n<td>The practical mechanism for translating governance policy into\ndeployed system behavior.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Human-in-the-Loop<\/td>\n<td>A design principle requiring human review or approval at key points\nin an AI-driven process.<\/td>\n<td>The primary risk mitigation for high-stakes decisions (legal,\nmedical, financial); a standard board expectation.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Data Residency / Sovereignty<\/td>\n<td>Legal requirements dictating where data is physically stored and\nprocessed, often by country or region.<\/td>\n<td>Directly relevant for Middle East/India operations with cross-border\ndata regulations; a common vendor due-diligence item.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Model Drift<\/td>\n<td>The gradual degradation of a model's accuracy over time as\nreal-world data diverges from its training data.<\/td>\n<td>Justifies ongoing monitoring budgets — AI systems are not \"set and\nforget.\"<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Responsible AI<\/td>\n<td>An organizational commitment to fairness, transparency, safety, and\naccountability in AI deployment.<\/td>\n<td>Increasingly a procurement and brand-trust requirement, not just an\nethics exercise.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>IP / Copyright Risk<\/td>\n<td>Legal uncertainty around ownership of AI-generated content and use\nof copyrighted material in training data.<\/td>\n<td>Directly affects usage policy for AI-generated marketing, code, and\nclient deliverables.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Model Card<\/td>\n<td>A standardized document describing a model's capabilities,\nlimitations, training data, and intended use.<\/td>\n<td>A useful due-diligence artifact when evaluating and comparing AI\nvendors.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Red Teaming<\/td>\n<td>Deliberately probing an AI system for weaknesses, biases, or failure\nmodes before deployment.<\/td>\n<td>A recognized best practice for de-risking AI systems ahead of\nenterprise-wide rollout.<\/td>\n<\/tr><tr>\n<td>Governance<\/td>\n<td>Regulatory Compliance (AI-specific)<\/td>\n<td>Adherence to emerging laws governing AI use (e.g., EU AI Act,\nsector-specific rules).<\/td>\n<td>An evolving compliance landscape that legal and risk teams must\ntrack alongside standard data regulation.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Foundation Model<\/td>\n<td>A large, general-purpose model (e.g., GPT, Claude, Gemini) trained\non broad data, adaptable to many downstream tasks.<\/td>\n<td>Underlies build-vs-buy strategy — few companies build these; most\nbuild on top of them.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Open Source vs. Closed/Proprietary Models<\/td>\n<td>Open models have publicly available code/weights; closed models are\naccessed only via a vendor's paid interface.<\/td>\n<td>Shapes cost, control, and customization trade-offs — open models\noffer flexibility, closed models offer support and reliability.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Compute<\/td>\n<td>The processing power (typically specialized chips like GPUs)\nrequired to train and run AI models.<\/td>\n<td>The primary cost driver and supply-chain bottleneck in AI; relevant\nto infrastructure and cloud vendor strategy.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AI Maturity Model<\/td>\n<td>A framework assessing an organization's AI capability across stages,\nfrom ad hoc experimentation to full integration.<\/td>\n<td>Useful diagnostic for benchmarking your organization's AI adoption\nstage and setting a realistic roadmap.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Total Cost of Ownership (TCO) for AI<\/td>\n<td>The full cost of an AI initiative, including licensing, integration,\nchange management, and ongoing monitoring — not just the tool\nprice.<\/td>\n<td>Prevents u
