ebastianraschka.com/\">https://magazine.sebastianraschka.com/<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://bytebytego.com/\">https://bytebytego.com/<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://thenewstack.io/\">https://thenewstack.io/<\/a><\/p>\n<p><a\nhref=\"https://linas.substack.com/\">https://linas.substack.com/<\/a><\/p>\n<p><strong>YouTube Channels<\/strong><\/p>\n<p><a\nhref=\"https://www.youtube.com/@AgenticAI-Foundation\">https://www.youtube.com/@AgenticAI-Foundation<\/a><\/p>\n<p><a\nhref=\"https://www.xda-developers.com/\">https://www.xda-developers.com/<\/a><\/p>\n<p><a\nhref=\"https://www.youtube.com/ibmtechnology\">https://www.youtube.com/ibmtechnology<\/a><\/p>\n<p><a\nhref=\"https://www.youtube.com/@AndrejKarpathy\">https://www.youtube.com/@AndrejKarpathy<\/a><\/p>\n<p><a\nhref=\"https://www.youtube.com/@aiDotEngineer\">https://www.youtube.com/@aiDotEngineer<\/a><\/p>\n<p><a\nhref=\"https://www.youtube.com/@theAIsearch\">https://www.youtube.com/@theAIsearch<\/a><\/p>\n<p><strong>Newsletters<\/strong><\/p>\n<p><a\nhref=\"https://www.newsletter.theintelligentworker.com/\">https://www.newsletter.theintelligentworker.com/<\/a><\/p>\n<p><a\nhref=\"https://www.theneurondaily.com/\">https://www.theneurondaily.com/<\/a><\/p>\n<p><a\nhref=\"https://www.therundown.ai/\">https://www.therundown.ai/<\/a><\/p>\n<p><strong><br />\n<\/strong><\/p>", "excerpt": "Websites https://ruben.substack.com/ https://venturebeat.com/ https://www.xda-developers.com/ https://menlovc.com/ https://lifearchitect.ai/about-alan/ https://"}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const A=D.articles;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=(t,i)=>'a'+i+'-'+t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
A.forEach((a,i)=>a.id=slug(a.title,i));
const nImg=A.filter(a=>a.imgs.length).length;
document.getElementById('sub').textContent=`${A.length} articles across ${D.parts.length} parts · ${nImg} with infographics`;
let filter='all';
const lib=document.getElementById('lib');
function partLabel(p){const m=p.match(/^(Part \d+)\s*[—–-]\s*(.*)$/);return m?[m[1],m[2]]:['',p]}
function render(){
  lib.innerHTML=D.parts.map((p,pi)=>{
    const items=A.map((a,i)=>[a,i]).filter(([a])=>a.part===pi&&(filter==='all'||(filter==='img'?a.imgs.length:!a.imgs.length)));
    if(!items.length)return'';
    const [pn,pt]=partLabel(p);
    return `<section><div class="ph"><span class="pn">${pn}</span><h2>${esc(pt)}</h2></div><div class="grid">${items.map(([a,i])=>{
      const th=a.imgs.length?`<img src="${a.imgs[0].replace('.jpg','_t.jpg')}" alt="" loading="lazy">${a.imgs.length>1?`<span class="badge">${a.imgs.length} infographics</span>`:''}`
        :`<div class="txt"><div class="q">${esc(a.title)}</div><div class="ex">${esc(a.excerpt)}…</div></div>`;
      const meta=a.imgs.length?'Infographic + article':'Article';
      return `<button class="card" data-i="${i}" id="c-${a.id}"><div class="thumb">${th}</div><div class="ct">${esc(a.title)}</div><div class="cm">${a.kind==='Framework'?'HMC framework · ':''}${meta}</div></button>`}).join('')}</div></section>`;
  }).join('');
}
render();
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
lib.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)open(+c.dataset.i)});

const ov=document.getElementById('ov'),mb=document.getElementById('mb');
let cur=-1,lastFocus=null;
function open(i,fromHash){
  if(cur<0)lastFocus=document.activeElement;
  cur=(i+A.length)%A.length;const a=A[cur];
  document.getElementById('mp').textContent=partLabel(D.parts[a.part]).join(' · ');
  document.getElementById('mt').textContent=a.title;
  mb.className='mb'+(a.imgs.length?'':' solo');
  mb.innerHTML=(a.imgs.length?`<div class="pics">${a.imgs.map(s=>`<a href="${s}" target="_blank" rel="noopener" title="Open full size"><img src="${s}" alt="${esc(a.title)} infographic"></a>`).join('')}</div>`:'')
    +`<div class="art"><div>${a.html}</div></div>`;
  mb.scrollTop=0;mb.querySelectorAll('.pics,.art').forEach(el=>el.scrollTop=0);
  ov.hidden=false;document.body.classList.add('lock');
  if(!fromHash&&location.hash!=='#'+a.id)history.replaceState(null,'','#'+a.id);
  document.getElementById('close').focus();
}
function close(){ov.hidden=true;document.body.classList.remove('lock');cur=-1;
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  if(lastFocus)lastFocus.focus()}
document.getElementById('close').onclick=close;
document.getElementById('prev').onclick=()=>open(cur-1);
document.getElementById('next').onclick=()=>open(cur+1);
ov.addEventListener('click',e=>{if(e.target===ov)close()});
document.addEventListener('keydown',e=>{if(ov.hidden)return;
  if(e.key==='Escape')close();else if(e.key==='ArrowRight')open(cur+1);else if(e.key==='ArrowLeft')open(cur-1)});
function fromHash(){const h=location.hash.slice(1);const i=A.findIndex(a=>a.id===h);if(i>=0)open(i,true);else if(!ov.hidden)close()}
window.addEventListener('hashchange',fromHash);fromHash();
</script>
