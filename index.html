nderestimating AI project budgets; licensing is often the\nsmallest line item.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Change Management (for AI)<\/td>\n<td>The structured process of managing workforce adoption, training, and\ncultural shift around new AI tools.<\/td>\n<td>The most common point of AI initiative failure is not the technology\n— it's adoption; this is where leadership attention has highest\nROI.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Digital Twin<\/td>\n<td>A virtual, data-driven replica of a physical asset, process, or\nsystem used for simulation and forecasting.<\/td>\n<td>Common in manufacturing/energy for predictive maintenance and\nscenario planning — a tangible, high-ROI AI use case.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Center of Excellence (CoE)<\/td>\n<td>A dedicated internal team responsible for driving AI strategy,\nstandards, and capability-building across an organization.<\/td>\n<td>A common structural choice for scaling AI beyond isolated pilots\ninto enterprise-wide impact.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Proof of Concept (PoC) vs. Production<\/td>\n<td>A PoC tests feasibility on a small scale; production deployment\noperates at full scale with real users and stakes.<\/td>\n<td>Explains why many \"successful\" AI pilots never scale — production\nrequires different rigor, cost, and governance.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AI Use Case Prioritization<\/td>\n<td>The structured process of ranking potential AI applications by\nbusiness value versus implementation feasibility.<\/td>\n<td>Prevents scattershot experimentation; ensures AI investment targets\nhighest-impact business problems first.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Build vs. Buy vs. Partner<\/td>\n<td>The strategic decision of whether to develop AI in-house, purchase\nexisting tools, or partner with vendors/providers.<\/td>\n<td>The core strategic decision framework for nearly every AI\ninitiative; balances cost, control, and speed.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Vendor Lock-in<\/td>\n<td>Dependency on a single AI provider's technology, making it costly or\ndifficult to switch providers later.<\/td>\n<td>A key risk factor in long-term contract negotiations and platform\narchitecture decisions.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AGI (Artificial General Intelligence)<\/td>\n<td>A hypothetical future AI with human-level reasoning and adaptability\nacross any intellectual task, not yet achieved.<\/td>\n<td>Distinguishes today's practical AI capability from speculative\nlong-term scenarios — useful for grounding realistic strategy\ndiscussions.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AI ROI Measurement<\/td>\n<td>Frameworks for quantifying the business value generated by AI\ninitiatives against their cost.<\/td>\n<td>A frequent board-level question; hard to answer without pre-defined\nbaseline metrics before deployment.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Workforce Reskilling<\/td>\n<td>Structured training programs to build employee capability in working\nalongside AI tools.<\/td>\n<td>Determines whether AI investment translates into actual productivity\ngains rather than idle licenses.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>AI Adoption Curve<\/td>\n<td>The pattern by which employees or organizations move from awareness\nto experimentation to embedded daily use.<\/td>\n<td>Helps leaders set realistic timelines and identify where an\norganization is stalling in the adoption journey.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Composable AI Stack<\/td>\n<td>An architecture built from interchangeable AI components (models,\ndata layers, tools) rather than one monolithic system.<\/td>\n<td>Supports flexibility and reduces vendor lock-in as the AI landscape\nevolves quickly.<\/td>\n<\/tr><tr>\n<td>Strategy<\/td>\n<td>Data Moat<\/td>\n<td>A durable competitive advantage derived from proprietary data that\ncompetitors cannot easily replicate or access.<\/td>\n<td>A key lens for identifying where AI can create defensible, long-term\ndifferentiation rather than easily copied features.<\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "Category Term Definition Relevance Foundational Artificial Intelligence (AI) Computer systems performing tasks that typically require human intelligence — reaso"}, {"part": 8, "title": "Tool Guide for Marketing", "kind": "Article", "imgs": [], "html": "<div class=\"tw\"><table><thead><tr>\n<th><strong><br />\n<br />\nContent Type<\/strong><\/th>\n<th><strong>Tool<\/strong><\/th>\n<th><strong>Best For<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Images<\/td>\n<td>Midjourney<\/td>\n<td>High-aesthetic, stylized visuals; concept art, campaign key\nvisuals<\/td>\n<\/tr><tr>\n<td>Images<\/td>\n<td>Adobe Firefly<\/td>\n<td>Commercially-safe images, brand-embedded workflows\n(Photoshop/Illustrator integration)<\/td>\n<\/tr><tr>\n<td>Images<\/td>\n<td>Canva (Magic Media)<\/td>\n<td>Quick social graphics, templated brand assets, non-designers<\/td>\n<\/tr><tr>\n<td>Images<\/td>\n<td>Ideogram<\/td>\n<td>Text-in-image accuracy (posters, logos, typography-heavy\ncreatives)<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Higgsfield<\/td>\n<td>Cinematic ad videos with real camera control, character consistency\n(Soul ID), URL-to-ad generation<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Runway (Gen-4)<\/td>\n<td>Fine-grained video editing, VFX, motion control for polished\nshort-form<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Sora 2 / Veo 3.1<\/td>\n<td>High-fidelity, realistic text-to-video generation<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Kling 3.0<\/td>\n<td>Competitive alternative for cinematic motion at lower credit\ncost<\/td>\n<\/tr><tr>\n<td>Video<\/td>\n<td>Canva<\/td>\n<td>Fast templated video edits, captions, quick social cuts<\/td>\n<\/tr><tr>\n<td>Audio<\/td>\n<td>ElevenLabs<\/td>\n<td>Voiceovers, multilingual dubbing, custom voice cloning<\/td>\n<\/tr><tr>\n<td>Audio<\/td>\n<td>Suno<\/td>\n<td>Full AI-generated music tracks/jingles for ad backgrounds<\/td>\n<\/tr><tr>\n<td>Audio<\/td>\n<td>Adobe Podcast<\/td>\n<td>Cleaning up/enhancing recorded voice audio<\/td>\n<\/tr><tr>\n<td>3D Models<\/td>\n<td>Luma AI (Genie)<\/td>\n<td>Text-to-3D asset generation for product/AR previews<\/td>\n<\/tr><tr>\n<td>3D Models<\/td>\n<td>Spline AI<\/td>\n<td>Interactive 3D web assets, landing page visuals<\/td>\n<\/tr><tr>\n<td>3D Models<\/td>\n<td>Meshy<\/td>\n<td>3D models for game/product prototyping<\/td>\n<\/tr><tr>\n<td>Multi-format<\/td>\n<td>Canva<\/td>\n<td>Brand-consistent images, simple video, presentations in one\nplace<\/td>\n<\/tr><tr>\n<td>Multi-format<\/td>\n<td>Higgsfield<\/td>\n<td>Marketing Studio: video + image + character assets in one\nworkspace<\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "Content Type Tool Best For Images Midjourney High-aesthetic, stylized visuals; concept art, campaign key visuals Images Adobe Firefly Commercially-safe images, "}, {"part": 8, "title": "Tool Guide", "kind": "Article", "imgs": [], "html": "<div class=\"tw\"><table><thead><tr>\n<th><strong>Tool<\/strong><\/th>\n<th><strong>Best For<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td><strong>Microsoft Copilot<\/strong><\/td>\n<td>Safe, enterprise-approved AI — deep M365 integration, good default\nfor regulated orgs<\/td>\n<\/tr><tr>\n<td><strong>Claude<\/strong><\/td>\n<td>Enterprise workflows — integrates with Chrome, Excel, PowerPoint;\nstrong reasoning, long documents<\/td>\n<\/tr><tr>\n<td><strong>Google Gemini<\/strong><\/td>\n<td>General-purpose assistant — deep Google Workspace integration,\nstrong multimodal (image, video, audio) input<\/td>\n<\/tr><tr>\n<td><strong>Google AI Studio<\/strong><\/td>\n<td>Prototyping — testing Gemini models, quick app scaffolding<\/td>\n<\/tr><tr>\n<td><strong>Perplexity<\/strong><\/td>\n<td>Research — citations, live web search, document Q&amp;A; also\nsurfaces Chinese models (DeepSeek etc.) well<\/td>\n<\/tr><tr>\n<td><strong>NotebookLM<\/strong><\/td>\n<td>Source-grounded research — upload your own documents, get answers\ntied to those sources; audio overviews for briefings<\/td>\n<\/tr><tr>\n<td><strong>Hugging Face<\/strong><\/td>\n<td>Open model discovery — browsing, comparing and evaluating\nopen-source models and datasets<\/td>\n<\/tr><tr>\n<td><strong>Ollama<\/strong><\/td>\n<td>Running open-source LLMs locally — full privacy, no API cost,\noffline use, good for sensitive data you can't send to the cloud<\/td>\n<\/tr><tr>\n<td><strong>LM Studio<\/strong><\/td>\n<td>Same local-LLM space as Ollama, but with a friendlier GUI — easier\nmodel browsing/switching, better for non-technical experimentation on\nyour own machine<\/td>\n<\/tr><tr>\n<td><strong>Gamma<\/strong><\/td>\n<td>Decks — prompt-to-presentation, faster than PowerPoint for internal\nand training material<\/td>\n<\/tr><tr>\n<td><strong>Google Stitch<\/strong><\/td>\n<td>Wireframing — fast UI/UX mockups from prompts<\/td>\n<\/tr><tr>\n<td><strong>Synthesia<\/strong><\/td>\n<td>Video — AI avatars, corporate training/explainer videos<\/td>\n<\/tr><tr>\n<td><strong>ElevenLabs<\/strong><\/td>\n<td>Audio — voice cloning, narration, realistic TTS<\/td>\n<\/tr><tr>\n<td><strong>Wispr Flow<\/strong><\/td>\n<td>Dictation (Speech to Text)<\/td>\n<\/tr><tr>\n<td><strong>Granola / Fireflies / Otter / Read AI<\/strong><\/td>\n<td>Meeting intelligence — automatic notes, summaries, action items, CRM\nsync<\/td>\n<\/tr><tr>\n<td><strong>n8n / Make / Zapier<\/strong><\/td>\n<td>Workflow automation — connecting AI to business systems without\ncode<\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "Tool Best For Microsoft Copilot Safe, enterprise-approved AI — deep M365 integration, good default for regulated orgs Claude Enterprise workflows — integrates w"}, {"part": 8, "title": "People to Follow", "kind": "Article", "imgs": [], "html": "<div class=\"tw\"><table><thead><tr>\n<th><strong>Name<\/strong><\/th>\n<th><strong>Best Known For<\/strong><\/th>\n<th><strong>Why Leaders Should Follow<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Allie K. Miller<\/td>\n<td>AI advisor, ex-Amazon/IBM<\/td>\n<td>Named AI Innovator of the Year, with daily content on AI strategy,\ngovernance, and implementation for enterprises grounded in real\noperational experience<\/td>\n<\/tr><tr>\n<td>Andrej Karpathy<\/td>\n<td>Independent researcher, ex-Tesla/OpenAI<\/td>\n<td>Deep technical expertise with clear communication; cautions that AI\nagents should be \"kept on a leash\" rather than left unsupervised<\/td>\n<\/tr><tr>\n<td>Andrew Ng<\/td>\n<td>Educator, founder of DeepLearning.AI, \"The Batch\" newsletter<\/td>\n<td>Practical, hands-on approach to AI adoption widely followed by\nbusiness audiences, not just technologists<\/td>\n<\/tr><tr>\n<td>Cassie Kozyrkov<\/td>\n<td>Former Chief Decision Scientist, Google<\/td>\n<td>Decision-science framing of AI — useful for governance and judgment\nquestions<\/td>\n<\/tr><tr>\n<td>Dario Amodei<\/td>\n<td>CEO, Anthropic<\/td>\n<td>Deep credibility and insight into what AI companies believe about\nsafety, deployment, and enterprise risk<\/td>\n<\/tr><tr>\n<td>Demis Hassabis<\/td>\n<td>CEO, Google DeepMind<\/td>\n<td>Founder-level perspective from one of the frontier labs, shaping\nwhere model capability is headed<\/td>\n<\/tr><tr>\n<td>Emad Mostaque<\/td>\n<td>Founder, Stability AI<\/td>\n<td>Vocal advocate for open, decentralised AI development as an\nalternative to closed, corporate-controlled AI systems<\/td>\n<\/tr><tr>\n<td>Ethan Mollick<\/td>\n<td>Wharton professor, \"One Useful Thing\" Substack<\/td>\n<td>One of the most cited voices for translating AI capability into real\nworkplace use cases<\/td>\n<\/tr><tr>\n<td>Fei-Fei Li<\/td>\n<td>Co-Director, Stanford HAI<\/td>\n<td>Prioritizes responsible AI over sensationalism; strong voice on\nhuman-centered design<\/td>\n<\/tr><tr>\n<td>Kai-Fu Lee<\/td>\n<td>Chairman/CEO, Sinovation Ventures; author, AI Superpowers<\/td>\n<td>Bridge voice between Western and Chinese AI development, uniquely\npositioned as both practitioner and investor amid intensifying AI\ngeopolitics<\/td>\n<\/tr><tr>\n<td>Paul Roetzer<\/td>\n<td>Founder, Marketing AI Institute<\/td>\n<td>Translates frontier AI developments into actionable business\nguidance without oversimplifying, including case studies on mandatory\nenterprise AI adoption<\/td>\n<\/tr><tr>\n<td>Sam Altman<\/td>\n<td>CEO, OpenAI<\/td>\n<td>Company founder shaping the commercial and product direction of the\nindustry<\/td>\n<\/tr><tr>\n<td>Satya Nadella<\/td>\n<td>CEO, Microsoft<\/td>\n<td>\"AI for everyone\" vision and massive infrastructure investment have\nmade Microsoft a dominant force in enterprise AI adoption<\/td>\n<\/tr><tr>\n<td>Sundar Pichai<\/td>\n<td>CEO, Alphabet/Google<\/td>\n<td>Leads one of the world's largest AI research organisations, driving\nthe Gemini model family<\/td>\n<\/tr><tr>\n<td>Yann LeCun<\/td>\n<td>AI researcher, formerly Chief AI Scientist at Meta<\/td>\n<td>One of the most influential foundational researchers in the\nfield<\/td>\n<\/tr><tr>\n<td>Yoshua Bengio<\/td>\n<td>Turing Award laureate, AI safety researcher<\/td>\n<td>Operates at the cutting edge of technical research; leading voice on\nAI safety<\/td>\n<\/tr><\/tbody><\/table><\/div>", "excerpt": "Name Best Known For Why Leaders Should Follow Allie K. Miller AI advisor, ex-Amazon/IBM Named AI Innovator of the Year, with daily content on AI strategy, gover"}, {"part": 8, "title": "Links", "kind": "Article", "imgs": [], "html": "<p><strong>Websites<\/strong><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://ruben.substack.com/\">https://ruben.substack.com/<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://venturebeat.com/\">https://venturebeat.com/<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.xda-developers.com/\">https://www.xda-developers.com/<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://menlovc.com/\">h <script>
const D=JSON.parse(document.getElementById('data').textContent);
const A=D.articles;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=(t,i)=>'a'+i+'-'+t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
A.forEach((a,i)=>a.id=slug(a.title,i));
const nImg=A.filter(a=>a.imgs.length).length;
document.getElementById('sub').textContent=`${A.length} articles across ${D.parts.filter(p=>/^Part /.test(p)).length} parts · ${nImg} with infographics`;
let filter='all';
const lib=document.getElementById('lib');
function partLabel(p){const m=p.match(/^(Part \d+)\s*[—–-]\s*(.*)$/);return m?[m[1],m[2]]:['',p]}
function render(){
  lib.innerHTML=D.parts.map((p,pi)=>{
    const items=A.map((a,i)=>[a,i]).filter(([a])=>a.part===pi&&(filter==='all'||(filter==='img'?a.imgs.length:!a.imgs.length)));
    if(!items.length)return'';
    const [pn,pt]=partLabel(p);
    return `<section><div class="ph"><span class="pn">${pn}</span><h2>${esc(pt)}</h2></div><div class="grid">${items.map(([a,i])=>{
      const th=a.imgs.length?`<img src="${a.imgs[0].replace('.jpg','_t.jpg')}" alt="" loading="lazy">${a.imgs.length>1?`<span class="badge">${a.imgs.length} infographics</span>`:''}`
        :`<div class="txt"><div class="q">${esc(a.title)}</div><div class="ex">${esc(a.excerpt)}…</div></div>`;
      const meta=a.imgs.length?'Infographic + article':'Article';
      return `<button class="card" data-i="${i}" id="c-${a.id}"><div class="thumb">${th}</div><div class="ct">${esc(a.title)}</div><div class="cm">${a.kind==='Framework'?'HMC framework · ':''}${meta}</div></button>`}).join('')}</div></section>`;
  }).join('');
}
render();
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
lib.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)open(+c.dataset.i)});

const ov=document.getElementById('ov'),mb=document.getElementById('mb');
let cur=-1,lastFocus=null;
function open(i,fromHash){
  if(cur<0)lastFocus=document.activeElement;
  cur=(i+A.length)%A.length;const a=A[cur];
  document.getElementById('mp').textContent=partLabel(D.parts[a.part]).filter(Boolean).join(' · ');
  document.getElementById('mt').textContent=a.title;
  mb.className='mb'+(a.imgs.length?'':' solo');
  mb.innerHTML=(a.imgs.length?`<div class="pics">${a.imgs.map(s=>`<a href="${s}" target="_blank" rel="noopener" title="Open full size"><img src="${s}" alt="${esc(a.title)} infographic"></a>`).join('')}</div>`:'')
    +`<div class="art"><div>${a.html}</div></div>`;
  mb.scrollTop=0;mb.querySelectorAll('.pics,.art').forEach(el=>el.scrollTop=0);
  ov.hidden=false;document.body.classList.add('lock');
  if(!fromHash&&location.hash!=='#'+a.id)history.replaceState(null,'','#'+a.id);
  document.getElementById('close').focus();
}
function close(){ov.hidden=true;document.body.classList.remove('lock');cur=-1;
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  if(lastFocus)lastFocus.focus()}
document.getElementById('close').onclick=close;
document.getElementById('prev').onclick=()=>open(cur-1);
document.getElementById('next').onclick=()=>open(cur+1);
ov.addEventListener('click',e=>{if(e.target===ov)close()});
document.addEventListener('keydown',e=>{if(ov.hidden)return;
  if(e.key==='Escape')close();else if(e.key==='ArrowRight')open(cur+1);else if(e.key==='ArrowLeft')open(cur-1)});
function fromHash(){const h=location.hash.slice(1);const i=A.findIndex(a=>a.id===h);if(i>=0)open(i,true);else if(!ov.hidden)close()}
window.addEventListener('hashchange',fromHash);fromHash();
</script>

</body>
</html>
